<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D94452"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">干擾因子 DAG — 為什麼淋浴的 RR 被灌水了？</text>

  <g filter="url(#shadow)">
    <rect x="30" y="50" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <rect x="280" y="68" width="240" height="44" rx="22" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">C：功能狀態 functional_status</text>

  <rect x="80" y="155" width="200" height="44" rx="22" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">暴露 Exposure：淋浴使用</text>

  <rect x="520" y="155" width="200" height="44" rx="22" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  <text x="620" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">結果 Outcome：感染</text>

  <line x1="330" y1="112" x2="230" y2="155" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="128" font-size="11" fill="#6B6B6B" transform="rotate(-25,250,128)">能走動 → 會用淋浴</text>

  <line x1="470" y1="112" x2="570" y2="155" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="128" font-size="11" fill="#6B6B6B" transform="rotate(25,540,128)">活動多 → 暴露機會多</text>

  <line x1="280" y1="177" x2="520" y2="177" stroke="#6A9BCC" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="8,4"/>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#6A9BCC" font-weight="bold">我們想研究的因果關係（可能被灌水）</text>

  <g filter="url(#shadow)">
    <rect x="30" y="240" width="355" height="165" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="207" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">生活比喻：穿雨衣和感冒</text>

  <text x="50" y="290" font-size="12" fill="#6B6B6B">觀察：穿雨衣的人比較容易感冒</text>
  <text x="50" y="310" font-size="12" fill="#6B6B6B">→ 穿雨衣會害你感冒？當然不是！</text>
  <text x="50" y="335" font-size="12" fill="#D97757" font-weight="bold">干擾因子 C：下雨天</text>
  <text x="50" y="355" font-size="12" fill="#6B6B6B">下雨 → 穿雨衣（C→暴露）</text>
  <text x="50" y="375" font-size="12" fill="#6B6B6B">下雨 → 容易感冒（C→結果）</text>
  <text x="50" y="395" font-size="12" fill="#788C5D" font-weight="bold">控制「下雨」後，雨衣跟感冒就無關了</text>

  <g filter="url(#shadow)">
    <rect x="415" y="240" width="355" height="165" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="592" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">干擾因子三要件（全部都要滿足）</text>

  <rect x="435" y="280" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="295" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">1</text>
  <text x="465" y="295" font-size="12" fill="#1A1A1A">C 與<tspan font-weight="bold" fill="#6A9BCC">暴露</tspan>有關聯</text>

  <rect x="435" y="310" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="325" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">2</text>
  <text x="465" y="325" font-size="12" fill="#1A1A1A">C 與<tspan font-weight="bold" fill="#D97757">結果</tspan>有關聯</text>

  <rect x="435" y="340" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="355" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">3</text>
  <text x="465" y="355" font-size="12" fill="#1A1A1A">C <tspan font-weight="bold" fill="#D94452">不是</tspan>暴露→結果路徑上的中間變項</text>

  <text x="465" y="393" font-size="11" fill="#6B6B6B">三條都打勾 → C 就是干擾因子 → 必須控制它！</text>
</svg>
