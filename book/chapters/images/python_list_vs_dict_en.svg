<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="460" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">List vs. Dict — Two Ways to Store Data</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">Similar items in a row vs. different topics sorted by label</text>

  <!-- LEFT: List -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="370" height="360" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="30" y="72" width="370" height="40" rx="10" fill="#6A9BCC" fill-opacity="0.12"/>
  <text x="215" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#6A9BCC">List — A Row of Cubbyholes</text>

  <text x="55" y="140" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">floor_wing_cases = [15, 10, 24, 25, 20, 27]</text>
  <text x="55" y="158" font-size="11" fill="#6B6B6B">Good for: ordered, same-type data (ordered sequence)</text>

  <!-- List boxes row -->
  <g>
    <rect x="50" y="180" width="50" height="50" rx="4" fill="#FAF8F3" stroke="#6A9BCC" stroke-width="1.5"/>
    <text x="75" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">15</text>
    <text x="75" y="248" text-anchor="middle" font-size="10" fill="#6B6B6B">[0]</text>

    <rect x="105" y="180" width="50" height="50" rx="4" fill="#FAF8F3" stroke="#6A9BCC" stroke-width="1.5"/>
    <text x="130" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">10</text>
    <text x="130" y="248" text-anchor="middle" font-size="10" fill="#6B6B6B">[1]</text>

    <rect x="160" y="180" width="50" height="50" rx="4" fill="#FAF8F3" stroke="#6A9BCC" stroke-width="1.5"/>
    <text x="185" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">24</text>
    <text x="185" y="248" text-anchor="middle" font-size="10" fill="#6B6B6B">[2]</text>

    <rect x="215" y="180" width="50" height="50" rx="4" fill="#D97757" fill-opacity="0.18" stroke="#D97757" stroke-width="2"/>
    <text x="240" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#D97757">25</text>
    <text x="240" y="248" text-anchor="middle" font-size="10" fill="#D97757" font-weight="bold">[3]</text>

    <rect x="270" y="180" width="50" height="50" rx="4" fill="#FAF8F3" stroke="#6A9BCC" stroke-width="1.5"/>
    <text x="295" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">20</text>
    <text x="295" y="248" text-anchor="middle" font-size="10" fill="#6B6B6B">[4]</text>

    <rect x="325" y="180" width="50" height="50" rx="4" fill="#FAF8F3" stroke="#6A9BCC" stroke-width="1.5"/>
    <text x="350" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">27</text>
    <text x="350" y="248" text-anchor="middle" font-size="10" fill="#6B6B6B">[5]</text>
  </g>

  <text x="215" y="272" text-anchor="middle" font-size="11" fill="#6B6B6B">Index starts at 0!</text>

  <rect x="50" y="295" width="330" height="120" rx="6" fill="#F5F3EE"/>
  <text x="65" y="315" font-size="12" font-weight="bold" fill="#1A1A1A">Access</text>
  <text x="65" y="335" font-size="12" font-family="Menlo, Monaco, monospace" fill="#D97757">floor_wing_cases[3]</text>
  <text x="65" y="350" font-size="11" fill="#6B6B6B">→ 25 (the 4th element)</text>

  <text x="65" y="378" font-size="12" font-weight="bold" fill="#1A1A1A">Operations</text>
  <text x="65" y="398" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">max() / min() / len() / sum()</text>

  <!-- RIGHT: Dict -->
  <g filter="url(#shadow)">
    <rect x="415" y="72" width="355" height="360" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="415" y="72" width="355" height="40" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="592" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#D97757">Dict — A Labeled Storage Box</text>

  <text x="435" y="140" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">outbreak = {"infected": 121, ...}</text>
  <text x="435" y="158" font-size="11" fill="#6B6B6B">Good for: different topics, by name (key-value)</text>

  <!-- Dict drawers -->
  <g>
    <rect x="435" y="180" width="315" height="32" rx="4" fill="#FAF8F3" stroke="#E8E5DF"/>
    <text x="450" y="201" font-size="12" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">"facility"</text>
    <text x="530" y="201" font-size="11" fill="#6B6B6B">→</text>
    <text x="555" y="201" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">"Songbai Nursing Home"</text>

    <rect x="435" y="217" width="315" height="32" rx="4" fill="#FAF8F3" stroke="#E8E5DF"/>
    <text x="450" y="238" font-size="12" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">"pathogen"</text>
    <text x="530" y="238" font-size="11" fill="#6B6B6B">→</text>
    <text x="555" y="238" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">"Legionella"</text>

    <rect x="435" y="254" width="315" height="32" rx="4" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
    <text x="450" y="275" font-size="12" font-family="Menlo, Monaco, monospace" fill="#D97757" font-weight="bold">"infected"</text>
    <text x="530" y="275" font-size="11" fill="#6B6B6B">→</text>
    <text x="555" y="275" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A" font-weight="bold">121</text>

    <rect x="435" y="291" width="315" height="32" rx="4" fill="#FAF8F3" stroke="#E8E5DF"/>
    <text x="450" y="312" font-size="12" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">"deaths"</text>
    <text x="530" y="312" font-size="11" fill="#6B6B6B">→</text>
    <text x="555" y="312" font-size="12" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">19</text>
  </g>

  <rect x="435" y="335" width="315" height="80" rx="6" fill="#F5F3EE"/>
  <text x="450" y="355" font-size="12" font-weight="bold" fill="#1A1A1A">Access (by key)</text>
  <text x="450" y="375" font-size="12" font-family="Menlo, Monaco, monospace" fill="#D97757">outbreak["infected"]</text>
  <text x="450" y="390" font-size="11" fill="#6B6B6B">→ 121 (by name, no need to remember order)</text>
  <text x="450" y="408" font-size="10" fill="#D94452">⚠ Misspelled key → KeyError</text>
</svg>
