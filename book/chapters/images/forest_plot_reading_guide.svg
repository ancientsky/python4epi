<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="callout" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="3" fill="#6B6B6B"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">怎麼看森林圖（Forest Plot）？</text>

  <!-- Main plot area -->
  <g filter="url(#shadow)">
    <rect x="30" y="45" width="450" height="240" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- Y-axis labels -->
  <text x="130" y="110" text-anchor="end" font-size="13" fill="#1A1A1A">淋浴使用</text>
  <text x="130" y="165" text-anchor="end" font-size="13" fill="#1A1A1A">水療使用</text>
  <text x="130" y="220" text-anchor="end" font-size="13" fill="#1A1A1A">糖尿病共病</text>

  <!-- X-axis -->
  <line x1="150" y1="250" x2="460" y2="250" stroke="#1A1A1A" stroke-width="1"/>
  <text x="200" y="268" text-anchor="middle" font-size="10" fill="#6B6B6B">0.5</text>
  <line x1="200" y1="247" x2="200" y2="253" stroke="#1A1A1A" stroke-width="1"/>
  <text x="280" y="268" text-anchor="middle" font-size="11" fill="#6A9BCC" font-weight="bold">1.0</text>
  <line x1="280" y1="247" x2="280" y2="253" stroke="#1A1A1A" stroke-width="1"/>
  <text x="360" y="268" text-anchor="middle" font-size="10" fill="#6B6B6B">2.0</text>
  <line x1="360" y1="247" x2="360" y2="253" stroke="#1A1A1A" stroke-width="1"/>
  <text x="440" y="268" text-anchor="middle" font-size="10" fill="#6B6B6B">3.0</text>
  <line x1="440" y1="247" x2="440" y2="253" stroke="#1A1A1A" stroke-width="1"/>
  <text x="305" y="282" text-anchor="middle" font-size="11" fill="#1A1A1A">Risk Ratio (95% CI)</text>

  <!-- Null line at RR=1 -->
  <line x1="280" y1="55" x2="280" y2="250" stroke="#6A9BCC" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Factor A: Significant (RR=2.5, CI 1.5-4.0) -->
  <line x1="340" y1="105" x2="450" y2="105" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="340" y1="100" x2="340" y2="110" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="450" y1="100" x2="450" y2="110" stroke="#6B6B6B" stroke-width="2"/>
  <circle cx="400" cy="105" r="7" fill="#D97757"/>

  <!-- Factor B: Not significant (RR=1.3, CI 0.7-2.2) -->
  <line x1="235" y1="160" x2="375" y2="160" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="235" y1="155" x2="235" y2="165" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="375" y1="155" x2="375" y2="165" stroke="#6B6B6B" stroke-width="2"/>
  <circle cx="310" cy="160" r="7" fill="#D97757"/>

  <!-- Factor C: Possibly protective (RR=0.8, CI 0.5-1.4) -->
  <line x1="200" y1="215" x2="320" y2="215" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="200" y1="210" x2="200" y2="220" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="320" y1="210" x2="320" y2="220" stroke="#6B6B6B" stroke-width="2"/>
  <circle cx="255" cy="215" r="7" fill="#D97757"/>

  <!-- Right panel: Annotations -->
  <g filter="url(#shadow)">
    <rect x="500" y="45" width="200" height="240" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- Annotation: Dot -->
  <circle cx="520" cy="75" r="6" fill="#D97757"/>
  <text x="535" y="72" font-size="11" font-weight="bold" fill="#D97757">圓點</text>
  <text x="535" y="87" font-size="11" fill="#6B6B6B">= 點估計值（RR）</text>

  <!-- Annotation: Whisker -->
  <line x1="514" y1="110" x2="546" y2="110" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="514" y1="105" x2="514" y2="115" stroke="#6B6B6B" stroke-width="2"/>
  <line x1="546" y1="105" x2="546" y2="115" stroke="#6B6B6B" stroke-width="2"/>
  <text x="558" y="108" font-size="11" font-weight="bold" fill="#6B6B6B">水平線段</text>
  <text x="558" y="122" font-size="11" fill="#6B6B6B">= 95% 信賴區間</text>

  <!-- Annotation: Null line -->
  <line x1="515" y1="142" x2="545" y2="142" stroke="#6A9BCC" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="558" y="140" font-size="11" font-weight="bold" fill="#6A9BCC">虛線</text>
  <text x="558" y="154" font-size="11" fill="#6B6B6B">= RR = 1（無效果）</text>

  <!-- Interpretation boxes -->
  <rect x="510" y="172" width="180" height="38" rx="6" fill="#D97757" fill-opacity="0.1" stroke="#D97757" stroke-width="1"/>
  <text x="516" y="188" font-size="11" fill="#D97757" font-weight="bold">CI 在虛線右側</text>
  <text x="516" y="203" font-size="11" fill="#D97757">→ 統計顯著，風險增加</text>

  <rect x="510" y="218" width="180" height="38" rx="6" fill="#6A9BCC" fill-opacity="0.1" stroke="#6A9BCC" stroke-width="1"/>
  <text x="516" y="234" font-size="11" fill="#6A9BCC" font-weight="bold">CI 跨過虛線</text>
  <text x="516" y="249" font-size="11" fill="#6A9BCC">→ 不顯著，無法排除 RR=1</text>

  <rect x="510" y="262" width="180" height="22" rx="4" fill="#788C5D" fill-opacity="0.08"/>
  <text x="516" y="278" font-size="10" fill="#788C5D">CI 在虛線左側 → 保護因子</text>

  <!-- Callout lines connecting annotations to plot -->
  <line x1="460" y1="105" x2="514" y2="75" stroke="#D97757" stroke-width="1" stroke-dasharray="3" opacity="0.5"/>
  <line x1="375" y1="160" x2="510" y2="230" stroke="#6A9BCC" stroke-width="1" stroke-dasharray="3" opacity="0.5"/>

  <!-- Bottom note -->
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="bold">一張森林圖 = 一眼比較所有暴露因子的效應量和顯著性</text>
  <text x="360" y="330" text-anchor="middle" font-size="11" fill="#6B6B6B">注意：粗 RR 可能受干擾因子影響，需要 Ch05 分層分析進一步確認</text>
</svg>
