<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Time Series Method Map</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">Choose the best model based on data volume and needs (simple → complex)</text>

  <!-- Axis arrow -->
  <line x1="60" y1="100" x2="740" y2="100" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow-end)"/>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <text x="60" y="88" font-size="11" fill="#6B6B6B">simple</text>
  <text x="720" y="88" text-anchor="end" font-size="11" fill="#6B6B6B">complex</text>
  <text x="400" y="125" text-anchor="middle" font-size="11" fill="#6B6B6B">Data volume vs. model complexity needed</text>

  <!-- 6 method cards arranged in 2 rows × 3 cols -->

  <!-- Row 1: simple methods -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>
  </g>
  <rect x="30" y="150" width="240" height="36" rx="10" fill="#788C5D" fill-opacity="0.12"/>
  <text x="150" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#788C5D">① Rolling Mean</text>
  <text x="45" y="205" font-size="11" fill="#1A1A1A" font-weight="bold">Rolling average (baseline)</text>
  <text x="45" y="223" font-size="11" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">5 days</tspan></text>
  <text x="45" y="241" font-size="11" fill="#6B6B6B">Seasonality: ✗  CI: ✗</text>
  <text x="45" y="265" font-size="10" fill="#6B6B6B">Pros: simple, intuitive, fast</text>
  <text x="45" y="282" font-size="10" fill="#6B6B6B">Cons: slow, misses turning points</text>
  <text x="45" y="299" font-size="10" fill="#D97757" font-weight="bold">→ Quick estimates in the field</text>

  <g filter="url(#shadow)">
    <rect x="280" y="150" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="280" y="150" width="240" height="36" rx="10" fill="#6A9BCC" fill-opacity="0.12"/>
  <text x="400" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">② Poisson + Lag</text>
  <text x="295" y="205" font-size="11" fill="#1A1A1A" font-weight="bold">Poisson regression (counts)</text>
  <text x="295" y="223" font-size="11" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">10 days</tspan></text>
  <text x="295" y="241" font-size="11" fill="#6B6B6B">Seasonality: partial  CI: ✓</text>
  <text x="295" y="265" font-size="9" fill="#6B6B6B">Pros: supports predictors (lag, trend)</text>
  <text x="295" y="282" font-size="10" fill="#6B6B6B">Cons: assumes variance = mean</text>
  <text x="295" y="299" font-size="10" fill="#D97757" font-weight="bold">→ Daily case count forecasting</text>

  <g filter="url(#shadow)">
    <rect x="530" y="150" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="530" y="150" width="240" height="36" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="650" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">③ Negative Binomial</text>
  <text x="545" y="205" font-size="9" fill="#1A1A1A" font-weight="bold">Negative binomial (overdispersion)</text>
  <text x="545" y="223" font-size="11" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">10 days</tspan></text>
  <text x="545" y="241" font-size="11" fill="#6B6B6B">Seasonality: partial  CI: ✓</text>
  <text x="545" y="265" font-size="10" fill="#6B6B6B">Pros: allows variance &gt; mean</text>
  <text x="545" y="282" font-size="10" fill="#6B6B6B">Cons: one extra α parameter</text>
  <text x="545" y="299" font-size="10" fill="#D97757" font-weight="bold">→ Overdispersed outbreak data</text>

  <!-- Row 2: advanced methods -->
  <g filter="url(#shadow)">
    <rect x="30" y="330" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#D94452" stroke-width="2"/>
  </g>
  <rect x="30" y="330" width="240" height="36" rx="10" fill="#D94452" fill-opacity="0.12"/>
  <text x="150" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#D94452">④ Logistic Regression</text>
  <text x="45" y="385" font-size="9" fill="#1A1A1A" font-weight="bold">Logistic regression (binary alert)</text>
  <text x="45" y="403" font-size="11" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">10 days</tspan></text>
  <text x="45" y="421" font-size="11" fill="#6B6B6B">Output: yes/no  Probability: ✓</text>
  <text x="45" y="445" font-size="10" fill="#6B6B6B">Pros: good for threshold alerts</text>
  <text x="45" y="462" font-size="9" fill="#6B6B6B">Cons: doesn't forecast actual counts</text>
  <text x="45" y="479" font-size="10" fill="#D97757" font-weight="bold">→ Early warning systems</text>

  <g filter="url(#shadow)">
    <rect x="280" y="330" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="280" y="330" width="240" height="36" rx="10" fill="#6A9BCC" fill-opacity="0.12"/>
  <text x="400" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">⑤ ARIMA</text>
  <text x="295" y="385" font-size="9" fill="#1A1A1A" font-weight="bold">Autoregressive integrated moving avg</text>
  <text x="295" y="403" font-size="11" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">30 days</tspan></text>
  <text x="295" y="421" font-size="11" fill="#6B6B6B">Seasonality: weak  CI: ✓</text>
  <text x="295" y="445" font-size="9" fill="#6B6B6B">Pros: captures trend + autocorrelation</text>
  <text x="295" y="462" font-size="9" fill="#6B6B6B">Cons: needs stationarity, tune 3 orders</text>
  <text x="295" y="479" font-size="10" fill="#D97757" font-weight="bold">→ Medium/long-term forecasts</text>

  <g filter="url(#shadow)">
    <rect x="530" y="330" width="240" height="160" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="530" y="330" width="240" height="36" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="650" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">⑥ SARIMA</text>
  <text x="545" y="385" font-size="11" fill="#1A1A1A" font-weight="bold">Seasonal ARIMA</text>
  <text x="545" y="403" font-size="10" fill="#6B6B6B">Needs at least <tspan font-weight="bold" fill="#1A1A1A">60 days (2+ cycles)</tspan></text>
  <text x="545" y="421" font-size="11" fill="#6B6B6B">Seasonality: ✓✓  CI: ✓</text>
  <text x="545" y="445" font-size="9" fill="#6B6B6B">Pros: captures weekly/yearly patterns</text>
  <text x="545" y="462" font-size="10" fill="#6B6B6B">Cons: many parameters, slow to fit</text>
  <text x="545" y="479" font-size="10" fill="#D97757" font-weight="bold">→ Weekly ILI surveillance</text>
</svg>
