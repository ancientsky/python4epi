<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowFlow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90D9"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7F8C8D"/>
    </marker>
    <filter id="shadow3" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="#FAFBFC" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2C3E50">每天的 Git 工作流程</text>

  <!-- Step 1: Edit files -->
  <g filter="url(#shadow3)">
    <rect x="30" y="55" width="140" height="100" rx="10" fill="#EBF5FB" stroke="#4A90D9" stroke-width="2"/>
    <text x="100" y="82" text-anchor="middle" font-size="28">✏️</text>
    <text x="100" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">修改程式碼</text>
    <text x="100" y="128" text-anchor="middle" font-size="11" fill="#7F8C8D">寫分析、改公式</text>
    <text x="100" y="144" text-anchor="middle" font-size="11" fill="#7F8C8D">做你平常的工作</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="175" y1="105" x2="210" y2="105" stroke="#4A90D9" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- Step 2: git status -->
  <g filter="url(#shadow3)">
    <rect x="220" y="55" width="140" height="100" rx="10" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
    <text x="290" y="82" text-anchor="middle" font-size="28">🔍</text>
    <text x="290" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">檢查狀態</text>
    <rect x="245" y="118" width="90" height="20" rx="4" fill="#F39C12"/>
    <text x="290" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="monospace">git status</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="365" y1="105" x2="400" y2="105" stroke="#4A90D9" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- Step 3: git add -->
  <g filter="url(#shadow3)">
    <rect x="410" y="55" width="140" height="100" rx="10" fill="#EAFAF1" stroke="#27AE60" stroke-width="2"/>
    <text x="480" y="82" text-anchor="middle" font-size="28">📋</text>
    <text x="480" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">加入暫存</text>
    <rect x="440" y="118" width="80" height="20" rx="4" fill="#27AE60"/>
    <text x="480" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="monospace">git add</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="555" y1="105" x2="590" y2="105" stroke="#4A90D9" stroke-width="2.5" marker-end="url(#arrowFlow)"/>

  <!-- Step 4: git commit -->
  <g filter="url(#shadow3)">
    <rect x="600" y="55" width="170" height="100" rx="10" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
    <text x="685" y="82" text-anchor="middle" font-size="28">📸</text>
    <text x="685" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50">拍快照存檔</text>
    <rect x="625" y="118" width="120" height="20" rx="4" fill="#8E44AD"/>
    <text x="685" y="133" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF" font-family="monospace">git commit -m "..."</text>
  </g>

  <!-- Loop arrow (back to step 1) -->
  <path d="M 685 160 L 685 210 Q 685 230 665 230 L 120 230 Q 100 230 100 210 L 100 160"
        fill="none" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowLoop)"/>
  <rect x="330" y="218" width="140" height="24" rx="6" fill="#F8F9FA" stroke="#BDC3C7" stroke-width="1"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" fill="#7F8C8D">繼續下一個修改 🔄</text>

  <!-- Bottom hint -->
  <text x="400" y="270" text-anchor="middle" font-size="12" fill="#95A5A6">每完成一個有意義的小步驟就 commit 一次，不要等到全部做完！</text>
</svg>