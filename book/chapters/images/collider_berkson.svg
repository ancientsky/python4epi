<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1A1A1A"/></marker>
  </defs>
  <rect width="800" height="420" fill="#FAF8F3" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">碰撞因子陷阱：只看住院病人會冒出假關聯</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#6B6B6B">只挑住院的人來分析，兩個沒關係的變數也會變得「有關係」</text>

  <!-- Left: DAG panel -->
  <g filter="url(#shadow)"><rect x="20" y="75" width="360" height="270" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/></g>
  <text x="200" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">暴露 → 住院 ← 疾病嚴重度</text>

  <rect x="40" y="115" width="140" height="40" rx="20" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="1.8"/>
  <text x="110" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">暴露</text>

  <rect x="220" y="115" width="140" height="40" rx="20" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="1.8"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">疾病嚴重度</text>

  <rect x="120" y="250" width="160" height="40" rx="20" fill="#D94452" fill-opacity="0.15" stroke="#D94452" stroke-width="2"/>
  <text x="200" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#D94452">住院（碰撞因子）</text>

  <line x1="110" y1="155" x2="175" y2="250" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="290" y1="155" x2="225" y2="250" stroke="#1A1A1A" stroke-width="1.8" marker-end="url(#ar)"/>

  <text x="200" y="320" text-anchor="middle" font-size="10.5" fill="#6B6B6B">兩個原本無關的變數，同時決定了「會不會住院」</text>

  <!-- Right: two scatter mini-panels -->
  <g filter="url(#shadow)"><rect x="400" y="75" width="180" height="270" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/></g>
  <text x="490" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A1A1A">全體樣本</text>
  <line x1="425" y1="130" x2="425" y2="255" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="425" y1="255" x2="555" y2="255" stroke="#1A1A1A" stroke-width="1"/>
  <text x="490" y="268" text-anchor="middle" font-size="7.5" fill="#6B6B6B">暴露 →</text>
  <text x="414" y="192" text-anchor="middle" font-size="7.5" fill="#6B6B6B" transform="rotate(-90,414,192)">嚴重度 →</text>
  <g fill="#6A9BCC" fill-opacity="0.75">
    <circle cx="438" cy="180" r="2.6"/><circle cx="451" cy="224" r="2.6"/><circle cx="458" cy="161" r="2.6"/>
    <circle cx="471" cy="205" r="2.6"/><circle cx="477" cy="149" r="2.6"/><circle cx="484" cy="236" r="2.6"/>
    <circle cx="490" cy="186" r="2.6"/><circle cx="497" cy="218" r="2.6"/><circle cx="503" cy="168" r="2.6"/>
    <circle cx="510" cy="230" r="2.6"/><circle cx="523" cy="180" r="2.6"/><circle cx="529" cy="211" r="2.6"/>
    <circle cx="536" cy="155" r="2.6"/><circle cx="542" cy="199" r="2.6"/>
  </g>
  <text x="490" y="292" text-anchor="middle" font-size="8.5" fill="#6B6B6B">全體：暴露 vs 嚴重度</text>
  <text x="490" y="303" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#788C5D">無關</text>

  <g filter="url(#shadow)"><rect x="600" y="75" width="180" height="270" rx="10" fill="#FFFFFF" stroke="#D94452" stroke-width="1.5"/></g>
  <text x="690" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#D94452">僅住院者</text>
  <line x1="625" y1="130" x2="625" y2="255" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="625" y1="255" x2="755" y2="255" stroke="#1A1A1A" stroke-width="1"/>
  <text x="690" y="268" text-anchor="middle" font-size="7.5" fill="#6B6B6B">暴露 →</text>
  <text x="614" y="192" text-anchor="middle" font-size="7.5" fill="#6B6B6B" transform="rotate(-90,614,192)">嚴重度 →</text>
  <g fill="#D94452" fill-opacity="0.75">
    <circle cx="635" cy="149" r="2.6"/><circle cx="645" cy="158" r="2.6"/><circle cx="654" cy="143" r="2.6"/>
    <circle cx="664" cy="170" r="2.6"/><circle cx="674" cy="165" r="2.6"/><circle cx="684" cy="186" r="2.6"/>
    <circle cx="690" cy="180" r="2.6"/><circle cx="700" cy="203" r="2.6"/><circle cx="710" cy="195" r="2.6"/>
    <circle cx="719" cy="218" r="2.6"/><circle cx="726" cy="211" r="2.6"/><circle cx="736" cy="233" r="2.6"/>
    <circle cx="742" cy="228" r="2.6"/><circle cx="749" cy="243" r="2.6"/>
  </g>
  <path d="M 635 152 L 749 240" stroke="#D94452" stroke-width="1.3" stroke-dasharray="4,3" fill="none" opacity="0.55"/>
  <text x="690" y="292" text-anchor="middle" font-size="8.5" fill="#6B6B6B">只看住院者：出現</text>
  <text x="690" y="303" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#D94452">假的負相關</text>

  <!-- Footer -->
  <g><rect x="150" y="358" width="500" height="45" rx="10" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1.3"/></g>
  <text x="400" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A1A1A">對碰撞因子（住院）做條件化 = Berkson's paradox</text>
</svg>
