<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
  </defs>

  <rect width="800" height="680" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">四種流行病學研究設計——用對方法，才能算對指標</text>

  <!-- ===== Card 1: Cohort Study ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="48" width="370" height="265" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  </g>
  <rect x="20" y="48" width="370" height="30" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="30" y="69" font-size="14" font-weight="bold" fill="#D97757">❶ 世代研究 Cohort Study</text>
  <text x="345" y="69" font-size="11" fill="#D97757" font-weight="bold">→ 算 RR</text>

  <!-- Diagram -->
  <rect x="40" y="90" width="70" height="28" rx="6" fill="#D97757" fill-opacity="0.15"/>
  <text x="75" y="109" text-anchor="middle" font-size="11" fill="#D97757">暴露組</text>
  <rect x="40" y="128" width="70" height="28" rx="6" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="75" y="147" text-anchor="middle" font-size="11" fill="#6A9BCC">未暴露組</text>

  <line x1="110" y1="104" x2="200" y2="104" stroke="#D97757" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="110" y1="142" x2="200" y2="142" stroke="#6A9BCC" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="155" y="96" text-anchor="middle" font-size="9" fill="#6B6B6B">追蹤</text>
  <text x="155" y="134" text-anchor="middle" font-size="9" fill="#6B6B6B">追蹤</text>

  <circle cx="220" cy="95" r="6" fill="#D94452"/>
  <circle cx="240" cy="95" r="6" fill="#D94452"/>
  <circle cx="260" cy="95" r="6" fill="#788C5D"/>
  <circle cx="280" cy="95" r="6" fill="#788C5D"/>
  <circle cx="300" cy="95" r="6" fill="#788C5D"/>
  <text x="260" y="84" text-anchor="middle" font-size="8" fill="#6B6B6B">結果</text>

  <circle cx="220" cy="148" r="6" fill="#D94452"/>
  <circle cx="240" cy="148" r="6" fill="#788C5D"/>
  <circle cx="260" cy="148" r="6" fill="#788C5D"/>
  <circle cx="280" cy="148" r="6" fill="#788C5D"/>
  <circle cx="300" cy="148" r="6" fill="#788C5D"/>

  <text x="40" y="182" font-size="11" fill="#1A1A1A" font-weight="bold">白話文：</text>
  <text x="40" y="198" font-size="11" fill="#6B6B6B">先看你有沒有淋雨（暴露），</text>
  <text x="40" y="214" font-size="11" fill="#6B6B6B">然後追蹤看你會不會感冒（結果）。</text>
  <text x="40" y="234" font-size="11" fill="#D97757">🎯 比喻：跟拍紀錄片——先選好角色，</text>
  <text x="40" y="250" font-size="11" fill="#D97757">一路跟拍到結局。有完整分母 → 算 RR。</text>
  <text x="40" y="270" font-size="11" fill="#6B6B6B">📌 本次調查 = 回溯性世代（280人全員）</text>
  <text x="40" y="300" font-size="10" fill="#788C5D" font-weight="bold">✅ 優點：直接算風險，因果時序清楚</text>

  <!-- ===== Card 2: Case-Control Study ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="48" width="370" height="265" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  </g>
  <rect x="410" y="48" width="370" height="30" rx="10" fill="#6A9BCC" fill-opacity="0.12"/>
  <text x="420" y="69" font-size="14" font-weight="bold" fill="#6A9BCC">❷ 病例對照 Case-Control Study</text>
  <text x="735" y="69" font-size="11" fill="#6A9BCC" font-weight="bold">→ 算 OR</text>

  <!-- Diagram: reverse arrow -->
  <rect x="620" y="90" width="70" height="28" rx="6" fill="#D94452" fill-opacity="0.15"/>
  <text x="655" y="109" text-anchor="middle" font-size="11" fill="#D94452">病例</text>
  <rect x="620" y="128" width="70" height="28" rx="6" fill="#788C5D" fill-opacity="0.15"/>
  <text x="655" y="147" text-anchor="middle" font-size="11" fill="#788C5D">對照</text>

  <line x1="620" y1="104" x2="520" y2="104" stroke="#D94452" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="142" x2="520" y2="142" stroke="#788C5D" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="570" y="96" text-anchor="middle" font-size="9" fill="#6B6B6B">回溯暴露</text>
  <text x="570" y="134" text-anchor="middle" font-size="9" fill="#6B6B6B">回溯暴露</text>

  <rect x="435" y="88" width="70" height="16" rx="4" fill="#D97757" fill-opacity="0.3"/>
  <text x="470" y="100" text-anchor="middle" font-size="8" fill="#D97757">有暴露?</text>
  <rect x="435" y="108" width="70" height="16" rx="4" fill="#E8E5DF"/>
  <text x="470" y="120" text-anchor="middle" font-size="8" fill="#6B6B6B">無暴露?</text>
  <rect x="435" y="132" width="70" height="16" rx="4" fill="#D97757" fill-opacity="0.3"/>
  <text x="470" y="144" text-anchor="middle" font-size="8" fill="#D97757">有暴露?</text>
  <rect x="435" y="152" width="70" height="16" rx="4" fill="#E8E5DF"/>
  <text x="470" y="164" text-anchor="middle" font-size="8" fill="#6B6B6B">無暴露?</text>

  <text x="430" y="192" font-size="11" fill="#1A1A1A" font-weight="bold">白話文：</text>
  <text x="430" y="208" font-size="11" fill="#6B6B6B">先找到生病的人（病例），再找沒病的人（對照），</text>
  <text x="430" y="224" font-size="11" fill="#6B6B6B">回頭問他們以前有沒有淋雨。</text>
  <text x="430" y="244" font-size="11" fill="#6A9BCC">🕵️ 比喻：偵探辦案——先有受害者，</text>
  <text x="430" y="260" font-size="11" fill="#6A9BCC">再回頭查嫌疑人的行蹤。分母是人選的 → 只能算 OR。</text>
  <text x="430" y="280" font-size="10" fill="#6B6B6B">📌 適合：罕見疾病、全國性調查、疫苗效益研究</text>
  <text x="430" y="300" font-size="10" fill="#788C5D" font-weight="bold">✅ 優點：快速、省錢、適合罕見疾病</text>

  <!-- ===== Card 3: Nested Case-Control ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="328" width="370" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="20" y="328" width="370" height="30" rx="10" fill="#788C5D" fill-opacity="0.12"/>
  <text x="30" y="349" font-size="13" font-weight="bold" fill="#788C5D">❸ 巢式病例對照 Nested Case-Control</text>

  <text x="40" y="376" font-size="11" fill="#1A1A1A" font-weight="bold">白話文：</text>
  <text x="40" y="392" font-size="11" fill="#6B6B6B">已經有一個世代研究在追蹤了（像監視器全程錄影），</text>
  <text x="40" y="408" font-size="11" fill="#6B6B6B">但抽血化驗太貴，只好從生病的人裡挑一些出來，</text>
  <text x="40" y="424" font-size="11" fill="#6B6B6B">再從同一世代裡配對沒生病的人，回頭做檢驗。</text>
  <text x="40" y="446" font-size="11" fill="#788C5D">🏠 比喻：大社區裝了監視器，但翻錄影帶太累，</text>
  <text x="40" y="462" font-size="11" fill="#788C5D">只挑出案發那幾段來看。效率高但有世代的基底。</text>
  <text x="40" y="480" font-size="10" fill="#6B6B6B">📌 常見於：大型前瞻性世代中的生物標記研究</text>

  <!-- ===== Card 4: Matched Case-Control ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="328" width="370" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="410" y="328" width="370" height="30" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="420" y="349" font-size="13" font-weight="bold" fill="#D97757">❹ 配對病例對照 Matched Case-Control</text>

  <text x="430" y="376" font-size="11" fill="#1A1A1A" font-weight="bold">白話文：</text>
  <text x="430" y="392" font-size="11" fill="#6B6B6B">找到一個病例（70歲男性），就特地找一個</text>
  <text x="430" y="408" font-size="11" fill="#6B6B6B">年齡、性別相近但沒生病的人配成一對。</text>
  <text x="430" y="424" font-size="11" fill="#6B6B6B">這樣年齡和性別就「抵消」了，不會干擾結果。</text>
  <text x="430" y="446" font-size="11" fill="#D97757">👯 比喻：雙胞胎實驗——找一個「條件差不多的分身」，</text>
  <text x="430" y="462" font-size="11" fill="#D97757">兩人唯一差別是有沒有暴露。</text>
  <text x="430" y="480" font-size="10" fill="#6B6B6B">📌 分析時要用條件式邏輯斯迴歸（conditional logistic）</text>

  <!-- ===== Bottom summary: when to use which ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="505" width="760" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="40" y="530" font-size="14" font-weight="bold" fill="#1A1A1A">🗺️ 選擇指南：什麼時候用哪種？</text>

  <!-- Row 1 -->
  <rect x="40" y="542" width="180" height="24" rx="5" fill="#D97757" fill-opacity="0.1"/>
  <text x="130" y="559" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">群聚調查（全員資料）</text>
  <text x="235" y="559" font-size="11" fill="#1A1A1A">→ 世代研究 → <tspan font-weight="bold" fill="#D97757">RR</tspan></text>

  <!-- Row 2 -->
  <rect x="40" y="572" width="180" height="24" rx="5" fill="#6A9BCC" fill-opacity="0.1"/>
  <text x="130" y="589" text-anchor="middle" font-size="11" fill="#6A9BCC" font-weight="bold">罕見疾病 / 大規模族群</text>
  <text x="235" y="589" font-size="11" fill="#1A1A1A">→ 病例對照 → <tspan font-weight="bold" fill="#6A9BCC">OR</tspan></text>

  <!-- Row 3 -->
  <rect x="40" y="602" width="180" height="24" rx="5" fill="#788C5D" fill-opacity="0.1"/>
  <text x="130" y="619" text-anchor="middle" font-size="11" fill="#788C5D" font-weight="bold">疫苗效益 VE 估算</text>
  <text x="235" y="619" font-size="11" fill="#1A1A1A">→ 世代用 1−RR，病例對照用 1−OR（罕見時等價）</text>

  <!-- Row 4 -->
  <rect x="40" y="632" width="180" height="24" rx="5" fill="#6B6B6B" fill-opacity="0.1"/>
  <text x="130" y="649" text-anchor="middle" font-size="11" fill="#6B6B6B" font-weight="bold">邏輯斯迴歸</text>
  <text x="235" y="649" font-size="11" fill="#1A1A1A">→ 原生輸出 = <tspan font-weight="bold">OR</tspan>（不論研究設計）</text>

</svg>
