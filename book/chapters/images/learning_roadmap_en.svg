  <rect x="420" y="355" width="305" height="35" rx="8" fill="#FFFFFF" stroke="#D97757" stroke-width="1" stroke-dasharray="4"/>
  <text x="572" y="377" text-anchor="middle" font-size="12" fill="#D97757">Finish the core, then pick electives freely!</text>

  <rect x="420" y="405" width="305" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  <text x="572" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Tools &amp; Practice</text>
  <text x="435" y="450" font-size="11" fill="#6B6B6B">Ch 15 Appendix — Quick Reference</text>
