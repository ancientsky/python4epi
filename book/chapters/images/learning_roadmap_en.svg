    <text x="652" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">Ch 14 Case Study</text>
    <text x="652" y="332" text-anchor="middle" font-size="9" fill="#6B6B6B">Full case walkthrough</text>
