    <text x="492" y="314" text-anchor="middle" font-size="8" font-weight="bold" fill="#D97757">Ch 13 Reproducible Research</text>
    <text x="492" y="332" text-anchor="middle" font-size="9" fill="#6B6B6B">Automated reports, Docker</text>
