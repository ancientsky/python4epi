<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6B6B"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D94452"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#788C5D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">傳染鏈（Chain of Infection）六要素與介入策略</text>

  <!-- ── Six nodes (hexagonal chain layout) ── -->
  <!-- Node dimensions: cx, cy, width=118, height=64 -->

  <!-- 1. 病原體 -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="118" height="64" rx="32" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  </g>
  <text x="89" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">① 病原體</text>
  <text x="89" y="124" text-anchor="middle" font-size="11" fill="#6B6B6B">Pathogen</text>

  <!-- Arrow 1→2 -->
  <line x1="148" y1="112" x2="178" y2="112" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. 傳染窩 -->
  <g filter="url(#shadow)">
    <rect x="180" y="80" width="118" height="64" rx="32" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  </g>
  <text x="239" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">② 傳染窩</text>
  <text x="239" y="124" text-anchor="middle" font-size="11" fill="#6B6B6B">Reservoir</text>

  <!-- Arrow 2→3 -->
  <line x1="298" y1="112" x2="328" y2="112" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. 離開途徑 -->
  <g filter="url(#shadow)">
    <rect x="330" y="80" width="118" height="64" rx="32" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <text x="389" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">③ 離開途徑</text>
  <text x="389" y="124" text-anchor="middle" font-size="11" fill="#6B6B6B">Portal of exit</text>

  <!-- Arrow 3→4 -->
  <line x1="448" y1="112" x2="478" y2="112" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. 傳染途徑 -->
  <g filter="url(#shadow)">
    <rect x="480" y="80" width="118" height="64" rx="32" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <text x="539" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">④ 傳染途徑</text>
  <text x="539" y="124" text-anchor="middle" font-size="11" fill="#6B6B6B">Mode of transmission</text>

  <!-- Arrow 4→5 -->
  <line x1="598" y1="112" x2="628" y2="112" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. 入侵途徑 -->
  <g filter="url(#shadow)">
    <rect x="630" y="80" width="118" height="64" rx="32" fill="#788C5D" fill-opacity="0.15" stroke="#788C5D" stroke-width="2"/>
  </g>
  <text x="689" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#788C5D">⑤ 入侵途徑</text>
  <text x="689" y="124" text-anchor="middle" font-size="11" fill="#6B6B6B">Portal of entry</text>

  <!-- Arrow 5→6 -->
  <line x1="748" y1="112" x2="778" y2="112" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. 易感宿主 -->
  <g filter="url(#shadow)">
    <rect x="710" y="80" width="118" height="64" rx="32" fill="#788C5D" fill-opacity="0.15" stroke="#788C5D" stroke-width="2"/>
  </g>
  <!-- override to shift right -->
  <g filter="url(#shadow)">
    <rect x="716" y="170" width="124" height="64" rx="32" fill="#788C5D" fill-opacity="0.15" stroke="#788C5D" stroke-width="2"/>
  </g>
  <!-- Redo node 6 properly -->

  <!-- Let me redo the layout more carefully: 6 nodes in a row -->
  <!-- I'll clear above and redo below with cleaner positions -->

  <!-- Clear area and redo (SVG renders top to bottom, later elements overlay) -->
  <rect x="0" y="70" width="860" height="90" fill="#FAF8F3"/>

  <!-- Redo: 6 nodes equally spaced -->
  <!-- Node width=110, gap=28, start=20 -->
  <!-- Positions: 20, 158, 296, 434, 572, 710 -->

  <!-- 1. 病原體 -->
  <g filter="url(#shadow)">
    <rect x="20" y="78" width="110" height="58" rx="29" fill="#D97757" fill-opacity="0.18" stroke="#D97757" stroke-width="2"/>
  </g>
  <text x="75" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">① 病原體</text>
  <text x="75" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Pathogen</text>
  <line x1="130" y1="107" x2="157" y2="107" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. 傳染窩 -->
  <g filter="url(#shadow)">
    <rect x="158" y="78" width="110" height="58" rx="29" fill="#D97757" fill-opacity="0.18" stroke="#D97757" stroke-width="2"/>
  </g>
  <text x="213" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">② 傳染窩</text>
  <text x="213" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Reservoir</text>
  <line x1="268" y1="107" x2="295" y2="107" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. 離開途徑 -->
  <g filter="url(#shadow)">
    <rect x="296" y="78" width="110" height="58" rx="29" fill="#6A9BCC" fill-opacity="0.18" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <text x="351" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">③ 離開途徑</text>
  <text x="351" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Portal of exit</text>
  <line x1="406" y1="107" x2="433" y2="107" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. 傳染途徑 -->
  <g filter="url(#shadow)">
    <rect x="434" y="78" width="110" height="58" rx="29" fill="#6A9BCC" fill-opacity="0.18" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <text x="489" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">④ 傳染途徑</text>
  <text x="489" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Transmission</text>
  <line x1="544" y1="107" x2="571" y2="107" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. 入侵途徑 -->
  <g filter="url(#shadow)">
    <rect x="572" y="78" width="110" height="58" rx="29" fill="#788C5D" fill-opacity="0.18" stroke="#788C5D" stroke-width="2"/>
  </g>
  <text x="627" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">⑤ 入侵途徑</text>
  <text x="627" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Portal of entry</text>
  <line x1="682" y1="107" x2="709" y2="107" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. 易感宿主 -->
  <g filter="url(#shadow)">
    <rect x="710" y="78" width="130" height="58" rx="29" fill="#788C5D" fill-opacity="0.18" stroke="#788C5D" stroke-width="2"/>
  </g>
  <text x="775" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">⑥ 易感宿主</text>
  <text x="775" y="120" text-anchor="middle" font-size="10" fill="#6B6B6B">Susceptible host</text>

  <!-- ── Node details (second row) ── -->
  <text x="75" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">細菌、病毒</text>
  <text x="75" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">黴菌⋯</text>

  <text x="213" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">人、動物</text>
  <text x="213" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">環境（水塔）</text>

  <text x="351" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">飛沫、分泌物</text>
  <text x="351" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">排泄物、氣溶膠</text>

  <text x="489" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">直接：接觸飛沫</text>
  <text x="489" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">間接：媒介/食物/水</text>

  <text x="627" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">呼吸道、皮膚</text>
  <text x="627" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">消化道⋯</text>

  <text x="775" y="158" text-anchor="middle" font-size="10" fill="#6B6B6B">免疫低下、年長</text>
  <text x="775" y="170" text-anchor="middle" font-size="10" fill="#6B6B6B">慢性病、幼兒</text>

  <!-- ── Intervention section ── -->
  <text x="430" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">三大介入策略</text>

  <!-- Intervention 1: Remove source (covers ①②) -->
  <g filter="url(#shadow)">
    <rect x="20" y="218" width="238" height="120" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="20" y="218" width="238" height="32" rx="10" fill="#D97757" fill-opacity="0.25"/>
  <rect x="20" y="238" width="238" height="12" fill="#D97757" fill-opacity="0.25"/>
  <text x="139" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">① 移除 / 控制傳染源</text>
  <text x="30" y="265" font-size="11" fill="#1A1A1A">• 治療感染者（人類傳染源）</text>
  <text x="30" y="281" font-size="11" fill="#1A1A1A">• 隔離感染者</text>
  <text x="30" y="297" font-size="11" fill="#1A1A1A">• 動物：撲殺、疫苗接種</text>
  <text x="30" y="313" font-size="11" fill="#1A1A1A">• 環境：消毒（退伍軍人→水塔加氯）</text>

  <!-- Intervention 2: Break chain (covers ③④⑤) -->
  <g filter="url(#shadow)">
    <rect x="311" y="218" width="238" height="120" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="311" y="218" width="238" height="32" rx="10" fill="#6A9BCC" fill-opacity="0.25"/>
  <rect x="311" y="238" width="238" height="12" fill="#6A9BCC" fill-opacity="0.25"/>
  <text x="430" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">② 阻斷傳染鏈</text>
  <text x="321" y="265" font-size="11" fill="#1A1A1A">• 洗手、妥善處理分泌物排泄物</text>
  <text x="321" y="281" font-size="11" fill="#1A1A1A">• 空氣流通（降低氣溶膠濃度）</text>
  <text x="321" y="297" font-size="11" fill="#1A1A1A">• 正確處理食物、飲水消毒</text>
  <text x="321" y="313" font-size="11" fill="#1A1A1A">• 滅菌、標準防護措施</text>

  <!-- Intervention 3: Protect host (covers ⑥) -->
  <g filter="url(#shadow)">
    <rect x="602" y="218" width="238" height="120" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>
  </g>
  <rect x="602" y="218" width="238" height="32" rx="10" fill="#788C5D" fill-opacity="0.25"/>
  <rect x="602" y="238" width="238" height="12" fill="#788C5D" fill-opacity="0.25"/>
  <text x="721" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#788C5D">③ 保護易感宿主</text>
  <text x="612" y="265" font-size="11" fill="#1A1A1A">• 疫苗接種（Immunization）</text>
  <text x="612" y="281" font-size="11" fill="#1A1A1A">• 暴露後預防（PEP）</text>
  <text x="612" y="297" font-size="11" fill="#1A1A1A">• 排除高風險族群於暴露場域外</text>
  <text x="612" y="313" font-size="11" fill="#1A1A1A">• 健康監測、提升宿主抵抗力</text>

  <!-- ── Legionella example ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="353" width="820" height="70" rx="10" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="36" y="374" font-size="12" font-weight="bold" fill="#1A1A1A">退伍軍人症實例應用</text>
  <text x="36" y="393" font-size="11" fill="#1A1A1A">① 病原體：<tspan font-style="italic">Legionella pneumophila</tspan></text>
  <text x="36" y="408" font-size="11" fill="#1A1A1A">　→ ② 傳染窩：淋浴水系統 / 冷卻水塔</text>
  <text x="280" y="393" font-size="11" fill="#1A1A1A">③ 離開途徑：氣溶膠噴霧</text>
  <text x="280" y="408" font-size="11" fill="#1A1A1A">→ ④ 傳染途徑：吸入（媒介物傳播）</text>
  <text x="530" y="393" font-size="11" fill="#1A1A1A">⑤ 入侵途徑：呼吸道</text>
  <text x="530" y="408" font-size="11" fill="#1A1A1A">→ ⑥ 易感宿主：年長、免疫低下住民</text>

  <!-- ── Quarantine vs isolation note ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="433" width="820" height="72" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="36" y="453" font-size="12" font-weight="bold" fill="#1A1A1A">隔離 vs. 檢疫</text>
  <rect x="36" y="462" width="12" height="12" rx="3" fill="#D97757"/>
  <text x="54" y="473" font-size="11" fill="#1A1A1A">隔離（Isolation）：針對已感染者（確診或可能病例），限制其行動以防止傳播</text>
  <rect x="36" y="480" width="12" height="12" rx="3" fill="#6A9BCC"/>
  <text x="54" y="491" font-size="11" fill="#1A1A1A">檢疫（Quarantine）：針對暴露者但尚未發病者，觀察至最大潛伏期結束（→見期間概念圖）</text>
</svg>
