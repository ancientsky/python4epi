<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">多變項分析方法比較：從分層到迴歸</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#6B6B6B">同一份世代研究資料，三種控制干擾因子的方法</text>

  <!-- ========== Column 1: Stratified (Ch05) ========== -->
  <g filter="url(#shadow)">
    <rect x="20" y="72" width="240" height="320" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <!-- Header -->
  <rect x="20" y="72" width="240" height="44" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <rect x="20" y="106" width="240" height="10" fill="#FFFFFF"/>
  <text x="140" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">分層分析</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#6B6B6B">Ch05 Stratified Analysis</text>

  <text x="40" y="160" font-size="12" fill="#1A1A1A" font-weight="600">做法</text>
  <text x="40" y="178" font-size="11" fill="#6B6B6B">按干擾因子分層，各層算 RR</text>
  <text x="40" y="194" font-size="11" fill="#6B6B6B">再用 MH 加權合併</text>

  <text x="40" y="222" font-size="12" fill="#1A1A1A" font-weight="600">輸出</text>
  <rect x="40" y="230" width="190" height="26" rx="5" fill="#788C5D" fill-opacity="0.12" stroke="#788C5D" stroke-width="1"/>
  <text x="135" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#788C5D">MH Adjusted RR</text>

  <text x="40" y="278" font-size="12" fill="#1A1A1A" font-weight="600">限制</text>
  <text x="40" y="296" font-size="11" fill="#D97757">一次只能控制 1 個因子</text>
  <text x="40" y="312" font-size="11" fill="#6B6B6B">分層太多 → 每層人太少</text>

  <text x="40" y="342" font-size="12" fill="#1A1A1A" font-weight="600">適用</text>
  <text x="40" y="360" font-size="11" fill="#6B6B6B">干擾因子少（1-2 個）</text>
  <text x="40" y="376" font-size="11" fill="#6B6B6B">教學展示干擾效應</text>

  <!-- ========== Column 2: Modified Poisson (Ch06 main) ========== -->
  <g filter="url(#shadow)">
    <rect x="280" y="72" width="240" height="320" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2.5"/>
  </g>
  <!-- Header (highlighted as recommended) -->
  <rect x="280" y="72" width="240" height="44" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <rect x="280" y="106" width="240" height="10" fill="#FFFFFF"/>
  <text x="400" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">Modified Poisson</text>
  <text x="400" y="130" text-anchor="middle" font-size="11" fill="#6B6B6B">Ch06 主軸方法 (Zou 2004)</text>

  <!-- Recommended badge -->
  <rect x="340" y="60" width="120" height="22" rx="11" fill="#788C5D"/>
  <text x="400" y="75" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">世代研究首選</text>

  <text x="300" y="160" font-size="12" fill="#1A1A1A" font-weight="600">做法</text>
  <text x="300" y="178" font-size="11" fill="#6B6B6B">用 Poisson GLM 建模</text>
  <text x="300" y="194" font-size="11" fill="#6B6B6B">+ robust (sandwich) SE 修正</text>

  <text x="300" y="222" font-size="12" fill="#1A1A1A" font-weight="600">輸出</text>
  <rect x="300" y="230" width="190" height="26" rx="5" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-width="1.5"/>
  <text x="395" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">Adjusted RR</text>

  <text x="300" y="278" font-size="12" fill="#1A1A1A" font-weight="600">優點</text>
  <text x="300" y="296" font-size="11" fill="#788C5D">同時控制多個因子</text>
  <text x="300" y="312" font-size="11" fill="#788C5D">直接得到 RR（非 OR）</text>
  <text x="300" y="328" font-size="11" fill="#788C5D">收斂穩定</text>

  <text x="300" y="356" font-size="12" fill="#1A1A1A" font-weight="600">適用</text>
  <text x="300" y="374" font-size="11" fill="#6B6B6B">世代研究、高侵襲率</text>

  <!-- ========== Column 3: Logistic Regression (Ch06 comparison) ========== -->
  <g filter="url(#shadow)">
    <rect x="540" y="72" width="240" height="320" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="2"/>
  </g>
  <!-- Header -->
  <rect x="540" y="72" width="240" height="44" rx="10" fill="#E8E5DF" fill-opacity="0.5"/>
  <rect x="540" y="106" width="240" height="10" fill="#FFFFFF"/>
  <text x="660" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">邏輯斯迴歸</text>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#6B6B6B">Ch06 對照方法</text>

  <text x="560" y="160" font-size="12" fill="#1A1A1A" font-weight="600">做法</text>
  <text x="560" y="178" font-size="11" fill="#6B6B6B">模型化 log(odds)</text>
  <text x="560" y="194" font-size="11" fill="#6B6B6B">最大概似估計 MLE</text>

  <text x="560" y="222" font-size="12" fill="#1A1A1A" font-weight="600">輸出</text>
  <rect x="560" y="230" width="190" height="26" rx="5" fill="#6A9BCC" fill-opacity="0.12" stroke="#6A9BCC" stroke-width="1"/>
  <text x="655" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">Adjusted OR</text>

  <text x="560" y="278" font-size="12" fill="#1A1A1A" font-weight="600">注意</text>
  <text x="560" y="296" font-size="11" fill="#D94452">侵襲率 43% → OR 高估效應</text>
  <text x="560" y="312" font-size="11" fill="#6B6B6B">盛行率 &lt; 10% 時 OR ≈ RR</text>

  <text x="560" y="342" font-size="12" fill="#1A1A1A" font-weight="600">適用</text>
  <text x="560" y="360" font-size="11" fill="#6B6B6B">病例對照研究</text>
  <text x="560" y="376" font-size="11" fill="#6B6B6B">罕見疾病世代研究</text>

  <!-- ========== Bottom decision flow ========== -->
  <rect x="20" y="410" width="760" height="56" rx="8" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="40" y="434" font-size="13" font-weight="bold" fill="#1A1A1A">決策指引</text>
  <text x="40" y="454" font-size="11" fill="#6B6B6B">世代研究 + 多個干擾因子 →</text>
  <text x="225" y="454" font-size="11" font-weight="bold" fill="#D97757">Modified Poisson（首選）</text>
  <text x="450" y="454" font-size="11" fill="#6B6B6B">病例對照 / 罕見疾病 →</text>
  <text x="620" y="454" font-size="11" font-weight="bold" fill="#6A9BCC">邏輯斯迴歸</text>
</svg>
