<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">函式 Function —— 可重複使用的自動計算機</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">把計算邏輯包起來，輸入 → 處理 → 輸出 (Input → Process → Output)</text>

  <!-- Top card: function anatomy -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- Input -->
  <rect x="60" y="130" width="140" height="60" rx="6" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  <text x="130" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">輸入 Input</text>
  <text x="130" y="170" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">cases=121</text>
  <text x="130" y="184" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">population=280</text>

  <line x1="205" y1="160" x2="260" y2="160" stroke="#D97757" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="232" y="150" text-anchor="middle" font-size="10" fill="#6B6B6B">參數</text>
  <text x="232" y="178" text-anchor="middle" font-size="10" fill="#6B6B6B">parameters</text>

  <!-- Function body -->
  <rect x="265" y="95" width="270" height="130" rx="8" fill="#2B2B2B"/>
  <text x="400" y="117" text-anchor="middle" font-size="11" fill="#F5F3EE" font-weight="bold">函式本體 Function body</text>
  <text x="285" y="142" font-size="12" font-family="Menlo, Monaco, monospace" fill="#F5F3EE">def calc_attack_rate(</text>
  <text x="305" y="160" font-size="12" font-family="Menlo, Monaco, monospace" fill="#F5F3EE">cases, population):</text>
  <text x="305" y="180" font-size="12" font-family="Menlo, Monaco, monospace" fill="#F5F3EE">return </text>
  <text x="370" y="180" font-size="12" font-family="Menlo, Monaco, monospace" fill="#D97757" font-weight="bold">cases / population</text>
  <text x="285" y="208" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># 包成「黑盒子」隨時呼叫</text>

  <line x1="540" y1="160" x2="595" y2="160" stroke="#D97757" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="567" y="150" text-anchor="middle" font-size="10" fill="#6B6B6B">return</text>
  <text x="567" y="178" text-anchor="middle" font-size="10" fill="#6B6B6B">輸出值</text>

  <!-- Output -->
  <rect x="600" y="130" width="140" height="60" rx="6" fill="#788C5D" fill-opacity="0.18" stroke="#788C5D" stroke-width="2"/>
  <text x="670" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">輸出 Output</text>
  <text x="670" y="173" text-anchor="middle" font-size="14" font-family="Menlo, Monaco, monospace" fill="#1A1A1A" font-weight="bold">0.432</text>
  <text x="670" y="188" text-anchor="middle" font-size="10" fill="#6B6B6B">（侵襲率 43.2%）</text>

  <!-- Bottom card: reuse -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="740" height="165" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="400" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">為什麼要寫函式？—— 同一個工具重複用 (Reusability)</text>

  <!-- Call 1 -->
  <rect x="60" y="305" width="220" height="95" rx="8" fill="#FAF8F3" stroke="#E8E5DF" stroke-width="1.5"/>
  <text x="170" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">呼叫 1：全機構</text>
  <text x="75" y="348" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">calc_attack_rate(121, 280)</text>
  <text x="170" y="375" text-anchor="middle" font-size="11" fill="#6B6B6B">→ 0.432（43.2%）</text>

  <!-- Call 2 -->
  <rect x="290" y="305" width="220" height="95" rx="8" fill="#FAF8F3" stroke="#E8E5DF" stroke-width="1.5"/>
  <text x="400" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">呼叫 2：3B 翼</text>
  <text x="305" y="348" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">calc_attack_rate(27, 47)</text>
  <text x="400" y="375" text-anchor="middle" font-size="11" fill="#6B6B6B">→ 0.574（57.4%）</text>

  <!-- Call 3 -->
  <rect x="520" y="305" width="220" height="95" rx="8" fill="#FAF8F3" stroke="#E8E5DF" stroke-width="1.5"/>
  <text x="630" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">呼叫 3：1A 翼</text>
  <text x="535" y="348" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">calc_attack_rate(15, 45)</text>
  <text x="630" y="375" text-anchor="middle" font-size="11" fill="#6B6B6B">→ 0.333（33.3%）</text>

  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#6B6B6B">一次定義、多次呼叫 → 改公式只改一個地方，不怕改漏</text>
</svg>
