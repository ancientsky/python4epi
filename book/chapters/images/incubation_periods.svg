<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowhead-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#788C5D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="480" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">傳染病期間概念對照</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">潛伏期 / 潛藏期 / 可傳染期 / 世代間隔 — 四個概念各有不同，混淆會影響檢疫決策</text>

  <!-- ── Card 1: 傳染者時間軸 ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="70" width="780" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="36" y="95" font-size="13" font-weight="bold" fill="#1A1A1A">傳染者（Index case）時間軸</text>

  <!-- Timeline axis -->
  <line x1="60" y1="155" x2="770" y2="155" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="775" y="159" font-size="11" fill="#6B6B6B">時間</text>

  <!-- Key events on timeline -->
  <!-- Exposure -->
  <line x1="100" y1="145" x2="100" y2="165" stroke="#1A1A1A" stroke-width="2"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">暴露</text>
  <text x="100" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">t = 0</text>

  <!-- Latent period end / infectious start -->
  <line x1="270" y1="145" x2="270" y2="165" stroke="#D97757" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#D97757">開始</text>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#D97757">具傳染性</text>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">潛藏期結束</text>

  <!-- Symptom onset -->
  <line x1="420" y1="135" x2="420" y2="165" stroke="#6A9BCC" stroke-width="2.5"/>
  <text x="420" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">出現</text>
  <text x="420" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">症狀</text>
  <text x="420" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">潛伏期結束</text>

  <!-- Infectious end -->
  <line x1="600" y1="145" x2="600" y2="165" stroke="#D97757" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#D97757">停止</text>
  <text x="600" y="128" text-anchor="middle" font-size="11" fill="#D97757">傳染性</text>
  <text x="600" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">可傳染期結束</text>

  <!-- Latent period bracket -->
  <line x1="100" y1="112" x2="270" y2="112" stroke="#D97757" stroke-width="2"/>
  <line x1="100" y1="108" x2="100" y2="116" stroke="#D97757" stroke-width="2"/>
  <line x1="270" y1="108" x2="270" y2="116" stroke="#D97757" stroke-width="2"/>
  <text x="185" y="107" text-anchor="middle" font-size="11" fill="#D97757">潛藏期 Latent period</text>

  <!-- Incubation period bracket -->
  <line x1="100" y1="202" x2="420" y2="202" stroke="#6A9BCC" stroke-width="2"/>
  <line x1="100" y1="198" x2="100" y2="206" stroke="#6A9BCC" stroke-width="2"/>
  <line x1="420" y1="198" x2="420" y2="206" stroke="#6A9BCC" stroke-width="2"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#6A9BCC">潛伏期 Incubation period（暴露 → 出現症狀）</text>

  <!-- Infectious period bracket -->
  <line x1="270" y1="192" x2="600" y2="192" stroke="#D97757" stroke-width="2"/>
  <line x1="270" y1="188" x2="270" y2="196" stroke="#D97757" stroke-width="2"/>
  <line x1="600" y1="188" x2="600" y2="196" stroke="#D97757" stroke-width="2"/>

  <!-- ── Card 2: 世代間隔 ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="250" width="780" height="145" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="36" y="274" font-size="13" font-weight="bold" fill="#1A1A1A">世代間隔（Serial interval）：傳染者發病 → 被傳染者發病</text>

  <!-- Timeline 2 -->
  <line x1="60" y1="355" x2="770" y2="355" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Index case onset -->
  <line x1="160" y1="345" x2="160" y2="365" stroke="#D97757" stroke-width="2.5"/>
  <text x="160" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">指標個案</text>
  <text x="160" y="326" text-anchor="middle" font-size="11" fill="#D97757">發病日</text>
  <text x="160" y="378" text-anchor="middle" font-size="10" fill="#6B6B6B">傳染者</text>

  <!-- Secondary case onset -->
  <line x1="530" y1="345" x2="530" y2="365" stroke="#6A9BCC" stroke-width="2.5"/>
  <text x="530" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">續發個案</text>
  <text x="530" y="326" text-anchor="middle" font-size="11" fill="#6A9BCC">發病日</text>
  <text x="530" y="378" text-anchor="middle" font-size="10" fill="#6B6B6B">被傳染者</text>

  <!-- Serial interval bracket -->
  <line x1="160" y1="305" x2="530" y2="305" stroke="#788C5D" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="160" y1="301" x2="160" y2="309" stroke="#788C5D" stroke-width="2"/>
  <text x="345" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">世代間隔 / 發病世代間隔</text>
  <text x="345" y="283" text-anchor="middle" font-size="11" fill="#788C5D">Serial interval（退伍軍人症約 10–14 天）</text>

  <!-- ── Bottom legend ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="412" width="780" height="55" rx="10" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="36" y="432" font-size="12" font-weight="bold" fill="#1A1A1A">退伍軍人症實例：</text>
  <rect x="145" y="421" width="10" height="10" fill="#6A9BCC" rx="2"/>
  <text x="160" y="432" font-size="11" fill="#1A1A1A">潛伏期 2–10 天（通常 5–6 天）</text>
  <rect x="340" y="421" width="10" height="10" fill="#D97757" rx="2"/>
  <text x="355" y="432" font-size="11" fill="#1A1A1A">潛藏期 ≒ 潛伏期（人傳人罕見）</text>
  <rect x="565" y="421" width="10" height="10" fill="#788C5D" rx="2"/>
  <text x="580" y="432" font-size="11" fill="#1A1A1A">可傳染期：散發（非人傳人）</text>
  <text x="36" y="455" font-size="11" fill="#6B6B6B">⚠️ 潛藏期短於潛伏期時 → 無症狀傳播（presymptomatic transmission）風險增加，檢疫期需依潛伏期最大值設定</text>
</svg>
