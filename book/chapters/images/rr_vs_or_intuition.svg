<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="360" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Risk vs Odds — 風險和勝算有什麼不同？</text>

  <!-- Left panel: Marble jar metaphor -->
  <g filter="url(#shadow)">
    <rect x="20" y="50" width="360" height="290" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="200" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">10 位住民中有 3 位感染</text>

  <!-- Marble circles: 3 orange (diseased) + 7 blue (healthy) -->
  <circle cx="65" cy="115" r="18" fill="#D97757"/>
  <circle cx="110" cy="115" r="18" fill="#D97757"/>
  <circle cx="155" cy="115" r="18" fill="#D97757"/>
  <circle cx="200" cy="115" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="245" cy="115" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="290" cy="115" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="335" cy="115" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="110" cy="155" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="155" cy="155" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <circle cx="200" cy="155" r="18" fill="#6A9BCC" fill-opacity="0.5"/>
  <!-- Labels on circles -->
  <text x="65" cy="115" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">+</text>
  <text x="110" cy="115" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">+</text>
  <text x="155" cy="115" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">+</text>

  <!-- Risk explanation -->
  <rect x="40" y="190" width="150" height="60" rx="8" fill="#D97757" fill-opacity="0.1" stroke="#D97757" stroke-width="1.5"/>
  <text x="115" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">Risk（風險）</text>
  <text x="115" y="234" text-anchor="middle" font-size="15" fill="#1A1A1A" font-family="monospace">3 / 10 = 0.3</text>

  <!-- Odds explanation -->
  <rect x="210" y="190" width="150" height="60" rx="8" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="285" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">Odds（勝算）</text>
  <text x="285" y="234" text-anchor="middle" font-size="15" fill="#1A1A1A" font-family="monospace">3 / 7 = 0.43</text>

  <!-- Intuition labels -->
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#6B6B6B">感染 / 全部人</text>
  <text x="115" y="286" text-anchor="middle" font-size="11" fill="#6B6B6B">= 發生的「機率」</text>
  <text x="285" y="270" text-anchor="middle" font-size="11" fill="#6B6B6B">感染 / 未感染</text>
  <text x="285" y="286" text-anchor="middle" font-size="11" fill="#6B6B6B">= 發生 vs 不發生的「比值」</text>

  <!-- Key insight -->
  <text x="200" y="325" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">侵襲率低時 Risk ≈ Odds；侵襲率高時差距明顯</text>

  <!-- Right panel: Study design decision -->
  <g filter="url(#shadow)">
    <rect x="410" y="50" width="370" height="290" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="595" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">研究設計決定你能算什麼</text>

  <!-- Cohort row -->
  <rect x="430" y="90" width="330" height="70" rx="8" fill="#788C5D" fill-opacity="0.1" stroke="#788C5D" stroke-width="1.5"/>
  <text x="445" y="113" font-size="13" font-weight="bold" fill="#788C5D">世代研究 Cohort</text>
  <text x="445" y="133" font-size="12" fill="#6B6B6B">依暴露分組，追蹤結果 → 有完整分母</text>
  <text x="445" y="152" font-size="14" font-weight="bold" fill="#1A1A1A">→ 可算 RR（風險比）</text>

  <!-- Case-control row -->
  <rect x="430" y="172" width="330" height="70" rx="8" fill="#6A9BCC" fill-opacity="0.1" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="445" y="195" font-size="13" font-weight="bold" fill="#6A9BCC">病例對照 Case-Control</text>
  <text x="445" y="215" font-size="12" fill="#6B6B6B">依疾病分組，回溯暴露 → 分母不代表真實</text>
  <text x="445" y="234" font-size="14" font-weight="bold" fill="#1A1A1A">→ 只能算 OR（勝算比）</text>

  <!-- Key note -->
  <rect x="430" y="254" width="330" height="70" rx="8" fill="#FAF8F3" stroke="#D97757" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="445" y="278" font-size="12" fill="#D97757" font-weight="bold">本次調查 = 回溯性世代研究</text>
  <text x="445" y="298" font-size="12" fill="#6B6B6B">280 位住民全部納入 → RR 和 OR 都能算</text>
  <text x="445" y="316" font-size="11" fill="#6B6B6B">罕見疾病（侵襲率 &lt; 10%）時 OR ≈ RR</text>
</svg>
