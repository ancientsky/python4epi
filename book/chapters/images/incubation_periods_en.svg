<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowhead-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arrowhead-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
    <marker id="arrowhead-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#788C5D"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="480" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Comparing Infectious Disease Time Periods</text>
  <text x="410" y="53" text-anchor="middle" font-size="11" fill="#6B6B6B">Incubation period / Latent period / Infectious period / Serial interval</text>
  <text x="410" y="65" text-anchor="middle" font-size="11" fill="#6B6B6B">— four distinct concepts; confusing them can affect quarantine decisions</text>

  <!-- ── Card 1: 傳染者時間軸 ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="70" width="780" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="36" y="95" font-size="13" font-weight="bold" fill="#1A1A1A">Index Case Timeline</text>

  <!-- Timeline axis -->
  <line x1="60" y1="155" x2="770" y2="155" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="775" y="159" font-size="9" fill="#6B6B6B">Time</text>

  <!-- Key events on timeline -->
  <!-- Exposure -->
  <line x1="100" y1="145" x2="100" y2="165" stroke="#1A1A1A" stroke-width="2"/>
  <text x="100" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">Exposure</text>
  <text x="100" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">t = 0</text>

  <!-- Latent period end / infectious start -->
  <line x1="270" y1="145" x2="270" y2="165" stroke="#D97757" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="270" y="140" text-anchor="middle" font-size="11" fill="#D97757">infectious</text>
  <text x="270" y="128" text-anchor="middle" font-size="11" fill="#D97757">Becomes</text>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">End of latent period</text>

  <!-- Symptom onset -->
  <line x1="420" y1="135" x2="420" y2="165" stroke="#6A9BCC" stroke-width="2.5"/>
  <text x="420" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">onset</text>
  <text x="420" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">Symptom</text>
  <text x="420" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">End of incubation period</text>

  <!-- Infectious end -->
  <line x1="600" y1="145" x2="600" y2="165" stroke="#D97757" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#D97757">infectious</text>
  <text x="600" y="128" text-anchor="middle" font-size="11" fill="#D97757">No longer</text>
  <text x="600" y="180" text-anchor="middle" font-size="10" fill="#6B6B6B">End of infectious period</text>

  <!-- Latent period bracket -->
  <line x1="100" y1="112" x2="270" y2="112" stroke="#D97757" stroke-width="2"/>
  <line x1="100" y1="108" x2="100" y2="116" stroke="#D97757" stroke-width="2"/>
  <line x1="270" y1="108" x2="270" y2="116" stroke="#D97757" stroke-width="2"/>
  <text x="185" y="107" text-anchor="middle" font-size="11" fill="#D97757">Latent period</text>

  <!-- Incubation period bracket -->
  <line x1="100" y1="202" x2="420" y2="202" stroke="#6A9BCC" stroke-width="2"/>
  <line x1="100" y1="198" x2="100" y2="206" stroke="#6A9BCC" stroke-width="2"/>
  <line x1="420" y1="198" x2="420" y2="206" stroke="#6A9BCC" stroke-width="2"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#6A9BCC">Incubation period (exposure → symptom onset)</text>

  <!-- Infectious period bracket -->
  <line x1="270" y1="192" x2="600" y2="192" stroke="#D97757" stroke-width="2"/>
  <line x1="270" y1="188" x2="270" y2="196" stroke="#D97757" stroke-width="2"/>
  <line x1="600" y1="188" x2="600" y2="196" stroke="#D97757" stroke-width="2"/>

  <!-- ── Card 2: 世代間隔 ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="250" width="780" height="145" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="36" y="274" font-size="13" font-weight="bold" fill="#1A1A1A">Serial interval: index case onset → secondary case onset</text>

  <!-- Timeline 2 -->
  <line x1="60" y1="355" x2="770" y2="355" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Index case onset -->
  <line x1="160" y1="345" x2="160" y2="365" stroke="#D97757" stroke-width="2.5"/>
  <text x="160" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">Index case</text>
  <text x="160" y="326" text-anchor="middle" font-size="11" fill="#D97757">Onset date</text>
  <text x="160" y="378" text-anchor="middle" font-size="10" fill="#6B6B6B">Source case</text>

  <!-- Secondary case onset -->
  <line x1="530" y1="345" x2="530" y2="365" stroke="#6A9BCC" stroke-width="2.5"/>
  <text x="530" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">Secondary case</text>
  <text x="530" y="326" text-anchor="middle" font-size="11" fill="#6A9BCC">Onset date</text>
  <text x="530" y="378" text-anchor="middle" font-size="10" fill="#6B6B6B">Recipient case</text>

  <!-- Serial interval bracket -->
  <line x1="160" y1="305" x2="530" y2="305" stroke="#788C5D" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <line x1="160" y1="301" x2="160" y2="309" stroke="#788C5D" stroke-width="2"/>
  <text x="345" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">Serial interval</text>
  <text x="345" y="283" text-anchor="middle" font-size="11" fill="#788C5D">(~10–14 days for Legionnaires' disease)</text>

  <!-- ── Bottom legend ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="412" width="780" height="55" rx="10" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="36" y="432" font-size="8" font-weight="bold" fill="#1A1A1A">Legionella example:</text>
  <rect x="145" y="421" width="10" height="10" fill="#6A9BCC" rx="2"/>
  <text x="160" y="432" font-size="8" fill="#1A1A1A">Incubation: 2–10 days (usually 5–6)</text>
  <rect x="340" y="421" width="10" height="10" fill="#D97757" rx="2"/>
  <text x="355" y="432" font-size="8" fill="#1A1A1A">Latent ≈ incubation (person-to-person rare)</text>
  <rect x="565" y="421" width="10" height="10" fill="#788C5D" rx="2"/>
  <text x="580" y="432" font-size="8" fill="#1A1A1A">Infectious: sporadic (not person-to-person)</text>
  <text x="36" y="455" font-size="8" fill="#6B6B6B">⚠️ When the latent period is shorter than the incubation period, presymptomatic</text>
  <text x="36" y="464" font-size="8" fill="#6B6B6B">transmission risk increases — quarantine length should follow the longest incubation period</text>
</svg>
