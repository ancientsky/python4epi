<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker>
  </defs>
  <rect width="800" height="450" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Reproducibility = A Good Recipe</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">Get all four right, and anyone can bake the same result</text>

  <!-- 4 ingredient cards -->
  <g filter="url(#shadow)"><rect x="20" y="80" width="178" height="140" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/></g>
  <text x="109" y="108" text-anchor="middle" font-size="20">📜</text>
  <text x="109" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">Recipe</text>
  <text x="109" y="148" text-anchor="middle" font-size="10" fill="#6B6B6B">(the code)</text>
  <text x="109" y="170" text-anchor="middle" font-size="9" fill="#1A1A1A">Steps anyone</text>
  <text x="109" y="187" text-anchor="middle" font-size="9" fill="#1A1A1A">can follow &amp; rerun</text>

  <g filter="url(#shadow)"><rect x="214" y="80" width="178" height="140" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/></g>
  <text x="303" y="108" text-anchor="middle" font-size="20">🥬</text>
  <text x="303" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">Ingredients</text>
  <text x="303" y="148" text-anchor="middle" font-size="10" fill="#6B6B6B">(the data)</text>
  <text x="303" y="170" text-anchor="middle" font-size="9" fill="#1A1A1A">Same raw dataset</text>
  <text x="303" y="187" text-anchor="middle" font-size="9" fill="#1A1A1A">no manual edits</text>

  <g filter="url(#shadow)"><rect x="408" y="80" width="178" height="140" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="1.5"/></g>
  <text x="497" y="108" text-anchor="middle" font-size="20">🍳</text>
  <text x="497" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#788C5D">Kitchen setup</text>
  <text x="497" y="148" text-anchor="middle" font-size="10" fill="#6B6B6B">(environment)</text>
  <text x="497" y="170" text-anchor="middle" font-size="9" fill="#1A1A1A">Package versions</text>
  <text x="497" y="187" text-anchor="middle" font-size="9" fill="#1A1A1A">locked via uv.lock</text>

  <g filter="url(#shadow)"><rect x="602" y="80" width="178" height="140" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/></g>
  <text x="691" y="108" text-anchor="middle" font-size="20">🎲</text>
  <text x="691" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6A9BCC">Dice preset</text>
  <text x="691" y="148" text-anchor="middle" font-size="10" fill="#6B6B6B">(the seed)</text>
  <text x="691" y="170" text-anchor="middle" font-size="9" fill="#1A1A1A">Randomness</text>
  <text x="691" y="187" text-anchor="middle" font-size="9" fill="#1A1A1A">fixed every run</text>

  <!-- converging arrows into one hub -->
  <line x1="109" y1="220" x2="400" y2="258" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="303" y1="220" x2="400" y2="258" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="497" y1="220" x2="400" y2="258" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="691" y1="220" x2="400" y2="258" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <circle cx="400" cy="258" r="18" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1.3"/>
  <text x="400" y="264" text-anchor="middle" font-size="16" font-weight="bold" fill="#6B6B6B">+</text>
  <line x1="400" y1="277" x2="400" y2="297" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- result card -->
  <g filter="url(#shadow)"><rect x="140" y="300" width="520" height="128" rx="12" fill="#FFFFFF" stroke="#D97757" stroke-width="1.8"/></g>
  <text x="400" y="332" text-anchor="middle" font-size="28">🎂</text>
  <text x="400" y="358" text-anchor="middle" font-size="12.5" fill="#1A1A1A">Anyone, on any machine,</text>
  <text x="400" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#D97757">bakes the exact same cake</text>
  <text x="400" y="408" text-anchor="middle" font-size="10.5" fill="#6B6B6B">(identical results — fully reproducible)</text>
</svg>
