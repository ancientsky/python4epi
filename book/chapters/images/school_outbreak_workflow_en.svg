  <circle cx="202" cy="224" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="198.5" cy="222.5" r="1.8" fill="#6B6B6B"/><circle cx="205.5" cy="222.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="238" cy="224" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="234.5" cy="222.5" r="1.8" fill="#6B6B6B"/><circle cx="241.5" cy="222.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="58" cy="264" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="54.5" cy="262.5" r="1.8" fill="#6B6B6B"/><circle cx="61.5" cy="262.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="94" cy="264" r="10" fill="#FDECE7" stroke="#C9C4BC" stroke-width="1"/><circle cx="90.5" cy="262.5" r="1.8" fill="#D94452"/><circle cx="97.5" cy="262.5" r="1.8" fill="#D94452"/><path d="M90.5 268.5 Q94 266.5 97.5 268.5" stroke="#D94452" stroke-width="1" fill="none"/>
  <circle cx="130" cy="264" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="126.5" cy="262.5" r="1.8" fill="#6B6B6B"/><circle cx="133.5" cy="262.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="166" cy="264" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="162.5" cy="262.5" r="1.8" fill="#6B6B6B"/><circle cx="169.5" cy="262.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="202" cy="264" r="10" fill="#F5F3EE" stroke="#C9C4BC" stroke-width="1"/><circle cx="198.5" cy="262.5" r="1.8" fill="#6B6B6B"/><circle cx="205.5" cy="262.5" r="1.8" fill="#6B6B6B"/>
  <circle cx="238" cy="264" r="10" fill="#FDECE7" stroke="#C9C4BC" stroke-width="1"/><circle cx="234.5" cy="262.5" r="1.8" fill="#D94452"/><circle cx="241.5" cy="262.5" r="1.8" fill="#D94452"/><path d="M234.5 268.5 Q238 266.5 241.5 268.5" stroke="#D94452" stroke-width="1" fill="none"/>
  <text x="149.0" y="354" text-anchor="middle" font-size="22" font-weight="bold" fill="#6A9BCC">17 / 60 kids</text>
  <text x="149.0" y="376" text-anchor="middle" font-size="12" fill="#6B6B6B">attack rate 28% (red eyes = hit)</text>
  <rect x="309" y="316" width="30" height="16" rx="2" fill="#F0B79E"/>
  <text x="324" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">1</text>
  <rect x="342" y="284" width="30" height="48" rx="2" fill="#F0B79E"/>
  <text x="357" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">2</text>
  <rect x="375" y="236" width="30" height="96" rx="2" fill="#D97757"/>
  <text x="390" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">3</text>
  <rect x="408" y="268" width="30" height="64" rx="2" fill="#F0B79E"/>
  <text x="423" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">4</text>
  <rect x="441" y="300" width="30" height="32" rx="2" fill="#F0B79E"/>
  <text x="456" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">5</text>
  <rect x="474" y="316" width="30" height="16" rx="2" fill="#F0B79E"/>
  <text x="489" y="345" text-anchor="middle" font-size="9" fill="#6B6B6B">6</text>
  <text x="410.0" y="362" text-anchor="middle" font-size="9" fill="#6B6B6B">day of onset</text>
  <text x="390" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97757">🚩peak</text>
  <text x="410.0" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">Peak on day 3</text>
  <text x="564" y="227" font-size="10.5" font-weight="bold" fill="#1A1A1A">Room A</text>
  <rect x="620" y="215" width="90" height="16" rx="2" fill="#788C5D"/>
  <text x="714" y="228" font-size="10" font-weight="bold" fill="#788C5D">60% (12/20)</text>
  <text x="564" y="269" font-size="10.5" font-weight="bold" fill="#1A1A1A">Room B</text>
  <rect x="620" y="257" width="15" height="16" rx="2" fill="#B7C4A6"/>
  <text x="639" y="270" font-size="10" font-weight="bold" fill="#6B6B6B">10% (3/30)</text>
  <text x="564" y="311" font-size="10.5" font-weight="bold" fill="#1A1A1A">Room C</text>
  <rect x="620" y="299" width="30" height="16" rx="2" fill="#B7C4A6"/>
  <text x="654" y="312" font-size="10" font-weight="bold" fill="#6B6B6B">20% (2/10)</text>
  <text x="564" y="354" font-size="12">💧</text>
  <text x="584" y="354" font-size="9.5" fill="#D94452">Room A is by the fountain → prime suspect</text>
  <text x="564" y="374" font-size="9.5" fill="#6B6B6B">⚠ Compare RATES not counts: B=3 &gt; C=2 cases,</text>
  <text x="564" y="387" font-size="9.5" fill="#6B6B6B">　but B 10% &lt; C 20% (B is a bigger class)</text>
  <g filter="url(#shadow)"><rect x="24" y="418" width="560" height="140" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="42" y="444" font-size="14" font-weight="bold" fill="#1A1A1A">📋 SitRep: the whole story on one page</text>
  <text x="42" y="470" font-size="11.5" fill="#1A1A1A">• 60 kids total, <tspan font-weight="bold">17 hit (28%)</tspan></text>
  <text x="42" y="491" font-size="11.5" fill="#1A1A1A">• Worst: <tspan font-weight="bold" fill="#788C5D">Room A (attack rate 60%)</tspan></text>
  <text x="42" y="512" font-size="11.5" fill="#1A1A1A">• Peak: <tspan font-weight="bold" fill="#D97757">day 3</tspan> (single peak → maybe one common source)</text>
  <text x="42" y="533" font-size="11.5" fill="#1A1A1A">• Action: <tspan font-weight="bold" fill="#D94452">shut off &amp; disinfect Room A's fountain</tspan> 💧</text>
  <text x="42" y="551" font-size="9.5" fill="#6B6B6B">(descriptive analysis only names a "suspect"; conviction needs the later 2×2, regression + lab testing)</text>
  <line x1="592" y1="488" x2="628" y2="488" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#arr)"/>
