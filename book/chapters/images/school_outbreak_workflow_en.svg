<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 582" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/>
    </marker>
  </defs>
  <rect width="820" height="582" fill="#FAF8F3" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">One by one, the whole class's eyes turn red! You're the school-nurse outbreak lead.</text>
  <text x="410" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">Follow the SOP: define a case → ask "Who, When, Where" → hand in a one-page SitRep 📋</text>
  <rect x="33" y="68" width="138" height="28" rx="14" fill="#6B6B6B" fill-opacity="0.12" stroke="#6B6B6B" stroke-width="1.3"/>
  <text x="102" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6B6B6B">① Define case</text>
  <line x1="173" y1="82" x2="185" y2="82" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="187" y="68" width="138" height="28" rx="14" fill="#6A9BCC" fill-opacity="0.12" stroke="#6A9BCC" stroke-width="1.3"/>
  <text x="256" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6A9BCC">② Who (Person)</text>
  <line x1="327" y1="82" x2="339" y2="82" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="341" y="68" width="138" height="28" rx="14" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-width="1.3"/>
  <text x="410" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#D97757">③ When (Time)</text>
  <line x1="481" y1="82" x2="493" y2="82" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="495" y="68" width="138" height="28" rx="14" fill="#788C5D" fill-opacity="0.12" stroke="#788C5D" stroke-width="1.3"/>
  <text x="564" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#788C5D">④ Where (Place)</text>
  <line x1="635" y1="82" x2="647" y2="82" stroke="#6B6B6B" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="649" y="68" width="138" height="28" rx="14" fill="#1A1A1A" fill-opacity="0.12" stroke="#1A1A1A" stroke-width="1.3"/>
  <text x="718" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A1A1A">⑤ SitRep</text>
  <text x="410" y="118" text-anchor="middle" font-size="11" fill="#6B6B6B">👆 This is the "outbreak recipe": follow it and you won't skip a step, even in a panic</text>
  <g filter="url(#shadow)"><rect x="24" y="132" width="250" height="262" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <rect x="24" y="132" width="250" height="6" rx="3" fill="#6A9BCC"/>
  <text x="42" y="166" font-size="15" font-weight="bold" fill="#6A9BCC">Who (Person)</text>
  <text x="42" y="186" font-size="11" fill="#6B6B6B">Who got hit? Which people?</text>
  <g filter="url(#shadow)"><rect x="285" y="132" width="250" height="262" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <rect x="285" y="132" width="250" height="6" rx="3" fill="#D97757"/>
  <text x="303" y="166" font-size="15" font-weight="bold" fill="#D97757">When (Time)</text>
  <text x="303" y="186" font-size="11" fill="#6B6B6B">Which days? When's the peak?</text>
  <g filter="url(#shadow)"><rect x="546" y="132" width="250" height="262" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <rect x="546" y="132" width="250" height="6" rx="3" fill="#788C5D"/>
  <text x="564" y="166" font-size="15" font-weight="bold" fill="#788C5D">Where (Place)</text>
  <text x="564" y="186" font-size="11" fill="#6B6B6B">Which classroom is worst?</text>
