  <text x="716" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">Same workflow</text>
  <text x="716" y="502" text-anchor="middle" font-size="11" fill="#6B6B6B">scaled to the nursing</text>
  <text x="716" y="519" text-anchor="middle" font-size="11" fill="#6B6B6B">home: 280 residents</text>
  <text x="716" y="540" text-anchor="middle" font-size="11" fill="#6B6B6B">line list → SitRep</text>
