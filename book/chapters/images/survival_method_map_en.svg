<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6B6B"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Survival Analysis Method Map — Match the Tool to the Question</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">From description to inference to regression to diagnostics — four methods, one path</text>

  <!-- Step 1: KM -->
  <g filter="url(#shadow)">
    <rect x="30" y="88" width="170" height="230" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="30" y="88" width="170" height="36" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <text x="115" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">① Describe</text>

  <text x="115" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Kaplan-Meier</text>
  <text x="115" y="162" text-anchor="middle" font-size="10" fill="#6B6B6B">Draw one survival curve</text>

  <!-- Mini KM curve icon -->
  <g transform="translate(50, 175)">
    <line x1="0" y1="50" x2="130" y2="50" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1A1A1A" stroke-width="1"/>
    <path d="M 0 8 L 25 8 L 25 18 L 55 18 L 55 30 L 95 30 L 95 40 L 130 40" fill="none" stroke="#D97757" stroke-width="2"/>
  </g>

  <rect x="45" y="248" width="140" height="62" rx="6" fill="#F5F3EE"/>
  <text x="115" y="265" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Q:</tspan> Survival curve shape?</text>
  <text x="115" y="281" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Output:</tspan> S(t) curve</text>
  <text x="115" y="298" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Censoring:</tspan> ✓ handled</text>

  <!-- Arrow -->
  <line x1="204" y1="203" x2="228" y2="203" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Log-rank -->
  <g filter="url(#shadow)">
    <rect x="232" y="88" width="170" height="230" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="232" y="88" width="170" height="36" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="317" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">② Infer</text>

  <text x="317" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Log-rank Test</text>
  <text x="317" y="162" text-anchor="middle" font-size="10" fill="#6B6B6B">Compare two curves</text>

  <!-- Icon: two curves -->
  <g transform="translate(252, 175)">
    <line x1="0" y1="50" x2="130" y2="50" stroke="#1A1A1A" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1A1A1A" stroke-width="1"/>
    <path d="M 0 8 L 30 8 L 30 14 L 70 14 L 70 22 L 130 22" fill="none" stroke="#6A9BCC" stroke-width="2"/>
    <path d="M 0 12 L 20 12 L 20 25 L 50 25 L 50 38 L 130 38" fill="none" stroke="#D97757" stroke-width="2"/>
    <text x="135" y="26" font-size="8" fill="#6A9BCC">A</text>
    <text x="135" y="42" font-size="8" fill="#D97757">B</text>
  </g>

  <rect x="247" y="248" width="140" height="62" rx="6" fill="#F5F3EE"/>
  <text x="317" y="265" text-anchor="middle" font-size="10" fill="#1A1A1A"><tspan font-weight="bold">Q:</tspan> Do groups differ?</text>
  <text x="317" y="281" text-anchor="middle" font-size="10" fill="#1A1A1A"><tspan font-weight="bold">Output:</tspan> p-value</text>
  <text x="317" y="298" text-anchor="middle" font-size="10" fill="#D94452"><tspan font-weight="bold">✗</tspan> No effect size</text>

  <!-- Arrow -->
  <line x1="406" y1="203" x2="430" y2="203" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Cox -->
  <g filter="url(#shadow)">
    <rect x="434" y="88" width="170" height="230" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>
  </g>
  <rect x="434" y="88" width="170" height="36" rx="10" fill="#788C5D" fill-opacity="0.15"/>
  <text x="519" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#788C5D">③ Regress</text>

  <text x="519" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Cox PH Model</text>
  <text x="519" y="162" text-anchor="middle" font-size="9" fill="#6B6B6B">Multivariable HR estimation</text>

  <!-- Icon: forest plot -->
  <g transform="translate(454, 180)">
    <line x1="65" y1="0" x2="65" y2="50" stroke="#6B6B6B" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="30" y1="10" x2="90" y2="10" stroke="#788C5D" stroke-width="1.5"/>
    <circle cx="78" cy="10" r="3" fill="#788C5D"/>
    <line x1="45" y1="25" x2="75" y2="25" stroke="#788C5D" stroke-width="1.5"/>
    <circle cx="55" cy="25" r="3" fill="#788C5D"/>
    <line x1="50" y1="40" x2="110" y2="40" stroke="#788C5D" stroke-width="1.5"/>
    <circle cx="92" cy="40" r="3" fill="#788C5D"/>
  </g>

  <rect x="449" y="248" width="140" height="62" rx="6" fill="#F5F3EE"/>
  <text x="519" y="265" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Q:</tspan> Which factors matter?</text>
  <text x="519" y="281" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Output:</tspan> HR + 95% CI</text>
  <text x="519" y="298" text-anchor="middle" font-size="9" fill="#1A1A1A"><tspan font-weight="bold">Needs:</tspan> PH assumption</text>

  <!-- Arrow -->
  <line x1="608" y1="203" x2="632" y2="203" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: diagnostics -->
  <g filter="url(#shadow)">
    <rect x="636" y="88" width="134" height="230" rx="10" fill="#FFFFFF" stroke="#D94452" stroke-width="2"/>
  </g>
  <rect x="636" y="88" width="134" height="36" rx="10" fill="#D94452" fill-opacity="0.15"/>
  <text x="703" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#D94452">④ Diagnose</text>

  <text x="703" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">PH Assumption Test</text>
  <text x="703" y="162" text-anchor="middle" font-size="9" fill="#6B6B6B">Validates Cox results</text>

  <!-- Icon: checkmark in magnifier -->
  <g transform="translate(670, 180)">
    <circle cx="30" cy="20" r="18" fill="none" stroke="#D94452" stroke-width="2"/>
    <line x1="43" y1="33" x2="58" y2="48" stroke="#D94452" stroke-width="3" stroke-linecap="round"/>
    <path d="M 22 22 L 28 28 L 40 14" fill="none" stroke="#788C5D" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <rect x="651" y="248" width="104" height="62" rx="6" fill="#F5F3EE"/>
  <text x="703" y="265" text-anchor="middle" font-size="10" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">cph.check_</text>
  <text x="703" y="281" text-anchor="middle" font-size="10" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">assumptions()</text>
  <text x="703" y="298" text-anchor="middle" font-size="10" fill="#D94452" font-weight="bold">Violated → fix</text>

  <!-- Bottom: sample size needs -->
  <g filter="url(#shadow)">
    <rect x="30" y="338" width="740" height="50" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">Sample size tips</text>
  <text x="115" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">KM / Log-rank: ≥10 events is enough</text>
  <text x="400" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Cox: ≥10 events per variable (EPV)</text>
  <text x="685" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Few events → rely on KM</text>
</svg>
