  <text x="716" y="452" text-anchor="middle" font-size="30">🏥</text>
  <text x="716" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">同一套流程</text>
  <text x="716" y="502" text-anchor="middle" font-size="11" fill="#6B6B6B">放大到護理之家</text>
  <text x="716" y="519" text-anchor="middle" font-size="11" fill="#6B6B6B">280 人的退伍軍人症</text>
  <text x="716" y="540" text-anchor="middle" font-size="11" fill="#6B6B6B">line list → SitRep</text>
