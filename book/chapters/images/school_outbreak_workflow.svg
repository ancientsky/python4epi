  <rect x="546" y="132" width="250" height="6" rx="3" fill="#788C5D"/>
  <text x="564" y="166" font-size="15" font-weight="bold" fill="#788C5D">地 Place</text>
  <text x="564" y="186" font-size="11" fill="#6B6B6B">哪間教室最慘？</text>
