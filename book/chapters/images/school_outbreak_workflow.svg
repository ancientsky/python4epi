  <text x="390" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97757">🚩高峰</text>
  <text x="410.0" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">高峰在第 3 天</text>
  <text x="566" y="227" font-size="11" font-weight="bold" fill="#1A1A1A">A班</text>
  <rect x="604" y="215" width="108" height="16" rx="2" fill="#788C5D"/>
  <text x="716" y="228" font-size="10" font-weight="bold" fill="#788C5D">60% (12/20)</text>
  <text x="566" y="269" font-size="11" font-weight="bold" fill="#1A1A1A">B班</text>
  <rect x="604" y="257" width="18" height="16" rx="2" fill="#B7C4A6"/>
  <text x="626" y="270" font-size="10" font-weight="bold" fill="#6B6B6B">10% (3/30)</text>
  <text x="566" y="311" font-size="11" font-weight="bold" fill="#1A1A1A">C班</text>
  <rect x="604" y="299" width="36" height="16" rx="2" fill="#B7C4A6"/>
  <text x="644" y="312" font-size="10" font-weight="bold" fill="#6B6B6B">20% (2/10)</text>
  <text x="564" y="354" font-size="15">💧</text>
  <text x="586" y="354" font-size="10" fill="#D94452">A 班在飲水機旁 → 頭號嫌疑</text>
  <text x="564" y="374" font-size="10" fill="#6B6B6B">⚠ 比「率」不比「人數」：B 班 3 人 &gt; C 班 2 人，</text>
  <text x="564" y="387" font-size="10" fill="#6B6B6B">　但 B 率 10% &lt; C 率 20%（B 班人多）</text>
  <g filter="url(#shadow)"><rect x="24" y="418" width="560" height="140" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="42" y="444" font-size="14" font-weight="bold" fill="#1A1A1A">📋 SitRep：一頁講完的戰情報告</text>
  <text x="42" y="470" font-size="11.5" fill="#1A1A1A">• 全校 60 人，<tspan font-weight="bold">17 人中鏢（28%）</tspan></text>
  <text x="42" y="491" font-size="11.5" fill="#1A1A1A">• 最嚴重：<tspan font-weight="bold" fill="#788C5D">A 班（侵襲率 60%）</tspan></text>
  <text x="42" y="512" font-size="11.5" fill="#1A1A1A">• 高峰：<tspan font-weight="bold" fill="#D97757">第 3 天</tspan>（單一高峰 → 可能同一個來源）</text>
  <text x="42" y="533" font-size="11.5" fill="#1A1A1A">• 建議：<tspan font-weight="bold" fill="#D94452">先停用並清消 A 班飲水機</tspan> 💧</text>
  <text x="42" y="551" font-size="9.5" fill="#6B6B6B">（描述性分析只指出「嫌疑犯」，定罪要靠後面的 2×2、迴歸 + 環境採檢）</text>
  <line x1="592" y1="488" x2="628" y2="488" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#arr)"/>
