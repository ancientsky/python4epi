<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#788C5D"/>
    </marker>
  </defs>

  <rect width="750" height="430" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">為什麼算 CI 要先取 log？三步驟直覺解說</text>

  <!-- Step 1: Original Scale -->
  <g filter="url(#shadow)">
    <rect x="30" y="55" width="690" height="100" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="30" y="55" width="40" height="100" rx="10" fill="#D97757"/>
  <rect x="50" y="55" width="20" height="100" fill="#D97757"/>
  <text x="50" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFF" transform="rotate(-90, 50, 110)">1</text>

  <text x="90" y="78" font-size="13" font-weight="bold" fill="#D97757">原始尺度（Original Scale）</text>
  <text x="90" y="95" font-size="11" fill="#6B6B6B">RR 的範圍：0 到 ∞（無限大），以 1 為中心</text>

  <!-- Number line -->
  <line x1="100" y1="120" x2="690" y2="120" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Ticks -->
  <line x1="130" y1="115" x2="130" y2="125" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="130" y="140" text-anchor="middle" font-size="11" fill="#6B6B6B">0</text>
  <line x1="280" y1="115" x2="280" y2="125" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#6A9BCC" font-weight="bold">1</text>
  <text x="280" y="152" text-anchor="middle" font-size="10" fill="#6A9BCC">無效果</text>
  <line x1="430" y1="115" x2="430" y2="125" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#6B6B6B">2</text>
  <line x1="580" y1="115" x2="580" y2="125" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="580" y="140" text-anchor="middle" font-size="11" fill="#6B6B6B">3</text>
  <text x="680" y="140" text-anchor="middle" font-size="11" fill="#6B6B6B">∞</text>
  <!-- RR dot -->
  <circle cx="460" cy="120" r="7" fill="#D97757"/>
  <text x="460" y="108" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">RR = 2.1</text>

  <!-- Problem callout -->
  <rect x="500" y="72" width="195" height="38" rx="6" fill="#D97757" fill-opacity="0.1" stroke="#D97757" stroke-width="1"/>
  <text x="510" y="88" font-size="11" fill="#D97757" font-weight="bold">問題：左邊只有 0~1</text>
  <text x="510" y="103" font-size="11" fill="#D97757">右邊卻延伸到 ∞ → 不對稱！</text>

  <!-- Arrow down to step 2 -->
  <line x1="375" y1="158" x2="375" y2="178" stroke="#788C5D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="172" font-size="12" fill="#788C5D" font-weight="bold">ln() 取自然對數</text>

  <!-- Step 2: Log Scale -->
  <g filter="url(#shadow)">
    <rect x="30" y="185" width="690" height="100" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="30" y="185" width="40" height="100" rx="10" fill="#788C5D"/>
  <rect x="50" y="185" width="20" height="100" fill="#788C5D"/>
  <text x="50" y="242" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFF" transform="rotate(-90, 50, 240)">2</text>

  <text x="90" y="208" font-size="13" font-weight="bold" fill="#788C5D">對數尺度（Log Scale）— 對稱了！</text>
  <text x="90" y="225" font-size="11" fill="#6B6B6B">ln(RR) 的範圍：-∞ 到 +∞，以 0 為中心 → 可以用常態分布</text>

  <!-- Log number line -->
  <line x1="100" y1="252" x2="690" y2="252" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="190" y1="247" x2="190" y2="257" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#6B6B6B">-1</text>
  <line x1="370" y1="247" x2="370" y2="257" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="370" y="270" text-anchor="middle" font-size="12" fill="#6A9BCC" font-weight="bold">0</text>
  <text x="370" y="282" text-anchor="middle" font-size="10" fill="#6A9BCC">ln(1)=0</text>
  <line x1="550" y1="247" x2="550" y2="257" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="550" y="270" text-anchor="middle" font-size="11" fill="#6B6B6B">1</text>
  <!-- ln(RR) dot -->
  <circle cx="505" cy="252" r="7" fill="#D97757"/>
  <text x="505" y="240" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">ln(2.1) = 0.74</text>

  <!-- CI bracket on log scale -->
  <line x1="405" y1="252" x2="605" y2="252" stroke="#788C5D" stroke-width="3" opacity="0.5"/>
  <line x1="405" y1="245" x2="405" y2="259" stroke="#788C5D" stroke-width="2"/>
  <line x1="605" y1="245" x2="605" y2="259" stroke="#788C5D" stroke-width="2"/>
  <text x="505" y="220" text-anchor="middle" font-size="10" fill="#788C5D">← ±1.96 × SE →</text>

  <!-- 1.96 explanation -->
  <rect x="550" y="198" width="160" height="30" rx="6" fill="#788C5D" fill-opacity="0.1" stroke="#788C5D" stroke-width="1"/>
  <text x="560" y="217" font-size="10" fill="#788C5D">1.96 = 常態分布 95% z 值</text>

  <!-- Arrow down to step 3 -->
  <line x1="375" y1="288" x2="375" y2="308" stroke="#788C5D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="302" font-size="12" fill="#788C5D" font-weight="bold">exp() 轉回原始尺度</text>

  <!-- Step 3: Back to Original -->
  <g filter="url(#shadow)">
    <rect x="30" y="315" width="690" height="100" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="30" y="315" width="40" height="100" rx="10" fill="#6A9BCC"/>
  <rect x="50" y="315" width="20" height="100" fill="#6A9BCC"/>
  <text x="50" y="372" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFF" transform="rotate(-90, 50, 370)">3</text>

  <text x="90" y="338" font-size="13" font-weight="bold" fill="#6A9BCC">回到原始尺度 — 得到 95% CI！</text>
  <text x="90" y="355" font-size="11" fill="#6B6B6B">exp(ln(RR) ± 1.96 × SE) → CI 下界和上界</text>

  <!-- Original number line with CI -->
  <line x1="100" y1="382" x2="690" y2="382" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="130" y1="377" x2="130" y2="387" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="130" y="400" text-anchor="middle" font-size="11" fill="#6B6B6B">0</text>
  <line x1="280" y1="377" x2="280" y2="387" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#6A9BCC" font-weight="bold">1</text>
  <line x1="430" y1="377" x2="430" y2="387" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="430" y="400" text-anchor="middle" font-size="11" fill="#6B6B6B">2</text>
  <line x1="580" y1="377" x2="580" y2="387" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="580" y="400" text-anchor="middle" font-size="11" fill="#6B6B6B">3</text>

  <!-- RR dot -->
  <circle cx="460" cy="382" r="7" fill="#D97757"/>

  <!-- CI bracket -->
  <line x1="340" y1="382" x2="570" y2="382" stroke="#788C5D" stroke-width="4" opacity="0.4"/>
  <line x1="340" y1="375" x2="340" y2="389" stroke="#788C5D" stroke-width="2.5"/>
  <line x1="570" y1="375" x2="570" y2="389" stroke="#788C5D" stroke-width="2.5"/>
  <text x="340" y="410" text-anchor="middle" font-size="10" fill="#788C5D" font-weight="bold">CI 下界</text>
  <text x="460" y="370" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">RR = 2.1</text>
  <text x="570" y="410" text-anchor="middle" font-size="10" fill="#788C5D" font-weight="bold">CI 上界</text>

  <!-- Key insight -->
  <rect x="530" y="328" width="180" height="38" rx="6" fill="#788C5D" fill-opacity="0.1" stroke="#788C5D" stroke-width="1"/>
  <text x="540" y="344" font-size="11" fill="#788C5D" font-weight="bold">CI 不含 1 → 顯著</text>
  <text x="540" y="360" font-size="11" fill="#788C5D">CI 含 1 → 不顯著</text>
</svg>
