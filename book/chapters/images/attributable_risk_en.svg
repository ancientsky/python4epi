<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="800" height="450" fill="#FAF8F3" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A1A1A">Attributable Risk (AR) and Population Attributable Risk (PAR)</text>
  <text x="400" y="50" text-anchor="middle" font-size="11.5" fill="#6B6B6B">Same idea, two scales: individual-level vs population-level</text>

  <!-- Left: AR bar chart -->
  <g filter="url(#shadow)"><rect x="20" y="80" width="370" height="320" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/></g>
  <text x="205" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">AR: Exposed vs Unexposed Incidence</text>

  <line x1="70" y1="350" x2="360" y2="350" stroke="#1A1A1A" stroke-width="1"/>

  <rect x="90" y="160" width="80" height="190" fill="#D97757"/>
  <text x="130" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">Exposed incidence</text>

  <rect x="240" y="270" width="80" height="80" fill="#6A9BCC"/>
  <text x="280" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">Unexposed incidence</text>

  <!-- bracket showing the difference -->
  <line x1="205" y1="160" x2="205" y2="270" stroke="#1A1A1A" stroke-width="1.6"/>
  <line x1="195" y1="160" x2="215" y2="160" stroke="#1A1A1A" stroke-width="1.6"/>
  <line x1="195" y1="270" x2="215" y2="270" stroke="#1A1A1A" stroke-width="1.6"/>
  <text x="212" y="219" text-anchor="start" font-size="11" font-weight="bold" fill="#1A1A1A">AR</text>

  <text x="205" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">AR = difference in incidence between groups</text>

  <!-- Right: PAR population bar -->
  <g filter="url(#shadow)"><rect x="410" y="80" width="370" height="320" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/></g>
  <text x="595" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">PAR: Case Composition of the Whole Population</text>

  <text x="595" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#6B6B6B">100% population</text>

  <!-- attributable-case slice (top of exposed segment) -->
  <rect x="555" y="150" width="80" height="25" fill="#D94452"/>
  <!-- rest of exposed segment (baseline risk) -->
  <rect x="555" y="175" width="80" height="55" fill="#D97757" fill-opacity="0.3"/>
  <!-- unexposed segment -->
  <rect x="555" y="230" width="80" height="120" fill="#6A9BCC" fill-opacity="0.3"/>
  <!-- outline + separators -->
  <rect x="555" y="150" width="80" height="200" fill="none" stroke="#1A1A1A" stroke-width="1.3"/>
  <line x1="555" y1="175" x2="635" y2="175" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="555" y1="230" x2="635" y2="230" stroke="#FFFFFF" stroke-width="1.5"/>

  <text x="595" y="207" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A1A1A">Exposed</text>
  <text x="595" y="294" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1A1A1A">Unexposed</text>

  <line x1="635" y1="162" x2="648" y2="163" stroke="#D94452" stroke-width="1.3"/>
  <text x="648" y="158" text-anchor="start" font-size="8.5" font-weight="bold" fill="#D94452">Attributable cases</text>
  <text x="648" y="170" text-anchor="start" font-size="8.5" font-weight="bold" fill="#D94452">(PAR numerator)</text>

  <text x="595" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">PAR = cases avoided if exposure were removed</text>

  <!-- Footer -->
  <text x="400" y="425" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B6B6B">AR/PAR only mean this when causality actually holds</text>
</svg>
