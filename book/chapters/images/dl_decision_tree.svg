<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
       <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker></defs>
  <rect width="800" height="660" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">該用深度學習嗎？別殺雞用牛刀</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">四個問題，由上而下依序檢查——符合哪一格，就停在那一格</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)"><rect x="40" y="90" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="118" font-size="11.5" font-weight="bold" fill="#1A1A1A">① 資料 &lt; 1000 筆？</text>
  <text x="60" y="140" font-size="9.5" fill="#6B6B6B">樣本量小</text>
  <text x="60" y="160" font-size="9.5" fill="#6B6B6B">280 筆的 Legionella 資料就是這種情況</text>

  <line x1="380" y1="135" x2="452" y2="135" stroke="#788C5D" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="127" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ 是</text>

  <g filter="url(#shadow)"><rect x="456" y="90" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="1.8"/></g>
  <text x="608" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">用傳統統計 / 簡單 ML</text>
  <text x="608" y="142" text-anchor="middle" font-size="9.5" fill="#6B6B6B">邏輯斯迴歸、隨機森林就夠了</text>
  <text x="608" y="160" text-anchor="middle" font-size="9.5" fill="#6B6B6B">小樣本上更穩、更好解釋</text>

  <line x1="210" y1="180" x2="210" y2="208" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="198" text-anchor="start" font-size="9.5" fill="#D94452">✗ 不是，往下看</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)"><rect x="40" y="210" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="238" font-size="11.5" font-weight="bold" fill="#1A1A1A">② 需要明確因果或機制？</text>
  <text x="60" y="260" font-size="9.5" fill="#6B6B6B">想知道「為什麼」，不只是「會不會」</text>
  <text x="60" y="280" font-size="9.5" fill="#6B6B6B">例如：想解釋傳播機轉</text>

  <line x1="380" y1="255" x2="452" y2="255" stroke="#6A9BCC" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="247" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A9BCC">✓ 是</text>

  <g filter="url(#shadow)"><rect x="456" y="210" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.8"/></g>
  <text x="608" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">SEIR + 簡單 ML</text>
  <text x="608" y="262" text-anchor="middle" font-size="9.5" fill="#6B6B6B">機制模型 + 少量特徵，可解釋</text>
  <text x="608" y="280" text-anchor="middle" font-size="9.5" fill="#6B6B6B">見 Ch07 時間序列章節</text>

  <line x1="210" y1="300" x2="210" y2="328" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="318" text-anchor="start" font-size="9.5" fill="#D94452">✗ 不是，往下看</text>

  <!-- Row 3 -->
  <g filter="url(#shadow)"><rect x="40" y="330" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="356" font-size="11" font-weight="bold" fill="#1A1A1A">③ 高維非線性、時空、長序列，</text>
  <text x="60" y="374" font-size="11" font-weight="bold" fill="#1A1A1A">　且資料量大？</text>
  <text x="60" y="396" font-size="9.5" fill="#6B6B6B">影像、長時間數列、大規模資料</text>

  <line x1="380" y1="375" x2="452" y2="375" stroke="#D97757" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97757">✓ 是</text>

  <g filter="url(#shadow)"><rect x="456" y="330" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2.4"/></g>
  <text x="608" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">用 DL</text>
  <text x="608" y="382" text-anchor="middle" font-size="9.5" fill="#6B6B6B">CNN / LSTM / Transformer 等</text>
  <text x="608" y="400" text-anchor="middle" font-size="9.5" fill="#6B6B6B">資料量夠大才划算</text>

  <line x1="210" y1="420" x2="210" y2="448" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="438" text-anchor="start" font-size="9.5" fill="#D94452">✗ 不是，往下看</text>

  <!-- Row 4 -->
  <g filter="url(#shadow)"><rect x="40" y="450" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="478" font-size="11.5" font-weight="bold" fill="#1A1A1A">④ 新病原，初期資料極少？</text>
  <text x="60" y="500" font-size="9.5" fill="#6B6B6B">群突發剛爆發，案例還很少</text>
  <text x="60" y="520" font-size="9.5" fill="#6B6B6B">但外面已有大量其他疫情的資料</text>

  <line x1="380" y1="495" x2="452" y2="495" stroke="#6A9BCC" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A9BCC">✓ 是</text>

  <g filter="url(#shadow)"><rect x="456" y="450" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.8"/></g>
  <text x="608" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">TSFM 零樣本 / 少樣本</text>
  <text x="608" y="502" text-anchor="middle" font-size="9.5" fill="#6B6B6B">借用已訓練好的時序基礎模型</text>
  <text x="608" y="520" text-anchor="middle" font-size="9.5" fill="#6B6B6B">不用等資料累積夠才能預測</text>

  <line x1="210" y1="540" x2="210" y2="568" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="554" text-anchor="start" font-size="9.5" fill="#D94452">✗ 以上皆非</text>

  <!-- Final fallback -->
  <rect x="40" y="570" width="720" height="66" rx="8" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="400" y="597" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A1A1A">以上皆非？</text>
  <text x="400" y="618" text-anchor="middle" font-size="10.5" fill="#6B6B6B">資料量普通、無特殊時空／因果需求 → 用 Ch10 的 sklearn baseline 最省力</text>
</svg>
