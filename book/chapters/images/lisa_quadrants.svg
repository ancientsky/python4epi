<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker></defs>
  <rect width="760" height="480" fill="#FAF8F3" rx="12"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">LISA 的四種鄰里：每個縣市跟鄰居是什麼關係？</text>
  <text x="380" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">看兩件事：這個縣市「自己的率」× 它「鄰居的平均率」</text>
  <rect x="116" y="78" width="278" height="151" rx="10" fill="#9FC0E0" fill-opacity="0.13" stroke="#9FC0E0" stroke-width="1.5"/>
  <text x="255" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#9FC0E0">LH 低-高</text>
  <text x="255" y="128" text-anchor="middle" font-size="11.5" fill="#1A1A1A">颱風眼（自己低·鄰居高）</text>
  <text x="255" y="148" text-anchor="middle" font-size="10.5" fill="#6B6B6B">→ 空間離群值！快防守/取經</text>
  <rect x="406" y="78" width="278" height="151" rx="10" fill="#D94452" fill-opacity="0.13" stroke="#D94452" stroke-width="1.5"/>
  <text x="545" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#D94452">HH 高-高</text>
  <text x="545" y="128" text-anchor="middle" font-size="11.5" fill="#1A1A1A">疫情震央（自己高·鄰居高）</text>
  <text x="545" y="148" text-anchor="middle" font-size="10.5" fill="#6B6B6B">→ 全區作戰、找共同傳染源</text>
  <rect x="116" y="241" width="278" height="151" rx="10" fill="#6A9BCC" fill-opacity="0.13" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="255" y="269" text-anchor="middle" font-size="15" font-weight="bold" fill="#6A9BCC">LL 低-低</text>
  <text x="255" y="291" text-anchor="middle" font-size="11.5" fill="#1A1A1A">安全淨土（自己低·鄰居低）</text>
  <text x="255" y="311" text-anchor="middle" font-size="10.5" fill="#6B6B6B">→ 低優先、可當對照區</text>
  <rect x="406" y="241" width="278" height="151" rx="10" fill="#D97757" fill-opacity="0.13" stroke="#D97757" stroke-width="1.5"/>
  <text x="545" y="269" text-anchor="middle" font-size="15" font-weight="bold" fill="#D97757">HL 高-低</text>
  <text x="545" y="291" text-anchor="middle" font-size="11.5" fill="#1A1A1A">孤島火苗（自己高·鄰居低）</text>
  <text x="545" y="311" text-anchor="middle" font-size="10.5" fill="#6B6B6B">→ 空間離群值！立刻查為什麼</text>
  <line x1="400" y1="68" x2="400" y2="402" stroke="#6B6B6B" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="106" y1="235" x2="694" y2="235" stroke="#6B6B6B" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="106" y1="420" x2="694" y2="420" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="400" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">這個縣市自己的登革熱率　低 → 高</text>
  <line x1="88" y1="402" x2="88" y2="68" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="76" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A" transform="rotate(-90 76 235)">鄰居的平均率　低 → 高</text>
  <text x="380" y="463" text-anchor="middle" font-size="11.5" fill="#1A1A1A">對角線（HH/LL）＝跟鄰居同調（群聚成員）；反對角（HL/LH）＝跟鄰居唱反調（空間離群值）</text>
</svg>
