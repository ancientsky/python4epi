<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#FAF8F3" rx="12"/>

  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Spot Map 拆解 —— 每個設計決策都有原因</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#6B6B6B">散點圖模擬護理之家平面圖：x/y 座標、大小、顏色各有含義</text>

  <!-- Left: Mock spot map -->
  <g filter="url(#shadow)">
    <rect x="30" y="68" width="430" height="300" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="100" x2="80" y2="330" stroke="#1A1A1A" stroke-width="1.5"/>
  <line x1="80" y1="330" x2="440" y2="330" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="58" y="120" text-anchor="end" font-size="9" fill="#6B6B6B">3F</text>
  <text x="58" y="215" text-anchor="end" font-size="9" fill="#6B6B6B">2F</text>
  <text x="58" y="310" text-anchor="end" font-size="9" fill="#6B6B6B">1F</text>
  <text x="260" y="348" text-anchor="middle" font-size="9" fill="#6B6B6B">← A 翼 (room 1–15) ── gap ── B 翼 (room 1–15) →</text>

  <!-- Wing separator line -->
  <line x1="250" y1="100" x2="250" y2="330" stroke="#6B6B6B" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="250" y="96" text-anchor="middle" font-size="8" fill="#6B6B6B">翼區分隔</text>

  <!-- A Wing label -->
  <text x="160" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#6B6B6B">A 翼</text>
  <!-- B Wing label -->
  <text x="355" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#6B6B6B">B 翼</text>

  <!-- Scatter dots — 1F A wing (low AR) -->
  <circle cx="100" cy="310" r="7" fill="#FCBA74" opacity="0.85"/>
  <circle cx="118" cy="310" r="5" fill="#FCBA74" opacity="0.85"/>
  <circle cx="136" cy="310" r="8" fill="#FED98E" opacity="0.85"/>
  <circle cx="154" cy="310" r="6" fill="#FCBA74" opacity="0.85"/>
  <circle cx="172" cy="310" r="7" fill="#FEE6C0" opacity="0.85"/>

  <!-- 1F B wing (medium AR) -->
  <circle cx="268" cy="310" r="7" fill="#F07D4F" opacity="0.85"/>
  <circle cx="286" cy="310" r="5" fill="#FCBA74" opacity="0.85"/>
  <circle cx="304" cy="310" r="8" fill="#F07D4F" opacity="0.85"/>
  <circle cx="322" cy="310" r="6" fill="#FCBA74" opacity="0.85"/>
  <circle cx="340" cy="310" r="7" fill="#FED98E" opacity="0.85"/>

  <!-- 2F A wing (high AR) -->
  <circle cx="100" cy="215" r="9" fill="#D94452" opacity="0.85"/>
  <circle cx="122" cy="215" r="7" fill="#E85B3A" opacity="0.85"/>
  <circle cx="144" cy="215" r="10" fill="#D94452" opacity="0.85"/>
  <circle cx="166" cy="215" r="8" fill="#E85B3A" opacity="0.85"/>
  <circle cx="188" cy="215" r="9" fill="#D94452" opacity="0.85"/>

  <!-- 2F B wing (very high AR) -->
  <circle cx="268" cy="215" r="11" fill="#D94452" opacity="0.85"/>
  <circle cx="292" cy="215" r="8" fill="#D94452" opacity="0.85"/>
  <circle cx="316" cy="215" r="10" fill="#D94452" opacity="0.85"/>
  <circle cx="340" cy="215" r="9" fill="#E85B3A" opacity="0.85"/>

  <!-- 3F (medium) -->
  <circle cx="110" cy="120" r="6" fill="#F07D4F" opacity="0.85"/>
  <circle cx="128" cy="120" r="8" fill="#FCBA74" opacity="0.85"/>
  <circle cx="146" cy="120" r="7" fill="#F07D4F" opacity="0.85"/>
  <circle cx="164" cy="120" r="5" fill="#FED98E" opacity="0.85"/>

  <circle cx="268" cy="120" r="8" fill="#F07D4F" opacity="0.85"/>
  <circle cx="288" cy="120" r="10" fill="#D94452" opacity="0.85"/>
  <circle cx="308" cy="120" r="7" fill="#F07D4F" opacity="0.85"/>
  <circle cx="328" cy="120" r="9" fill="#E85B3A" opacity="0.85"/>

  <!-- Colorbar -->
  <defs>
    <linearGradient id="ar_grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FEE6C0"/>
      <stop offset="50%" stop-color="#F07D4F"/>
      <stop offset="100%" stop-color="#D94452"/>
    </linearGradient>
  </defs>
  <rect x="85" y="355" width="380" height="10" rx="3" fill="url(#ar_grad)"/>
  <text x="85" y="375" font-size="8" fill="#6B6B6B">0%</text>
  <text x="275" y="375" text-anchor="middle" font-size="8" fill="#6B6B6B">侵襲率 (%)</text>
  <text x="465" y="375" text-anchor="end" font-size="8" fill="#6B6B6B">100%</text>

  <!-- Annotations pointing at plot -->
  <!-- Annotation 1: x offset -->
  <line x1="250" y1="180" x2="290" y2="158" stroke="#6A9BCC" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="290" y="138" width="130" height="26" rx="4" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1"/>
  <text x="355" y="150" text-anchor="middle" font-size="9" font-weight="bold" fill="#6A9BCC">① x offset = B 翼右移</text>
  <text x="355" y="161" text-anchor="middle" font-size="8" fill="#1A1A1A">max_room_A + gap</text>

  <!-- Annotation 2: dot size -->
  <circle cx="188" cy="215" r="9" fill="none" stroke="#D97757" stroke-width="1.5"/>
  <line x1="197" y1="208" x2="230" y2="185" stroke="#D97757" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="195" y="168" width="105" height="24" rx="4" fill="#FFFFFF" stroke="#D97757" stroke-width="1"/>
  <text x="248" y="180" text-anchor="middle" font-size="9" font-weight="bold" fill="#D97757">② 大小 = 住民數</text>
  <text x="248" y="189" text-anchor="middle" font-size="8" fill="#1A1A1A">s = total × 50</text>

  <!-- Right: Reading checklist -->
  <g filter="url(#shadow)">
    <rect x="478" y="68" width="292" height="300" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="478" y="68" width="292" height="34" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <text x="624" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">讀 Spot Map 四步驟</text>

  <!-- Step 1 -->
  <rect x="492" y="114" width="264" height="58" rx="6" fill="#F5F3EE"/>
  <text x="502" y="131" font-size="11" font-weight="bold" fill="#D97757">① 找顏色深的群聚</text>
  <text x="502" y="147" font-size="10" fill="#1A1A1A">深色區塊 = 侵襲率高的房間</text>
  <text x="502" y="162" font-size="10" fill="#6B6B6B">→ 優先調查那些翼區的水源</text>

  <!-- Step 2 -->
  <rect x="492" y="182" width="264" height="58" rx="6" fill="#F5F3EE"/>
  <text x="502" y="199" font-size="11" font-weight="bold" fill="#6A9BCC">② 看圓點大小</text>
  <text x="502" y="215" font-size="10" fill="#1A1A1A">大圓點 = 住民多，侵襲率更可信</text>
  <text x="502" y="230" font-size="10" fill="#6B6B6B">→ 小圓點 1/1 = 100% 但僅 1 人</text>

  <!-- Step 3 -->
  <rect x="492" y="250" width="264" height="58" rx="6" fill="#F5F3EE"/>
  <text x="502" y="267" font-size="11" font-weight="bold" fill="#788C5D">③ 比較翼區左右</text>
  <text x="502" y="283" font-size="10" fill="#1A1A1A">分隔線左右是否顏色明顯不同？</text>
  <text x="502" y="298" font-size="10" fill="#6B6B6B">→ 差異大 = 翼區特異性暴露</text>

  <!-- Step 4 -->
  <rect x="492" y="318" width="264" height="40" rx="6" fill="#F5F3EE"/>
  <text x="502" y="335" font-size="11" font-weight="bold" fill="#D94452">④ 比較樓層高低</text>
  <text x="502" y="350" font-size="10" fill="#1A1A1A">高樓是否比低樓嚴重？（垂直傳播？）</text>

  <!-- Bottom bar -->
  <g filter="url(#shadow)">
    <rect x="30" y="385" width="740" height="24" rx="8" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="400" y="401" text-anchor="middle" font-size="10" fill="#1A1A1A"><tspan font-weight="bold" fill="#D97757">口訣：</tspan>「顏色找群聚、大小看可信度、左右比翼區、上下比樓層」</text>
</svg>
