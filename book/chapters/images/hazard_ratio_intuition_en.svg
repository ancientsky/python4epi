<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">RR vs. OR vs. HR — Three Effect Measures Compared</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">HR is a "rate ratio," not a "probability ratio" — see how each one fits in</text>

  <!-- LEFT: RR card -->
  <g filter="url(#shadow)">
    <rect x="30" y="74" width="240" height="240" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="30" y="74" width="240" height="36" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">Risk Ratio (RR)</text>

  <text x="150" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">"Ratio of probabilities"</text>
  <rect x="50" y="148" width="200" height="44" rx="6" fill="#F5F3EE"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">RR = P(event|exposed)</text>
  <text x="150" y="184" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">     / P(event|unexposed)</text>

  <text x="150" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Cohort studies, RCTs</text>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#6B6B6B">Only asks "did it happen"</text>
  <text x="150" y="246" text-anchor="middle" font-size="10" fill="#D94452">✗ Ignores time</text>
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#D94452">✗ Can't handle censoring</text>

  <rect x="50" y="278" width="200" height="28" rx="6" fill="#6A9BCC" fill-opacity="0.1"/>
  <text x="150" y="296" text-anchor="middle" font-size="10" font-style="italic" fill="#6A9BCC">Ch03, Ch06 (Modified Poisson)</text>

  <!-- MIDDLE: OR card -->
  <g filter="url(#shadow)">
    <rect x="280" y="74" width="240" height="240" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>
  </g>
  <rect x="280" y="74" width="240" height="36" rx="10" fill="#788C5D" fill-opacity="0.15"/>
  <text x="400" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#788C5D">Odds Ratio (OR)</text>

  <text x="400" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">"Ratio of odds"</text>
  <rect x="300" y="148" width="200" height="44" rx="6" fill="#F5F3EE"/>
  <text x="400" y="168" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">OR = odds(exposed)</text>
  <text x="400" y="184" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">     / odds(unexposed)</text>

  <text x="400" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Case-control studies</text>
  <text x="400" y="230" text-anchor="middle" font-size="10" fill="#6B6B6B">≈ RR when prevalence is low</text>
  <text x="400" y="246" text-anchor="middle" font-size="10" fill="#D94452">✗ Overestimates at high attack rate</text>
  <text x="400" y="262" text-anchor="middle" font-size="10" fill="#D94452">✗ Ignores time</text>

  <rect x="300" y="278" width="200" height="28" rx="6" fill="#788C5D" fill-opacity="0.1"/>
  <text x="400" y="296" text-anchor="middle" font-size="10" font-style="italic" fill="#788C5D">Ch06 (Logistic regression)</text>

  <!-- RIGHT: HR card -->
  <g filter="url(#shadow)">
    <rect x="530" y="74" width="240" height="240" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="530" y="74" width="240" height="36" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <text x="650" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">Hazard Ratio (HR)</text>

  <text x="650" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">"Ratio of rates"</text>
  <rect x="550" y="148" width="200" height="44" rx="6" fill="#F5F3EE"/>
  <text x="650" y="168" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">HR = h(t|exposed)</text>
  <text x="650" y="184" text-anchor="middle" font-size="11" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">     / h(t|unexposed)</text>

  <text x="650" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Accounts for time</text>
  <text x="650" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Handles censoring</text>
  <text x="650" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Adjusts for multiple factors</text>
  <text x="650" y="262" text-anchor="middle" font-size="10" fill="#D94452">✗ Requires PH assumption</text>

  <rect x="550" y="278" width="200" height="28" rx="6" fill="#D97757" fill-opacity="0.1"/>
  <text x="650" y="296" text-anchor="middle" font-size="10" font-style="italic" fill="#D97757">Ch09 (Cox regression)</text>

  <!-- Bottom: PH assumption visual -->
  <g filter="url(#shadow)">
    <rect x="30" y="334" width="740" height="150" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="400" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">Proportional Hazards (PH) Assumption — the precondition for using HR</text>

  <!-- Left: parallel log-log (PH holds) -->
  <rect x="60" y="376" width="320" height="90" rx="6" fill="#F5F3EE"/>
  <text x="220" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#788C5D">✓ Lines parallel → PH holds</text>

  <line x1="80" y1="452" x2="360" y2="452" stroke="#1A1A1A" stroke-width="1"/>
  <text x="220" y="473" text-anchor="middle" font-size="9" fill="#6B6B6B">log(time)</text>
  <!-- Two parallel curves -->
  <path d="M 90 440 Q 150 430 220 418 T 355 400" fill="none" stroke="#D97757" stroke-width="2"/>
  <path d="M 90 418 Q 150 408 220 396 T 355 378" fill="none" stroke="#6A9BCC" stroke-width="2"/>
  <text x="360" y="405" font-size="9" fill="#6A9BCC">Exposed</text>
  <text x="360" y="445" font-size="9" fill="#D97757">Unexposed</text>

  <!-- Right: crossing log-log (PH violated) -->
  <rect x="420" y="376" width="320" height="90" rx="6" fill="#F5F3EE"/>
  <text x="580" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#D94452">✗ Lines cross → PH violated</text>

  <line x1="440" y1="452" x2="720" y2="452" stroke="#1A1A1A" stroke-width="1"/>
  <text x="580" y="473" text-anchor="middle" font-size="9" fill="#6B6B6B">log(time)</text>
  <!-- Two crossing curves -->
  <path d="M 450 440 Q 510 420 580 405 T 715 380" fill="none" stroke="#D97757" stroke-width="2"/>
  <path d="M 450 395 Q 510 400 580 408 T 715 438" fill="none" stroke="#6A9BCC" stroke-width="2"/>
  <!-- Cross marker -->
  <circle cx="580" cy="406" r="3" fill="#D94452"/>
  <text x="720" y="440" font-size="9" fill="#6A9BCC">Group A</text>
  <text x="720" y="378" font-size="9" fill="#D97757">Group B</text>

  <text x="400" y="495" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">When PH is violated: use stratification (strata), time-varying coefficients, or avoid Cox</text>
</svg>
