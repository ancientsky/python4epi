<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D94452"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Confounder DAG — Why Is the Shower RR Inflated?</text>

  <g filter="url(#shadow)">
    <rect x="30" y="50" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <rect x="280" y="68" width="240" height="44" rx="22" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#D97757">C: Functional status</text>
  <text x="400" y="101" text-anchor="middle" font-size="11" fill="#D97757">(functional_status)</text>

  <rect x="80" y="155" width="200" height="44" rx="22" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  <text x="180" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">Exposure: shower_use</text>

  <rect x="520" y="155" width="200" height="44" rx="22" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  <text x="620" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">Outcome: Infection</text>

  <line x1="330" y1="112" x2="230" y2="155" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="128" font-size="9" fill="#6B6B6B" transform="rotate(-25,250,128)">Mobile → showers</text>

  <line x1="470" y1="112" x2="570" y2="155" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="128" font-size="9" fill="#6B6B6B" transform="rotate(25,540,128)">Active → more exposure</text>

  <line x1="280" y1="177" x2="520" y2="177" stroke="#6A9BCC" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-dasharray="8,4"/>
  <text x="400" y="170" text-anchor="middle" font-size="9" fill="#6A9BCC" font-weight="bold">Causal effect of interest (possibly inflated)</text>

  <g filter="url(#shadow)">
    <rect x="30" y="240" width="355" height="165" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="207" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">Everyday Analogy: Raincoats and Colds</text>

  <text x="50" y="290" font-size="12" fill="#6B6B6B">Observation: raincoat wearers get more colds</text>
  <text x="50" y="310" font-size="12" fill="#6B6B6B">→ Does wearing a raincoat cause colds? No!</text>
  <text x="50" y="335" font-size="12" fill="#D97757" font-weight="bold">Confounder C: Rainy weather</text>
  <text x="50" y="355" font-size="12" fill="#6B6B6B">Rain → raincoat (C → exposure)</text>
  <text x="50" y="375" font-size="12" fill="#6B6B6B">Rain → more colds (C → outcome)</text>
  <text x="50" y="395" font-size="12" fill="#788C5D" font-weight="bold">Control for rain, and the link disappears.</text>

  <g filter="url(#shadow)">
    <rect x="415" y="240" width="355" height="165" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="592" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">Confounder: 3 Criteria (all required)</text>

  <rect x="435" y="280" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="295" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">1</text>
  <text x="465" y="295" font-size="12" fill="#1A1A1A">C is associated with <tspan font-weight="bold" fill="#6A9BCC">exposure</tspan></text>

  <rect x="435" y="310" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="325" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">2</text>
  <text x="465" y="325" font-size="12" fill="#1A1A1A">C is associated with <tspan font-weight="bold" fill="#D97757">outcome</tspan></text>

  <rect x="435" y="340" width="20" height="20" rx="4" fill="#788C5D"/>
  <text x="445" y="355" text-anchor="middle" font-size="13" fill="#FFF" font-weight="bold">3</text>
  <text x="465" y="355" font-size="12" fill="#1A1A1A">C is <tspan font-weight="bold" fill="#D94452">not</tspan> an intermediate variable</text>
  <text x="465" y="369" font-size="12" fill="#1A1A1A">on the exposure→outcome pathway</text>

  <text x="465" y="393" font-size="11" fill="#6B6B6B">All 3 met → C is a confounder → adjust for it!</text>
</svg>
