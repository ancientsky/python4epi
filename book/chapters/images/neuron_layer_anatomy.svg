<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
       <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker></defs>
  <rect width="800" height="460" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">神經元解剖：一個 neuron 到底在算什麼？</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">inputs×weights → 加總+bias → activation → output，疊起來就是一層網路</text>

  <!-- LEFT CARD: single neuron -->
  <g filter="url(#shadow)"><rect x="20" y="72" width="372" height="366" rx="12" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="206" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">單一 Neuron 的運算步驟</text>

  <!-- mini labels row -->
  <text x="62" y="128" text-anchor="middle" font-size="9" fill="#6B6B6B">inputs</text>
  <text x="175" y="128" text-anchor="middle" font-size="9" fill="#6B6B6B">Σ + bias</text>
  <text x="270" y="128" text-anchor="middle" font-size="9" fill="#6B6B6B">activation</text>
  <text x="350" y="128" text-anchor="middle" font-size="9" fill="#6B6B6B">output</text>

  <!-- connecting lines (drawn first, under nodes) -->
  <line x1="62" y1="155" x2="175" y2="215" stroke="#6B6B6B" stroke-width="1.2"/>
  <line x1="62" y1="215" x2="175" y2="215" stroke="#6B6B6B" stroke-width="1.2"/>
  <line x1="62" y1="275" x2="175" y2="215" stroke="#6B6B6B" stroke-width="1.2"/>
  <text x="103" y="176" text-anchor="middle" font-size="9" fill="#6B6B6B">w1</text>
  <text x="103" y="209" text-anchor="middle" font-size="9" fill="#6B6B6B">w2</text>
  <text x="103" y="256" text-anchor="middle" font-size="9" fill="#6B6B6B">w3</text>

  <line x1="203" y1="215" x2="225" y2="215" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="315" y1="215" x2="328" y2="215" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- input nodes -->
  <circle cx="62" cy="155" r="15" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="62" y="159" text-anchor="middle" font-size="10" fill="#1A1A1A">x1</text>
  <circle cx="62" cy="215" r="15" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="62" y="219" text-anchor="middle" font-size="10" fill="#1A1A1A">x2</text>
  <circle cx="62" cy="275" r="15" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="62" y="279" text-anchor="middle" font-size="10" fill="#1A1A1A">x3</text>

  <!-- sum node -->
  <circle cx="175" cy="215" r="28" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-width="2"/>
  <text x="175" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">Σ+b</text>

  <!-- activation box -->
  <rect x="225" y="188" width="90" height="54" rx="8" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.3"/>
  <text x="270" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">ReLU</text>
  <text x="270" y="230" text-anchor="middle" font-size="9" fill="#6B6B6B">max(0, z)</text>

  <!-- output node -->
  <circle cx="350" cy="215" r="22" fill="#788C5D" fill-opacity="0.12" stroke="#788C5D" stroke-width="2"/>
  <text x="350" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#788C5D">ŷ</text>

  <!-- bottom explanation strip -->
  <rect x="40" y="304" width="312" height="118" rx="6" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="196" y="324" text-anchor="middle" font-size="10.5" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">z = Σ(xᵢ·wᵢ) + b → ReLU(z) = ŷ</text>
  <text x="196" y="344" text-anchor="middle" font-size="10" fill="#6B6B6B">① 每個 input 乘上自己的 weight</text>
  <text x="196" y="364" text-anchor="middle" font-size="10" fill="#6B6B6B">② 全部加總，再加上 bias</text>
  <text x="196" y="384" text-anchor="middle" font-size="10" fill="#6B6B6B">③ 丟進 activation（ReLU）留下訊號</text>
  <text x="196" y="404" text-anchor="middle" font-size="10" fill="#6B6B6B">④ 輸出到下一層，或就是最終結果</text>

  <!-- RIGHT CARD: 3-layer network -->
  <g filter="url(#shadow)"><rect x="412" y="72" width="368" height="366" rx="12" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="596" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">疊成一整層網路</text>

  <!-- edges input -> hidden -->
  <g stroke="#E8E5DF" stroke-width="1.2" opacity="0.9">
    <line x1="460" y1="160" x2="596" y2="140"/><line x1="460" y1="160" x2="596" y2="193"/><line x1="460" y1="160" x2="596" y2="247"/><line x1="460" y1="160" x2="596" y2="300"/>
    <line x1="460" y1="220" x2="596" y2="140"/><line x1="460" y1="220" x2="596" y2="193"/><line x1="460" y1="220" x2="596" y2="247"/><line x1="460" y1="220" x2="596" y2="300"/>
    <line x1="460" y1="280" x2="596" y2="140"/><line x1="460" y1="280" x2="596" y2="193"/><line x1="460" y1="280" x2="596" y2="247"/><line x1="460" y1="280" x2="596" y2="300"/>
  </g>
  <!-- edges hidden -> output -->
  <g stroke="#E8E5DF" stroke-width="1.2" opacity="0.9">
    <line x1="596" y1="140" x2="732" y2="220"/>
    <line x1="596" y1="193" x2="732" y2="220"/>
    <line x1="596" y1="247" x2="732" y2="220"/>
    <line x1="596" y1="300" x2="732" y2="220"/>
  </g>

  <!-- input layer nodes -->
  <circle cx="460" cy="160" r="13" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <circle cx="460" cy="220" r="13" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <circle cx="460" cy="280" r="13" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  <!-- hidden layer nodes -->
  <circle cx="596" cy="140" r="13" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <circle cx="596" cy="193" r="13" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <circle cx="596" cy="247" r="13" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <circle cx="596" cy="300" r="13" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  <!-- output layer node -->
  <circle cx="732" cy="220" r="15" fill="#FFFFFF" stroke="#788C5D" stroke-width="2"/>

  <!-- column labels -->
  <text x="460" y="340" text-anchor="middle" font-size="10" fill="#6B6B6B">輸入層</text>
  <text x="460" y="354" text-anchor="middle" font-size="9" fill="#6B6B6B">input</text>
  <text x="596" y="340" text-anchor="middle" font-size="10" fill="#6B6B6B">隱藏層</text>
  <text x="596" y="354" text-anchor="middle" font-size="9" fill="#6B6B6B">hidden</text>
  <text x="732" y="340" text-anchor="middle" font-size="10" fill="#6B6B6B">輸出層</text>
  <text x="732" y="354" text-anchor="middle" font-size="9" fill="#6B6B6B">output</text>

  <!-- bottom explanation strip -->
  <rect x="432" y="376" width="328" height="52" rx="6" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="596" y="396" text-anchor="middle" font-size="9.5" fill="#1A1A1A">同一個 neuron，排成一排、疊成好幾層</text>
  <text x="596" y="414" text-anchor="middle" font-size="9.5" fill="#1A1A1A">→ 這就是「深度」學習的「深」</text>
</svg>
