  <rect x="174" y="352" width="96" height="34" fill="#FFFFFF" stroke="#E8E5DF"/>
  <text x="222.0" y="374.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">4</text>
