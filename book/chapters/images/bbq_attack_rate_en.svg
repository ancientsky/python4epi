  <text x="410" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">The same move in the nursing home 🏥</text>
  <text x="410" y="530" text-anchor="middle" font-size="12" fill="#1A1A1A">Swap "salad" for "showering <tspan font-weight="bold" fill="#D97757">shower_use</tspan>" and "diarrhea" for "<tspan font-weight="bold" fill="#D94452">infection</tspan>", compare the two teams — out comes the RR.</text>
