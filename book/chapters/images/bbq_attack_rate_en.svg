  <text x="610" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#788C5D">RR = 50% ÷ 50% = 1.0 → innocent</text>
  <rect x="442" y="272" width="336" height="118" rx="10" fill="#FDECE7" stroke="#D94452" stroke-dasharray="4"/>
  <text x="610" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#D94452">⚠️ The #1 rookie mistake: forgetting the denominator</text>
  <text x="458" y="322" font-size="11" fill="#1A1A1A">"80% of the sick kids ate salad!"</text>
  <text x="458" y="340" font-size="11" fill="#6B6B6B">→ proves nothing — maybe 80% of the NOT-sick</text>
  <text x="458" y="356" font-size="11" fill="#6B6B6B">　 kids ate salad too!</text>
  <text x="458" y="378" font-size="11" font-weight="bold" fill="#788C5D">✔ Always compare the "ate" team vs the "skipped" team</text>
