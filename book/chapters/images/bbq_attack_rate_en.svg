  <rect width="820" height="560" fill="#FAF8F3" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Half the class got diarrhea after the BBQ trip — which dish did it?</text>
  <text x="410" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">The key move: every dish gets a face-off — "ate it" team vs "skipped it" team, whose rate is higher? 🥊</text>
