  <text x="318.0" y="374.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A1A1A">16</text>
  <text x="216" y="408" text-anchor="middle" font-size="10" fill="#6B6B6B">a=16, b=4, c=4, d=16 → RR = (16/20)÷(4/20) = 4.0</text>
