  <text x="216" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#D94452">RR = 80% ÷ 20% = 4.0 → highly suspicious!</text>
  <text x="42" y="276" font-size="11" font-weight="bold" fill="#6B6B6B">These two rows ARE a 2×2 table 👇</text>
  <text x="222.0" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#D94452">Diarrhea</text>
