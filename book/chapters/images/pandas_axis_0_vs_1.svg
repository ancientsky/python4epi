<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 8 8" refX="4" refY="7" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 4 7 L 8 0 z" fill="#6A9BCC"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">axis=0 vs axis=1 —— pandas 最容易搞混的兩個數字</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">記憶法：axis=0 的箭頭方向是 ↓（由上往下）；axis=1 的箭頭方向是 →（由左往右）</text>

  <!-- ========== LEFT: axis=0 ========== -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="365" height="380" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="30" y="72" width="365" height="40" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="212" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">axis=0  ↓  沿著「列」方向（by row）</text>

  <text x="212" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A">對「每個欄位」做運算（跨列加總）</text>
  <text x="212" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">= 「全班每科的平均」</text>

  <!-- Table: header + 3 data rows -->
  <g>
    <!-- Header -->
    <rect x="80" y="162" width="70" height="24" fill="#E8E5DF"/>
    <text x="115" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">math</text>
    <rect x="150" y="162" width="70" height="24" fill="#E8E5DF"/>
    <text x="185" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">english</text>
    <rect x="220" y="162" width="70" height="24" fill="#E8E5DF"/>
    <text x="255" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">science</text>

    <!-- Data row 1 -->
    <rect x="80" y="186" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <rect x="150" y="186" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">70</text>
    <rect x="220" y="186" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>

    <!-- Data row 2 -->
    <rect x="80" y="208" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="150" y="208" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">85</text>
    <rect x="220" y="208" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">75</text>

    <!-- Data row 3 -->
    <rect x="80" y="230" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <rect x="150" y="230" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="220" y="230" width="70" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>

    <!-- Arrow channel (between data and result, NOT overlapping data) -->
    <line x1="115" y1="258" x2="115" y2="285" stroke="#6A9BCC" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="185" y1="258" x2="185" y2="285" stroke="#6A9BCC" stroke-width="2" marker-end="url(#arrow-down)"/>
    <line x1="255" y1="258" x2="255" y2="285" stroke="#6A9BCC" stroke-width="2" marker-end="url(#arrow-down)"/>

    <!-- Side label pointing to arrows -->
    <text x="320" y="275" font-size="10" fill="#6A9BCC" font-weight="bold">axis=0 ↓</text>
    <text x="320" y="288" font-size="9" fill="#6B6B6B">沿每欄往下</text>

    <!-- Result row (mean) -->
    <rect x="80" y="292" width="70" height="24" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="115" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">76.7</text>
    <rect x="150" y="292" width="70" height="24" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="185" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">71.7</text>
    <rect x="220" y="292" width="70" height="24" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="255" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">81.7</text>
    <text x="320" y="308" font-size="10" fill="#6A9BCC" font-weight="bold">← 每科平均</text>
  </g>

  <!-- Code example -->
  <rect x="50" y="332" width="325" height="40" rx="4" fill="#2B2B2B"/>
  <text x="60" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">scores.mean(</text>
  <text x="153" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">axis=0</text>
  <text x="200" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">)</text>
  <text x="60" y="366" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># → Series：每科的平均</text>

  <text x="50" y="394" font-size="11" font-weight="bold" fill="#1A1A1A">🩺 疫調應用：</text>
  <text x="50" y="412" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B">df["age"].mean()</text>
  <text x="180" y="412" font-size="10" fill="#6B6B6B"># 全體住民平均年齡</text>
  <text x="50" y="430" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B">df.sum(axis=0)</text>
  <text x="180" y="430" font-size="10" fill="#6B6B6B"># 每個變項的總和</text>

  <!-- ========== RIGHT: axis=1 ========== -->
  <g filter="url(#shadow)">
    <rect x="405" y="72" width="365" height="380" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="405" y="72" width="365" height="40" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <text x="587" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">axis=1  →  沿著「欄」方向(by column)</text>

  <text x="587" y="132" text-anchor="middle" font-size="11" fill="#1A1A1A">對「每一列」做運算（跨欄加總）</text>
  <text x="587" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">= 「每個學生的總分」</text>

  <!-- Table: header + 3 data rows + arrow channel + sum column -->
  <g>
    <!-- Header (3 subjects) -->
    <rect x="435" y="162" width="55" height="24" fill="#E8E5DF"/>
    <text x="462" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">math</text>
    <rect x="490" y="162" width="55" height="24" fill="#E8E5DF"/>
    <text x="517" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">eng</text>
    <rect x="545" y="162" width="55" height="24" fill="#E8E5DF"/>
    <text x="572" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">sci</text>
    <!-- gap channel header -->
    <text x="640" y="178" text-anchor="middle" font-size="9" fill="#D97757" font-weight="bold">axis=1 →</text>
    <!-- sum col header -->
    <rect x="685" y="162" width="70" height="24" fill="#D97757" fill-opacity="0.3"/>
    <text x="720" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">sum</text>

    <!-- Data row 1 -->
    <rect x="435" y="186" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="462" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <rect x="490" y="186" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="517" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">70</text>
    <rect x="545" y="186" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="572" y="201" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <!-- Arrow in gap (x 605-680) -->
    <line x1="610" y1="197" x2="678" y2="197" stroke="#D97757" stroke-width="2" marker-end="url(#arrow-right)"/>
    <!-- Sum cell -->
    <rect x="685" y="186" width="70" height="22" fill="#D97757" fill-opacity="0.25"/>
    <text x="720" y="201" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">240</text>

    <!-- Data row 2 -->
    <rect x="435" y="208" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="462" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="490" y="208" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="517" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">85</text>
    <rect x="545" y="208" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="572" y="223" text-anchor="middle" font-size="10" fill="#1A1A1A">75</text>
    <line x1="610" y1="219" x2="678" y2="219" stroke="#D97757" stroke-width="2" marker-end="url(#arrow-right)"/>
    <rect x="685" y="208" width="70" height="22" fill="#D97757" fill-opacity="0.25"/>
    <text x="720" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">220</text>

    <!-- Data row 3 -->
    <rect x="435" y="230" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="462" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <rect x="490" y="230" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="517" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="545" y="230" width="55" height="22" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="572" y="245" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <line x1="610" y1="241" x2="678" y2="241" stroke="#D97757" stroke-width="2" marker-end="url(#arrow-right)"/>
    <rect x="685" y="230" width="70" height="22" fill="#D97757" fill-opacity="0.25"/>
    <text x="720" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">230</text>

    <!-- label under table -->
    <text x="720" y="272" text-anchor="middle" font-size="10" fill="#D97757" font-weight="bold">↑ 每人總分</text>
  </g>

  <!-- Code example -->
  <rect x="425" y="332" width="325" height="40" rx="4" fill="#2B2B2B"/>
  <text x="435" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">scores.sum(</text>
  <text x="525" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#D97757" font-weight="bold">axis=1</text>
  <text x="572" y="350" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">)</text>
  <text x="435" y="366" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># → Series：每人的總分</text>

  <text x="425" y="394" font-size="11" font-weight="bold" fill="#1A1A1A">🩺 疫調應用：</text>
  <text x="425" y="412" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B">df[["chf","dm"]].sum(axis=1)</text>
  <text x="425" y="430" font-size="10" fill="#6B6B6B"># 每位住民的共病數</text>

  <!-- Bottom tip -->
  <text x="400" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#D94452">⚠ 最容易出錯：想算每人總分卻用 axis=0（變成算每科平均）</text>
  <text x="400" y="492" text-anchor="middle" font-size="10" fill="#6B6B6B">口訣：「axis=N 表示結果形狀裡 axis=N 這個維度被壓扁」</text>
</svg>
