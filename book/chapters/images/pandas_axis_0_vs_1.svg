<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#6A9BCC"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">axis=0 vs axis=1 —— pandas 最容易搞混的兩個數字</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">記憶法：axis=0 的箭頭方向是 ↓（由上往下）；axis=1 的箭頭方向是 →（由左往右）</text>

  <!-- Left: axis=0 -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="365" height="380" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="30" y="72" width="365" height="40" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="212" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A9BCC">axis=0  ↓  沿著「列」方向（by row）</text>

  <text x="212" y="135" text-anchor="middle" font-size="11" fill="#1A1A1A">對「每個欄位」做運算（跨列加總）</text>
  <text x="212" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">= 「全班每科的平均」</text>

  <!-- Table with vertical arrows -->
  <g>
    <!-- Header -->
    <rect x="80" y="170" width="70" height="26" fill="#E8E5DF"/>
    <text x="115" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">math</text>
    <rect x="150" y="170" width="70" height="26" fill="#E8E5DF"/>
    <text x="185" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">english</text>
    <rect x="220" y="170" width="70" height="26" fill="#E8E5DF"/>
    <text x="255" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">science</text>

    <!-- Data rows -->
    <rect x="80" y="196" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <rect x="150" y="196" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">70</text>
    <rect x="220" y="196" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>

    <rect x="80" y="220" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="150" y="220" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">85</text>
    <rect x="220" y="220" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">75</text>

    <rect x="80" y="244" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="115" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <rect x="150" y="244" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="185" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="220" y="244" width="70" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="255" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>

    <!-- Arrows pointing down -->
    <line x1="115" y1="200" x2="115" y2="280" stroke="#6A9BCC" stroke-width="2.5" marker-end="url(#arrow-down)"/>
    <line x1="185" y1="200" x2="185" y2="280" stroke="#6A9BCC" stroke-width="2.5" marker-end="url(#arrow-down)"/>
    <line x1="255" y1="200" x2="255" y2="280" stroke="#6A9BCC" stroke-width="2.5" marker-end="url(#arrow-down)"/>

    <!-- Result row -->
    <rect x="80" y="292" width="70" height="26" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="115" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">76.7</text>
    <rect x="150" y="292" width="70" height="26" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="185" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">71.7</text>
    <rect x="220" y="292" width="70" height="26" fill="#6A9BCC" fill-opacity="0.3"/>
    <text x="255" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">81.7</text>
    <text x="330" y="310" font-size="10" fill="#6A9BCC" font-weight="bold">← 結果</text>
  </g>

  <!-- Code example -->
  <rect x="50" y="340" width="325" height="44" rx="4" fill="#2B2B2B"/>
  <text x="60" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">scores.mean(</text>
  <text x="153" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">axis=0</text>
  <text x="200" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">)</text>
  <text x="60" y="376" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># → Series：每科的平均</text>

  <text x="50" y="405" font-size="11" font-weight="bold" fill="#1A1A1A">🩺 疫調應用：</text>
  <text x="50" y="423" font-size="10" fill="#6B6B6B">df["age"].mean() &#160;&#160;&#160;&#160; # 全體住民平均年齡</text>
  <text x="50" y="439" font-size="10" fill="#6B6B6B">df.sum(axis=0) &#160;&#160;&#160;&#160;&#160;&#160;&#160; # 每個變項的總和</text>

  <!-- Right: axis=1 -->
  <g filter="url(#shadow)">
    <rect x="405" y="72" width="365" height="380" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  </g>
  <rect x="405" y="72" width="365" height="40" rx="10" fill="#D97757" fill-opacity="0.15"/>
  <text x="587" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#D97757">axis=1  →  沿著「欄」方向（by column）</text>

  <text x="587" y="135" text-anchor="middle" font-size="11" fill="#1A1A1A">對「每一列」做運算（跨欄加總）</text>
  <text x="587" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">= 「每個學生的總分」</text>

  <!-- Table with horizontal arrows -->
  <g>
    <!-- Header -->
    <rect x="445" y="170" width="60" height="26" fill="#E8E5DF"/>
    <text x="475" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">math</text>
    <rect x="505" y="170" width="60" height="26" fill="#E8E5DF"/>
    <text x="535" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">eng</text>
    <rect x="565" y="170" width="60" height="26" fill="#E8E5DF"/>
    <text x="595" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">sci</text>
    <rect x="630" y="170" width="80" height="26" fill="#D97757" fill-opacity="0.3"/>
    <text x="670" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#1A1A1A">sum</text>

    <!-- Data rows with arrows -->
    <rect x="445" y="196" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="475" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <rect x="505" y="196" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="535" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">70</text>
    <rect x="565" y="196" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="595" y="212" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <line x1="450" y1="208" x2="620" y2="208" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-right)"/>
    <rect x="630" y="196" width="80" height="24" fill="#D97757" fill-opacity="0.3"/>
    <text x="670" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">240</text>

    <rect x="445" y="220" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="475" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="505" y="220" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="535" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">85</text>
    <rect x="565" y="220" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="595" y="236" text-anchor="middle" font-size="10" fill="#1A1A1A">75</text>
    <line x1="450" y1="232" x2="620" y2="232" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-right)"/>
    <rect x="630" y="220" width="80" height="24" fill="#D97757" fill-opacity="0.3"/>
    <text x="670" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">220</text>

    <rect x="445" y="244" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="475" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">90</text>
    <rect x="505" y="244" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="535" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">60</text>
    <rect x="565" y="244" width="60" height="24" fill="#FFFFFF" stroke="#E8E5DF"/>
    <text x="595" y="260" text-anchor="middle" font-size="10" fill="#1A1A1A">80</text>
    <line x1="450" y1="256" x2="620" y2="256" stroke="#D97757" stroke-width="2.5" marker-end="url(#arrow-right)"/>
    <rect x="630" y="244" width="80" height="24" fill="#D97757" fill-opacity="0.3"/>
    <text x="670" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">230</text>

    <text x="670" y="288" text-anchor="middle" font-size="10" fill="#D97757" font-weight="bold">↑ 結果</text>
  </g>

  <!-- Code example -->
  <rect x="425" y="340" width="325" height="44" rx="4" fill="#2B2B2B"/>
  <text x="435" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">scores.sum(</text>
  <text x="525" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#D97757" font-weight="bold">axis=1</text>
  <text x="572" y="358" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">)</text>
  <text x="435" y="376" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># → Series：每人的總分</text>

  <text x="425" y="405" font-size="11" font-weight="bold" fill="#1A1A1A">🩺 疫調應用：</text>
  <text x="425" y="423" font-size="10" fill="#6B6B6B">df[["chf","dm","cancer"]].sum(axis=1)</text>
  <text x="425" y="439" font-size="10" fill="#6B6B6B"># → 每位住民的共病數</text>

  <!-- Bottom tip -->
  <text x="400" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#D94452">⚠ 最容易出錯：想算每人總分卻用 axis=0（變成算每科平均）</text>
  <text x="400" y="492" text-anchor="middle" font-size="10" fill="#6B6B6B">口訣：「axis=1 表示要得到**每一列**一個結果」</text>
</svg>
