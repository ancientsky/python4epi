<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
       <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker></defs>
  <rect width="800" height="460" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">時間序列切分：不能隨機打亂！</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">時間有方向——訓練資料不能來自未來</text>

  <!-- Row 1: bad (random shuffle) -->
  <g filter="url(#shadow)"><rect x="40" y="80" width="720" height="160" rx="10" fill="#FDECE7" stroke="#D94452" stroke-width="1.5"/></g>
  <text x="400" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#D94452">❌ 隨機打亂 K-fold（一般 ML 常用，但時序不行）</text>

  <g>
    <rect x="70" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="125" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="180" y="140" width="55" height="34" fill="#D94452"/>
    <rect x="235" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="290" y="140" width="55" height="34" fill="#D94452"/>
    <rect x="345" y="140" width="55" height="34" fill="#D94452"/>
    <rect x="400" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="455" y="140" width="55" height="34" fill="#D94452"/>
    <rect x="510" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="565" y="140" width="55" height="34" fill="#6A9BCC"/>
    <rect x="620" y="140" width="55" height="34" fill="#D94452"/>
    <rect x="675" y="140" width="55" height="34" fill="#6A9BCC"/>
  </g>

  <rect x="270" y="192" width="16" height="12" fill="#6A9BCC"/>
  <text x="292" y="202" font-size="9.5" fill="#1A1A1A">train</text>
  <rect x="335" y="192" width="16" height="12" fill="#D94452"/>
  <text x="357" y="202" font-size="9.5" fill="#1A1A1A">test</text>

  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#D94452">⚠ 「未來」的 test 片段混進了「過去」的訓練資料 → 模型偷看到答案</text>

  <!-- Row 2: good (rolling / expanding window) -->
  <g filter="url(#shadow)"><rect x="40" y="260" width="720" height="170" rx="10" fill="#EEF2E9" stroke="#788C5D" stroke-width="1.5"/></g>
  <text x="400" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#788C5D">✅ 滾動 / 擴張窗口（照時間順序切）</text>

  <rect x="70" y="310" width="402" height="34" fill="#6A9BCC"/>
  <text x="271" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">train</text>
  <rect x="472" y="310" width="134" height="34" fill="#D97757"/>
  <text x="539" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">val</text>
  <rect x="606" y="310" width="134" height="34" fill="#788C5D"/>
  <text x="673" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">test</text>

  <line x1="70" y1="362" x2="748" y2="362" stroke="#1A1A1A" stroke-width="1.2" marker-end="url(#ar-gray)"/>
  <text x="405" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">時間軸 →（越右越晚）</text>

  <text x="405" y="410" text-anchor="middle" font-size="10.5" fill="#1A1A1A">train → val → test 沿著時間排好，箭頭永遠指向未來</text>
</svg>
