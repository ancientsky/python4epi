<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6A9BCC"/>
    </marker>
  </defs>

  <rect width="800" height="680" fill="#FAF8F3" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Four Study Designs — the Right Method Gives the Right Metric</text>

  <!-- ===== Card 1: Cohort Study ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="48" width="370" height="265" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.5"/>
  </g>
  <rect x="20" y="48" width="370" height="30" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="30" y="69" font-size="14" font-weight="bold" fill="#D97757">❶ Cohort Study</text>
  <text x="345" y="69" font-size="11" fill="#D97757" font-weight="bold">→ RR</text>

  <!-- Diagram -->
  <rect x="40" y="90" width="70" height="28" rx="6" fill="#D97757" fill-opacity="0.15"/>
  <text x="75" y="109" text-anchor="middle" font-size="11" fill="#D97757">Exposed</text>
  <rect x="40" y="128" width="70" height="28" rx="6" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="75" y="147" text-anchor="middle" font-size="11" fill="#6A9BCC">Unexposed</text>

  <line x1="110" y1="104" x2="200" y2="104" stroke="#D97757" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <line x1="110" y1="142" x2="200" y2="142" stroke="#6A9BCC" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="155" y="96" text-anchor="middle" font-size="9" fill="#6B6B6B">Follow-up</text>
  <text x="155" y="134" text-anchor="middle" font-size="9" fill="#6B6B6B">Follow-up</text>

  <circle cx="220" cy="95" r="6" fill="#D94452"/>
  <circle cx="240" cy="95" r="6" fill="#D94452"/>
  <circle cx="260" cy="95" r="6" fill="#788C5D"/>
  <circle cx="280" cy="95" r="6" fill="#788C5D"/>
  <circle cx="300" cy="95" r="6" fill="#788C5D"/>
  <text x="260" y="84" text-anchor="middle" font-size="8" fill="#6B6B6B">Outcome</text>

  <circle cx="220" cy="148" r="6" fill="#D94452"/>
  <circle cx="240" cy="148" r="6" fill="#788C5D"/>
  <circle cx="260" cy="148" r="6" fill="#788C5D"/>
  <circle cx="280" cy="148" r="6" fill="#788C5D"/>
  <circle cx="300" cy="148" r="6" fill="#788C5D"/>

  <text x="40" y="182" font-size="11" fill="#1A1A1A" font-weight="bold">In plain terms:</text>
  <text x="40" y="198" font-size="11" fill="#6B6B6B">First see if you got rained on (exposure),</text>
  <text x="40" y="214" font-size="11" fill="#6B6B6B">then follow up to see if you catch a cold (outcome).</text>
  <text x="40" y="234" font-size="11" fill="#D97757">🎯 Analogy: like filming a documentary—cast first,</text>
  <text x="40" y="250" font-size="11" fill="#D97757">follow them to the end. Full denominator → RR.</text>
  <text x="40" y="270" font-size="11" fill="#6B6B6B">📌 This study = a retrospective cohort (all 280)</text>
  <text x="40" y="300" font-size="10" fill="#788C5D" font-weight="bold">✅ Pros: direct risk calc, clear causal timing</text>

  <!-- ===== Card 2: Case-Control Study ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="48" width="370" height="265" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.5"/>
  </g>
  <rect x="410" y="48" width="370" height="30" rx="10" fill="#6A9BCC" fill-opacity="0.12"/>
  <text x="420" y="69" font-size="14" font-weight="bold" fill="#6A9BCC">❷ Case-Control Study</text>
  <text x="735" y="69" font-size="11" fill="#6A9BCC" font-weight="bold">→ OR</text>

  <!-- Diagram: reverse arrow -->
  <rect x="620" y="90" width="70" height="28" rx="6" fill="#D94452" fill-opacity="0.15"/>
  <text x="655" y="109" text-anchor="middle" font-size="11" fill="#D94452">Case</text>
  <rect x="620" y="128" width="70" height="28" rx="6" fill="#788C5D" fill-opacity="0.15"/>
  <text x="655" y="147" text-anchor="middle" font-size="11" fill="#788C5D">Control</text>

  <line x1="620" y1="104" x2="520" y2="104" stroke="#D94452" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="142" x2="520" y2="142" stroke="#788C5D" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="570" y="96" text-anchor="middle" font-size="9" fill="#6B6B6B">Trace exposure</text>
  <text x="570" y="134" text-anchor="middle" font-size="9" fill="#6B6B6B">Trace exposure</text>

  <rect x="435" y="88" width="70" height="16" rx="4" fill="#D97757" fill-opacity="0.3"/>
  <text x="470" y="100" text-anchor="middle" font-size="8" fill="#D97757">Exposed?</text>
  <rect x="435" y="108" width="70" height="16" rx="4" fill="#E8E5DF"/>
  <text x="470" y="120" text-anchor="middle" font-size="8" fill="#6B6B6B">Unexposed?</text>
  <rect x="435" y="132" width="70" height="16" rx="4" fill="#D97757" fill-opacity="0.3"/>
  <text x="470" y="144" text-anchor="middle" font-size="8" fill="#D97757">Exposed?</text>
  <rect x="435" y="152" width="70" height="16" rx="4" fill="#E8E5DF"/>
  <text x="470" y="164" text-anchor="middle" font-size="8" fill="#6B6B6B">Unexposed?</text>

  <text x="430" y="192" font-size="11" fill="#1A1A1A" font-weight="bold">In plain terms:</text>
  <text x="430" y="208" font-size="11" fill="#6B6B6B">First find sick cases, then healthy controls,</text>
  <text x="430" y="224" font-size="11" fill="#6B6B6B">then ask if they'd been rained on before.</text>
  <text x="430" y="244" font-size="11" fill="#6A9BCC">🕵️ Analogy: detective work—victim first,</text>
  <text x="430" y="260" font-size="11" fill="#6A9BCC">then trace suspects; chosen denominator → OR only.</text>
  <text x="430" y="280" font-size="10" fill="#6B6B6B">📌 Good for: rare disease, national surveys, VE studies</text>
  <text x="430" y="300" font-size="10" fill="#788C5D" font-weight="bold">✅ Pros: fast, cheap, good for rare disease</text>

  <!-- ===== Card 3: Nested Case-Control ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="328" width="370" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="20" y="328" width="370" height="30" rx="10" fill="#788C5D" fill-opacity="0.12"/>
  <text x="30" y="349" font-size="13" font-weight="bold" fill="#788C5D">❸ Nested Case-Control</text>

  <text x="40" y="376" font-size="11" fill="#1A1A1A" font-weight="bold">In plain terms:</text>
  <text x="40" y="392" font-size="11" fill="#6B6B6B">A cohort study is already tracking everyone,</text>
  <text x="40" y="408" font-size="11" fill="#6B6B6B">but tests are costly, so we sample the sick cases,</text>
  <text x="40" y="424" font-size="11" fill="#6B6B6B">then match healthy people from the cohort to test.</text>
  <text x="40" y="446" font-size="11" fill="#788C5D">🏠 Analogy: security cameras cover it all,</text>
  <text x="40" y="462" font-size="11" fill="#788C5D">but you only review the key clips—efficient.</text>
  <text x="40" y="480" font-size="10" fill="#6B6B6B">📌 Common in: biomarker studies in large cohorts</text>

  <!-- ===== Card 4: Matched Case-Control ===== -->
  <g filter="url(#shadow)">
    <rect x="410" y="328" width="370" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <rect x="410" y="328" width="370" height="30" rx="10" fill="#D97757" fill-opacity="0.12"/>
  <text x="420" y="349" font-size="13" font-weight="bold" fill="#D97757">❹ Matched Case-Control</text>

  <text x="430" y="376" font-size="11" fill="#1A1A1A" font-weight="bold">In plain terms:</text>
  <text x="430" y="392" font-size="11" fill="#6B6B6B">Find a case (70-year-old man), then find someone</text>
  <text x="430" y="408" font-size="11" fill="#6B6B6B">of similar age and sex who's healthy, pair them up.</text>
  <text x="430" y="424" font-size="11" fill="#6B6B6B">That way age and sex "cancel out" and can't confound.</text>
  <text x="430" y="446" font-size="11" fill="#D97757">👯 Analogy: like a twin study—find a "matched double,"</text>
  <text x="430" y="462" font-size="11" fill="#D97757">the only difference between them is exposure.</text>
  <text x="430" y="480" font-size="10" fill="#6B6B6B">📌 Analyze with conditional logistic regression</text>

  <!-- ===== Bottom summary: when to use which ===== -->
  <g filter="url(#shadow)">
    <rect x="20" y="505" width="760" height="160" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="40" y="530" font-size="14" font-weight="bold" fill="#1A1A1A">🗺️ Selection Guide: When to Use Which?</text>

  <!-- Row 1 -->
  <rect x="40" y="542" width="180" height="24" rx="5" fill="#D97757" fill-opacity="0.1"/>
  <text x="130" y="559" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">Outbreak (full census)</text>
  <text x="235" y="559" font-size="11" fill="#1A1A1A">→ Cohort study → <tspan font-weight="bold" fill="#D97757">RR</tspan></text>

  <!-- Row 2 -->
  <rect x="40" y="572" width="180" height="24" rx="5" fill="#6A9BCC" fill-opacity="0.1"/>
  <text x="130" y="589" text-anchor="middle" font-size="11" fill="#6A9BCC" font-weight="bold">Rare disease / large cohort</text>
  <text x="235" y="589" font-size="11" fill="#1A1A1A">→ Case-control → <tspan font-weight="bold" fill="#6A9BCC">OR</tspan></text>

  <!-- Row 3 -->
  <rect x="40" y="602" width="180" height="24" rx="5" fill="#788C5D" fill-opacity="0.1"/>
  <text x="130" y="619" text-anchor="middle" font-size="11" fill="#788C5D" font-weight="bold">Vaccine efficacy (VE)</text>
  <text x="235" y="619" font-size="11" fill="#1A1A1A">→ Cohort: 1−RR; case-control: 1−OR (equal when rare)</text>

  <!-- Row 4 -->
  <rect x="40" y="632" width="180" height="24" rx="5" fill="#6B6B6B" fill-opacity="0.1"/>
  <text x="130" y="649" text-anchor="middle" font-size="11" fill="#6B6B6B" font-weight="bold">Logistic regression</text>
  <text x="235" y="649" font-size="11" fill="#1A1A1A">→ Native output = <tspan font-weight="bold">OR</tspan> (regardless of design)</text>

</svg>
