<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
       <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker>
       <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D94452"/></marker></defs>
  <rect width="800" height="480" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">訓練迴圈：forward → loss → backprop → update</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">每次繞一圈 = 一個 epoch；右邊看什麼時候該喊卡</text>

  <!-- connecting arrows (drawn first) -->
  <line x1="335" y1="120" x2="400" y2="205" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="400" y1="295" x2="335" y2="380" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="185" y1="380" x2="120" y2="295" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="120" y1="205" x2="185" y2="120" stroke="#6B6B6B" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="132" y="158" text-anchor="middle" font-size="8.5" fill="#6B6B6B" font-style="italic">next epoch</text>

  <!-- center loop core -->
  <circle cx="260" cy="250" r="40" fill="#F5F3EE" stroke="#E8E5DF" stroke-width="1.3"/>
  <text x="260" y="245" text-anchor="middle" font-size="15">🔁</text>
  <text x="260" y="266" text-anchor="middle" font-size="9.5" fill="#6B6B6B">epoch</text>

  <!-- Top card: forward -->
  <g filter="url(#shadow)"><rect x="185" y="75" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.6"/></g>
  <text x="260" y="101" text-anchor="middle" font-size="20">➡️</text>
  <text x="260" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">① 前向 forward</text>
  <text x="260" y="143" text-anchor="middle" font-size="10" fill="#6B6B6B">算出目前的猜測</text>

  <!-- Right card: loss -->
  <g filter="url(#shadow)"><rect x="325" y="205" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.6"/></g>
  <text x="400" y="231" text-anchor="middle" font-size="20">📏</text>
  <text x="400" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">② 算錯 loss</text>
  <text x="400" y="273" text-anchor="middle" font-size="10" fill="#6B6B6B">跟正確答案差多少</text>

  <!-- Bottom card: backprop -->
  <g filter="url(#shadow)"><rect x="185" y="335" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="1.6"/></g>
  <text x="260" y="361" text-anchor="middle" font-size="20">🔄</text>
  <text x="260" y="383" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">③ 反向傳播</text>
  <text x="260" y="403" text-anchor="middle" font-size="10" fill="#6B6B6B">追查誰該負責（backprop）</text>

  <!-- Left card: update -->
  <g filter="url(#shadow)"><rect x="45" y="205" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="1.6"/></g>
  <text x="120" y="231" text-anchor="middle" font-size="20">⚙️</text>
  <text x="120" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">④ 更新 update</text>
  <text x="120" y="273" text-anchor="middle" font-size="10" fill="#6B6B6B">weights 微調一下</text>

  <!-- Right side panel: early stopping -->
  <g filter="url(#shadow)"><rect x="500" y="75" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="640" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">旁邊看：什麼時候該喊卡？</text>

  <!-- axes -->
  <line x1="530" y1="130" x2="530" y2="280" stroke="#1A1A1A" stroke-width="1"/>
  <line x1="530" y1="280" x2="750" y2="280" stroke="#1A1A1A" stroke-width="1"/>
  <text x="516" y="205" text-anchor="middle" font-size="10" fill="#6B6B6B" transform="rotate(-90, 516, 205)">loss</text>
  <text x="640" y="300" text-anchor="middle" font-size="10" fill="#6B6B6B">epoch →</text>

  <!-- train loss curve -->
  <path d="M 530 140 C 580 160 650 220 750 260" fill="none" stroke="#6A9BCC" stroke-width="2"/>
  <!-- val loss curve (dips then rises = overfitting) -->
  <path d="M 530 150 C 580 175 620 188 650 190 C 690 195 720 160 750 140" fill="none" stroke="#D94452" stroke-width="2"/>

  <!-- early stopping marker -->
  <line x1="650" y1="130" x2="650" y2="280" stroke="#D94452" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="650" y="124" text-anchor="middle" font-size="13">⭐</text>
  <text x="695" y="150" text-anchor="start" font-size="9.5" font-weight="bold" fill="#D94452">早停點</text>
  <text x="695" y="165" text-anchor="start" font-size="8.5" fill="#6B6B6B">見好就收</text>

  <!-- legend -->
  <line x1="520" y1="325" x2="540" y2="325" stroke="#6A9BCC" stroke-width="2.5"/>
  <text x="548" y="329" font-size="10" fill="#1A1A1A">train loss</text>
  <line x1="520" y1="347" x2="540" y2="347" stroke="#D94452" stroke-width="2.5"/>
  <text x="548" y="351" font-size="9.5" fill="#D94452">val loss（回升＝過擬合警訊）</text>

  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#1A1A1A">一圈 = 一個 epoch；val loss 不再進步就喊卡（early stopping）</text>
</svg>
