<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter></defs>
  <rect width="760" height="430" fill="#FAF8F3" rx="12"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Who Are Your Neighbors? — Spatial Weights</text>
  <text x="380" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">Before measuring 'similar to neighbors', you must first define WHO is a neighbor</text>
  <g filter="url(#shadow)"><rect x="24" y="68" width="470" height="330" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="40" y="92" font-size="12.5" font-weight="bold" fill="#788C5D">Queen contiguity: borders touch (even a corner) = neighbor</text>
  <line x1="250" y1="240" x2="150" y2="155" stroke="#788C5D" stroke-width="2.4"/>
  <line x1="250" y1="240" x2="370" y2="170" stroke="#788C5D" stroke-width="2.4"/>
  <line x1="250" y1="240" x2="360" y2="325" stroke="#788C5D" stroke-width="2.4"/>
  <line x1="250" y1="240" x2="150" y2="330" stroke="#788C5D" stroke-width="2.4"/>
  <ellipse cx="150" cy="155" rx="46" ry="33" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.6"/>
  <text x="150" y="159" text-anchor="middle" font-size="11" fill="#6A9BCC">nbr</text>
  <ellipse cx="370" cy="170" rx="46" ry="33" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.6"/>
  <text x="370" y="174" text-anchor="middle" font-size="11" fill="#6A9BCC">nbr</text>
  <ellipse cx="360" cy="325" rx="46" ry="33" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.6"/>
  <text x="360" y="329" text-anchor="middle" font-size="11" fill="#6A9BCC">nbr</text>
  <ellipse cx="150" cy="330" rx="46" ry="33" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.6"/>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="#6A9BCC">nbr</text>
  <ellipse cx="250" cy="240" rx="54" ry="38" fill="#D97757" fill-opacity="0.2" stroke="#D97757" stroke-width="2"/>
  <text x="250" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#D97757">Focus</text>
  <text x="310" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#788C5D">— green line = neighbor</text>
  <g filter="url(#shadow)"><rect x="510" y="68" width="226" height="330" rx="10" fill="#EAF2F8" stroke="#E8E5DF"/></g>
  <text x="623" y="92" text-anchor="middle" font-size="12" fill="#6A9BCC">Sea</text>
  <ellipse cx="623" cy="175" rx="44" ry="32" fill="#6A9BCC" fill-opacity="0.25" stroke="#6A9BCC" stroke-width="1.8"/>
  <text x="623" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">Island</text>
  <rect x="561" y="214" width="124" height="24" rx="12" fill="#FFFFFF" stroke="#D94452" stroke-dasharray="4"/>
  <text x="623" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#D94452">Queen: 0 nbrs</text>
  <line x1="580" y1="180" x2="497" y2="205" stroke="#D97757" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="623" y="300" text-anchor="middle" font-size="10.5" fill="#D97757">KNN: reach across water for nearest k</text>
  <rect x="40" y="352" width="360" height="38" rx="8" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="52" y="369" font-size="11" font-weight="bold" fill="#1A1A1A">Weight matrix W = a roll-call of who-neighbors-whom</text>
  <text x="52" y="384" font-size="10.5" fill="#6B6B6B">row-standardized: 4 neighbors each get 1/4 (fair vote)</text>
</svg>
