<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6B6B"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Conditional Logic: if / elif / else — A Fork in the Road</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">Decision flow based on CFR</text>

  <g filter="url(#shadow)">
    <rect x="30" y="72" width="740" height="390" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- Input CFR -->
  <rect x="340" y="95" width="120" height="40" rx="20" fill="#6A9BCC" fill-opacity="0.18" stroke="#6A9BCC" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">CFR = 0.157</text>

  <line x1="400" y1="135" x2="400" y2="160" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 1: cfr > 0.15 -->
  <polygon points="400,165 520,215 400,265 280,215" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-size="13" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">cfr &gt; 0.15</text>
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#6B6B6B">if</text>

  <!-- Branch: True → action 1 -->
  <line x1="520" y1="215" x2="620" y2="215" stroke="#788C5D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="205" text-anchor="middle" font-size="11" fill="#788C5D" font-weight="bold">True</text>

  <rect x="620" y="190" width="140" height="50" rx="6" fill="#D94452" fill-opacity="0.15" stroke="#D94452" stroke-width="2"/>
  <text x="690" y="212" text-anchor="middle" font-size="9" font-weight="bold" fill="#D94452">Escalate Response Level</text>
  <text x="690" y="230" text-anchor="middle" font-size="10" fill="#6B6B6B">Escalate response</text>

  <!-- Branch: False → down to elif -->
  <line x1="400" y1="265" x2="400" y2="290" stroke="#6B6B6B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="280" font-size="11" fill="#6B6B6B">False</text>

  <!-- Decision 2: cfr > 0.10 -->
  <polygon points="400,295 520,345 400,395 280,345" fill="#FFFFFF" stroke="#D97757" stroke-width="2"/>
  <text x="400" y="340" text-anchor="middle" font-size="13" font-family="Menlo, Monaco, monospace" fill="#1A1A1A">cfr &gt; 0.10</text>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#6B6B6B">elif</text>

  <!-- Branch: True → action 2 -->
  <line x1="520" y1="345" x2="620" y2="345" stroke="#788C5D" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="335" text-anchor="middle" font-size="11" fill="#788C5D" font-weight="bold">True</text>

  <rect x="620" y="320" width="140" height="50" rx="6" fill="#D97757" fill-opacity="0.15" stroke="#D97757" stroke-width="2"/>
  <text x="690" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97757">Enhanced Surveillance</text>
  <text x="690" y="360" text-anchor="middle" font-size="10" fill="#6B6B6B">Enhanced surveillance</text>

  <!-- Branch: False → else action -->
  <line x1="280" y1="345" x2="180" y2="345" stroke="#6B6B6B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="335" text-anchor="middle" font-size="11" fill="#6B6B6B">False</text>

  <rect x="40" y="320" width="140" height="50" rx="6" fill="#788C5D" fill-opacity="0.15" stroke="#788C5D" stroke-width="2"/>
  <text x="110" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">Routine Response</text>
  <text x="110" y="360" text-anchor="middle" font-size="10" fill="#6B6B6B">else — Routine</text>

  <!-- Output highlight -->
  <rect x="180" y="420" width="440" height="30" rx="6" fill="#FAF8F3" stroke="#D97757" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="400" y="440" text-anchor="middle" font-size="10" fill="#D97757" font-weight="bold">CFR = 15.7% → follow the red arrow → "Escalate Response Level"</text>
</svg>
