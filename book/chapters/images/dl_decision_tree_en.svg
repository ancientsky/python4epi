<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="system-ui, -apple-system, sans-serif">
  <defs><filter id="shadow" x="-2%" y="-2%" width="104%" height="104%"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
       <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B6B"/></marker></defs>
  <rect width="800" height="660" fill="#FAF8F3" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A1A1A">Do You Actually Need Deep Learning?</text>
  <text x="400" y="51" text-anchor="middle" font-size="12" fill="#6B6B6B">Four questions, checked top to bottom — stop at the first match</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)"><rect x="40" y="90" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="118" font-size="11.5" font-weight="bold" fill="#1A1A1A">① Fewer than 1000 rows?</text>
  <text x="60" y="140" font-size="9.5" fill="#6B6B6B">Small sample size</text>
  <text x="60" y="160" font-size="9.5" fill="#6B6B6B">Our 280-row Legionella dataset qualifies</text>

  <line x1="380" y1="135" x2="452" y2="135" stroke="#788C5D" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="127" text-anchor="middle" font-size="10" font-weight="bold" fill="#788C5D">✓ Yes</text>

  <g filter="url(#shadow)"><rect x="456" y="90" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#788C5D" stroke-width="1.8"/></g>
  <text x="608" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#788C5D">Use classic stats / simple ML</text>
  <text x="608" y="142" text-anchor="middle" font-size="9.5" fill="#6B6B6B">Logistic regression, random forest suffice</text>
  <text x="608" y="160" text-anchor="middle" font-size="9.5" fill="#6B6B6B">More stable and interpretable at small n</text>

  <line x1="210" y1="180" x2="210" y2="208" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="198" text-anchor="start" font-size="9.5" fill="#D94452">✗ No, keep going</text>

  <!-- Row 2 -->
  <g filter="url(#shadow)"><rect x="40" y="210" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="238" font-size="11.5" font-weight="bold" fill="#1A1A1A">② Need explicit causality / mechanism?</text>
  <text x="60" y="260" font-size="9.5" fill="#6B6B6B">Want to know "why", not just "will it"</text>
  <text x="60" y="280" font-size="9.5" fill="#6B6B6B">e.g. explaining transmission mechanics</text>

  <line x1="380" y1="255" x2="452" y2="255" stroke="#6A9BCC" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="247" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A9BCC">✓ Yes</text>

  <g filter="url(#shadow)"><rect x="456" y="210" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.8"/></g>
  <text x="608" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">SEIR + simple ML</text>
  <text x="608" y="262" text-anchor="middle" font-size="9.5" fill="#6B6B6B">Mechanistic model + a few features, interpretable</text>
  <text x="608" y="280" text-anchor="middle" font-size="9.5" fill="#6B6B6B">See the Ch07 time series chapter</text>

  <line x1="210" y1="300" x2="210" y2="328" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="318" text-anchor="start" font-size="9.5" fill="#D94452">✗ No, keep going</text>

  <!-- Row 3 -->
  <g filter="url(#shadow)"><rect x="40" y="330" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="356" font-size="11" font-weight="bold" fill="#1A1A1A">③ High-dim nonlinear, spatial, long</text>
  <text x="60" y="374" font-size="11" font-weight="bold" fill="#1A1A1A">　sequences, AND lots of data?</text>
  <text x="60" y="396" font-size="9.5" fill="#6B6B6B">Images, long time series, large-scale data</text>

  <line x1="380" y1="375" x2="452" y2="375" stroke="#D97757" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="367" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97757">✓ Yes</text>

  <g filter="url(#shadow)"><rect x="456" y="330" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#D97757" stroke-width="2.4"/></g>
  <text x="608" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">Use DL</text>
  <text x="608" y="382" text-anchor="middle" font-size="9.5" fill="#6B6B6B">CNN / LSTM / Transformer, etc.</text>
  <text x="608" y="400" text-anchor="middle" font-size="9.5" fill="#6B6B6B">Only pays off with enough data</text>

  <line x1="210" y1="420" x2="210" y2="448" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="438" text-anchor="start" font-size="9.5" fill="#D94452">✗ No, keep going</text>

  <!-- Row 4 -->
  <g filter="url(#shadow)"><rect x="40" y="450" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E8E5DF"/></g>
  <text x="60" y="478" font-size="11.5" font-weight="bold" fill="#1A1A1A">④ New pathogen, barely any early data?</text>
  <text x="60" y="500" font-size="9.5" fill="#6B6B6B">Outbreak just started, few cases so far</text>
  <text x="60" y="520" font-size="9.5" fill="#6B6B6B">But lots of data exists from other outbreaks</text>

  <line x1="380" y1="495" x2="452" y2="495" stroke="#6A9BCC" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="416" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#6A9BCC">✓ Yes</text>

  <g filter="url(#shadow)"><rect x="456" y="450" width="304" height="90" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="1.8"/></g>
  <text x="608" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">TSFM zero-shot / few-shot</text>
  <text x="608" y="502" text-anchor="middle" font-size="9.5" fill="#6B6B6B">Borrow a pretrained time series foundation model</text>
  <text x="608" y="520" text-anchor="middle" font-size="9.5" fill="#6B6B6B">No need to wait for data to accumulate</text>

  <line x1="210" y1="540" x2="210" y2="568" stroke="#D94452" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="222" y="554" text-anchor="start" font-size="9.5" fill="#D94452">✗ None of the above</text>

  <!-- Final fallback -->
  <rect x="40" y="570" width="720" height="66" rx="8" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="400" y="597" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1A1A1A">None of the above?</text>
  <text x="400" y="618" text-anchor="middle" font-size="10.5" fill="#6B6B6B">Ordinary data size, no special spatial/causal need → the Ch10 sklearn baseline is your best bet</text>
</svg>
