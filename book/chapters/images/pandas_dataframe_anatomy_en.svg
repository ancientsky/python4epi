<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Anatomy of a DataFrame — pandas' Version of an Excel Table</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">DataFrame = a whole table; Series = a single column; access both with [ ] .loc .iloc</text>

  <!-- Main DataFrame visualization -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="450" height="280" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <text x="50" y="96" font-size="13" font-weight="bold" fill="#1A1A1A">df — DataFrame (a Table)</text>

  <!-- Table header (columns) -->
  <rect x="50" y="110" width="60" height="28" fill="#E8E5DF"/>
  <text x="80" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">case_id</text>
  <rect x="110" y="110" width="60" height="28" fill="#D97757" fill-opacity="0.25" stroke="#D97757" stroke-width="2"/>
  <text x="140" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">age</text>
  <rect x="170" y="110" width="60" height="28" fill="#E8E5DF"/>
  <text x="200" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">sex</text>
  <rect x="230" y="110" width="80" height="28" fill="#E8E5DF"/>
  <text x="270" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">floor</text>
  <rect x="310" y="110" width="80" height="28" fill="#E8E5DF"/>
  <text x="350" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">infected</text>
  <rect x="390" y="110" width="80" height="28" fill="#E8E5DF"/>
  <text x="430" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#1A1A1A">outcome</text>

  <!-- Row index column -->
  <rect x="30" y="138" width="20" height="28" fill="#F5F3EE"/>
  <text x="40" y="156" text-anchor="middle" font-size="10" fill="#6B6B6B">0</text>
  <rect x="30" y="166" width="20" height="28" fill="#F5F3EE"/>
  <text x="40" y="184" text-anchor="middle" font-size="10" fill="#6B6B6B">1</text>
  <rect x="30" y="194" width="20" height="28" fill="#F5F3EE"/>
  <text x="40" y="212" text-anchor="middle" font-size="10" fill="#6B6B6B">2</text>
  <rect x="30" y="222" width="20" height="28" fill="#F5F3EE"/>
  <text x="40" y="240" text-anchor="middle" font-size="10" fill="#6B6B6B">3</text>
  <rect x="30" y="250" width="20" height="28" fill="#F5F3EE"/>
  <text x="40" y="268" text-anchor="middle" font-size="10" fill="#6B6B6B">...</text>

  <!-- Row 0 highlighted -->
  <rect x="50" y="138" width="420" height="28" fill="#6A9BCC" fill-opacity="0.15" stroke="#6A9BCC" stroke-width="2"/>
  <text x="80" y="156" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">72</text>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#1A1A1A">F</text>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="350" y="156" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="430" y="156" text-anchor="middle" font-size="11" fill="#1A1A1A">survived</text>

  <!-- Other rows -->
  <text x="80" y="184" text-anchor="middle" font-size="11" fill="#1A1A1A">2</text>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">85</text>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#1A1A1A">M</text>
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#1A1A1A">2</text>
  <text x="350" y="184" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="430" y="184" text-anchor="middle" font-size="11" fill="#1A1A1A">dead</text>

  <text x="80" y="212" text-anchor="middle" font-size="11" fill="#1A1A1A">3</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">68</text>
  <text x="200" y="212" text-anchor="middle" font-size="11" fill="#1A1A1A">F</text>
  <text x="270" y="212" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="350" y="212" text-anchor="middle" font-size="11" fill="#1A1A1A">0</text>
  <text x="430" y="212" text-anchor="middle" font-size="11" fill="#1A1A1A">—</text>

  <text x="80" y="240" text-anchor="middle" font-size="11" fill="#1A1A1A">4</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">91</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#1A1A1A">F</text>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#1A1A1A">3</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#1A1A1A">1</text>
  <text x="430" y="240" text-anchor="middle" font-size="11" fill="#1A1A1A">dead</text>

  <text x="80" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>
  <text x="140" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>
  <text x="200" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#1A1A1A">...</text>

  <!-- Dimension labels -->
  <text x="250" y="296" text-anchor="middle" font-size="11" fill="#6A9BCC" font-weight="bold">↑ one row = one resident = df.iloc[0]</text>
  <text x="250" y="313" text-anchor="middle" font-size="11" fill="#D97757" font-weight="bold">↑ one column = one variable = Series</text>
  <text x="250" y="335" text-anchor="middle" font-size="11" fill="#1A1A1A">df.shape = (280, 32) &#10230; 280 rows × 32 columns</text>

  <!-- Right side: access patterns -->
  <g filter="url(#shadow)">
    <rect x="495" y="72" width="280" height="280" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="635" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">4 Ways to Access Data</text>

  <!-- Access 1: column -->
  <rect x="510" y="110" width="250" height="52" rx="6" fill="#D97757" fill-opacity="0.08"/>
  <text x="520" y="128" font-size="10" font-weight="bold" fill="#D97757">① Get a whole column → Series</text>
  <rect x="520" y="134" width="230" height="22" rx="3" fill="#2B2B2B"/>
  <text x="530" y="150" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">df["age"]</text>
  <text x="605" y="150" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># 280 ages</text>

  <!-- Access 2: row by position -->
  <rect x="510" y="170" width="250" height="52" rx="6" fill="#6A9BCC" fill-opacity="0.08"/>
  <text x="520" y="188" font-size="10" font-weight="bold" fill="#6A9BCC">② Get a row by position → Series</text>
  <rect x="520" y="194" width="230" height="22" rx="3" fill="#2B2B2B"/>
  <text x="530" y="210" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">df.iloc[0]</text>
  <text x="610" y="210" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># 1st resident</text>

  <!-- Access 3: single cell -->
  <rect x="510" y="230" width="250" height="52" rx="6" fill="#788C5D" fill-opacity="0.08"/>
  <text x="520" y="248" font-size="10" font-weight="bold" fill="#788C5D">③ Get a single cell → a value</text>
  <rect x="520" y="254" width="230" height="22" rx="3" fill="#2B2B2B"/>
  <text x="530" y="270" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">df.loc[0, "age"]</text>
  <text x="640" y="270" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6B6B6B"># 72</text>

  <!-- Access 4: filter -->
  <rect x="510" y="290" width="250" height="54" rx="6" fill="#D94452" fill-opacity="0.08"/>
  <text x="520" y="308" font-size="10" font-weight="bold" fill="#D94452">④ Filter by condition → DataFrame</text>
  <rect x="520" y="314" width="230" height="22" rx="3" fill="#2B2B2B"/>
  <text x="530" y="330" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">df[df["age"] &gt;= 80]</text>

  <!-- Bottom: Series vs DataFrame comparison -->
  <g filter="url(#shadow)">
    <rect x="30" y="370" width="740" height="170" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="400" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">DataFrame vs Series — the Difference Is "How Many Columns"</text>

  <!-- DataFrame box -->
  <rect x="60" y="410" width="210" height="110" rx="6" fill="#F5F3EE" stroke="#6A9BCC" stroke-width="1.5"/>
  <text x="165" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#6A9BCC">DataFrame (many columns)</text>
  <rect x="80" y="440" width="30" height="60" fill="#FFFFFF" stroke="#6A9BCC"/>
  <rect x="110" y="440" width="30" height="60" fill="#FFFFFF" stroke="#6A9BCC"/>
  <rect x="140" y="440" width="30" height="60" fill="#FFFFFF" stroke="#6A9BCC"/>
  <rect x="170" y="440" width="30" height="60" fill="#FFFFFF" stroke="#6A9BCC"/>
  <rect x="200" y="440" width="30" height="60" fill="#FFFFFF" stroke="#6A9BCC"/>
  <text x="165" y="514" text-anchor="middle" font-size="10" fill="#6B6B6B">column names + row index → 2D</text>

  <!-- Series box -->
  <rect x="300" y="410" width="210" height="110" rx="6" fill="#F5F3EE" stroke="#D97757" stroke-width="1.5"/>
  <text x="405" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97757">Series (one column)</text>
  <rect x="390" y="440" width="30" height="60" fill="#FFFFFF" stroke="#D97757"/>
  <text x="405" y="514" text-anchor="middle" font-size="10" fill="#6B6B6B">one column name + row index → 1D</text>

  <!-- Code examples -->
  <rect x="540" y="420" width="220" height="40" rx="4" fill="#2B2B2B"/>
  <text x="550" y="438" font-size="10" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">type(df)</text>
  <text x="610" y="438" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6A9BCC">→ DataFrame</text>
  <text x="550" y="454" font-size="10" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">type(df["age"])</text>
  <text x="650" y="454" font-size="10" font-family="Menlo, Monaco, monospace" fill="#D97757">→ Series</text>

  <text x="650" y="480" text-anchor="middle" font-size="10" fill="#1A1A1A" font-weight="bold">💡 Memory trick:</text>
  <text x="650" y="496" text-anchor="middle" font-size="10" fill="#6B6B6B">df["age"] has one column = Series</text>
  <text x="650" y="510" text-anchor="middle" font-size="9" fill="#6B6B6B">df[["age","sex"]]: 2 columns = DataFrame</text>
</svg>
