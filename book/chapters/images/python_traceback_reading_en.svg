<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arr-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#D97757"/>
    </marker>
  </defs>

  <rect width="800" height="540" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">Reading a Traceback — Start From the Bottom!</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">Python's red text isn't scary — the last line says what broke, the rest shows how you got there</text>

  <!-- Main traceback card -->
  <g filter="url(#shadow)">
    <rect x="30" y="72" width="560" height="310" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="50" y="96" font-size="13" font-weight="bold" fill="#1A1A1A">A typical traceback</text>

  <!-- Terminal block -->
  <rect x="50" y="108" width="520" height="250" rx="6" fill="#2B2B2B"/>

  <text x="70" y="132" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">Traceback (most recent call last):</text>

  <text x="70" y="158" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">  File "outbreak.py", line 15, in &lt;module&gt;</text>
  <text x="70" y="174" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">    cfr = calc_cfr(deaths, cases)</text>

  <text x="70" y="200" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">  File "outbreak.py", line 9, in calc_cfr</text>
  <text x="70" y="216" font-size="11" font-family="Menlo, Monaco, monospace" fill="#F8F8F2">    return deaths / cases</text>

  <text x="70" y="254" font-size="13" font-family="Menlo, Monaco, monospace" fill="#D94452" font-weight="bold">TypeError: unsupported operand</text>
  <text x="70" y="272" font-size="13" font-family="Menlo, Monaco, monospace" fill="#D94452" font-weight="bold">  type(s) for /: 'str' and 'int'</text>

  <!-- Focus boxes with labels -->
  <rect x="65" y="242" width="475" height="40" rx="4" fill="none" stroke="#D97757" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="70" y="302" font-size="10" font-family="Menlo, Monaco, monospace" fill="#D97757" font-weight="bold">← ① Read this first: error type + message</text>

  <rect x="65" y="148" width="475" height="30" rx="4" fill="none" stroke="#6A9BCC" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="70" y="332" font-size="10" font-family="Menlo, Monaco, monospace" fill="#6A9BCC" font-weight="bold">← ② Then: which of my lines caused it</text>

  <rect x="65" y="190" width="475" height="30" rx="4" fill="none" stroke="#788C5D" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="70" y="348" font-size="10" font-family="Menlo, Monaco, monospace" fill="#788C5D" font-weight="bold">← ③ Finally: where it actually blew up</text>

  <!-- Reading order arrow -->
  <line x1="600" y1="340" x2="600" y2="140" stroke="#D97757" stroke-width="3" marker-end="url(#arr-up)"/>
  <text x="620" y="245" font-size="12" font-weight="bold" fill="#D97757" transform="rotate(90, 620, 245)">Read bottom-up</text>

  <!-- Right side: 5 common errors -->
  <g filter="url(#shadow)">
    <rect x="610" y="72" width="160" height="310" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="690" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A1A1A">Common Errors</text>

  <rect x="625" y="110" width="130" height="48" rx="4" fill="#D94452" fill-opacity="0.08"/>
  <text x="635" y="128" font-size="10" font-weight="bold" fill="#D94452">NameError</text>
  <text x="635" y="143" font-size="9" fill="#6B6B6B">Misspelled variable</text>
  <text x="635" y="155" font-size="9" fill="#6B6B6B">infceted → infected</text>

  <rect x="625" y="166" width="130" height="48" rx="4" fill="#D94452" fill-opacity="0.08"/>
  <text x="635" y="184" font-size="10" font-weight="bold" fill="#D94452">TypeError</text>
  <text x="635" y="199" font-size="9" fill="#6B6B6B">Wrong data type</text>
  <text x="635" y="211" font-size="9" fill="#6B6B6B">"121" / 280</text>

  <rect x="625" y="222" width="130" height="48" rx="4" fill="#D94452" fill-opacity="0.08"/>
  <text x="635" y="240" font-size="10" font-weight="bold" fill="#D94452">KeyError</text>
  <text x="635" y="255" font-size="9" fill="#6B6B6B">Key not in dict</text>
  <text x="635" y="267" font-size="9" fill="#6B6B6B">d["death"]</text>

  <rect x="625" y="278" width="130" height="48" rx="4" fill="#D94452" fill-opacity="0.08"/>
  <text x="635" y="296" font-size="10" font-weight="bold" fill="#D94452">IndexError</text>
  <text x="635" y="311" font-size="9" fill="#6B6B6B">Index out of range</text>
  <text x="635" y="323" font-size="9" fill="#6B6B6B">wings[6] (only 6 items)</text>

  <rect x="625" y="334" width="130" height="40" rx="4" fill="#D94452" fill-opacity="0.08"/>
  <text x="635" y="350" font-size="10" font-weight="bold" fill="#D94452">IndentationError</text>
  <text x="635" y="363" font-size="9" fill="#6B6B6B">Missing indentation</text>

  <!-- Bottom: reading rules -->
  <g filter="url(#shadow)">
    <rect x="30" y="400" width="740" height="130" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>
  <text x="400" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A">SOP for red error text — don't panic!</text>

  <rect x="50" y="440" width="220" height="75" rx="6" fill="#F5F3EE"/>
  <text x="160" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#D97757">① Find the last line</text>
  <text x="60" y="478" font-size="10" fill="#6B6B6B">See the error type (NameError,</text>
  <text x="60" y="492" font-size="10" fill="#6B6B6B">TypeError, etc.) and message —</text>
  <text x="60" y="506" font-size="10" fill="#6B6B6B">this tells you the problem type.</text>

  <rect x="290" y="440" width="220" height="75" rx="6" fill="#F5F3EE"/>
  <text x="400" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A9BCC">② Find your line number</text>
  <text x="300" y="478" font-size="10" fill="#6B6B6B">Find "your file, line N" in</text>
  <text x="300" y="492" font-size="10" fill="#6B6B6B">the traceback → check line N</text>
  <text x="300" y="506" font-size="10" fill="#6B6B6B">of your code — that's usually it.</text>

  <rect x="530" y="440" width="220" height="75" rx="6" fill="#F5F3EE"/>
  <text x="640" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#788C5D">③ Check reference / search</text>
  <text x="540" y="478" font-size="10" fill="#6B6B6B">Still confused? Copy the whole</text>
  <text x="540" y="492" font-size="10" fill="#6B6B6B">error message and ask AI or</text>
  <text x="540" y="506" font-size="10" fill="#6B6B6B">Google — don't stop at line one!</text>
</svg>
