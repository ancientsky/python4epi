  <text x="54" y="430" font-size="12" font-weight="bold" fill="#788C5D">Rolling average</text>
  <text x="54" y="447" font-size="9" fill="#6B6B6B">Don't trust one day's ups and downs;</text>
  <text x="54" y="461" font-size="9" fill="#6B6B6B">the 7-day average shows the real trend</text>
  <rect x="280" y="410" width="228" height="58" rx="8" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="294" y="430" font-size="12" font-weight="bold" fill="#6A9BCC">Autoregression</text>
  <text x="294" y="447" font-size="9" fill="#6B6B6B">"Busy yesterday, likely busy today";</text>
  <text x="294" y="461" font-size="9" fill="#6B6B6B">use recent days to predict tomorrow</text>
  <rect x="520" y="410" width="228" height="58" rx="8" fill="#F5F3EE" stroke="#E8E5DF"/>
  <text x="534" y="430" font-size="12" font-weight="bold" fill="#D97757">Seasonality s=7</text>
  <text x="534" y="447" font-size="9" fill="#6B6B6B">"Every Saturday is packed";</text>
  <text x="534" y="461" font-size="9" fill="#6B6B6B">a rhythm that repeats every 7 days</text>
  <text x="400" y="492" text-anchor="middle" font-size="12" fill="#1A1A1A">Why forecast? Bubble tea: <tspan fill="#D97757" font-weight="bold">how many pearls, how many staff</tspan> = outbreak: <tspan fill="#6A9BCC" font-weight="bold">how many beds, how much staffing</tspan></text>
