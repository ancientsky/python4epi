<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="440" fill="#FAF8F3" rx="12"/>

  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A1A1A">設限資料（Censored Data）—— 比賽還沒結束就離場</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#6B6B6B">6 位病人的追蹤時間軸：有人看到結局、有人沒看到</text>

  <!-- Main timeline card -->
  <g filter="url(#shadow)">
    <rect x="30" y="74" width="500" height="320" rx="10" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1.5"/>
  </g>

  <!-- X axis (time) -->
  <line x1="100" y1="360" x2="490" y2="360" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="100" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Day 0</text>
  <text x="195" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Day 7</text>
  <text x="295" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Day 14</text>
  <text x="395" y="380" text-anchor="middle" font-size="10" fill="#6B6B6B">Day 21</text>
  <text x="490" y="380" text-anchor="middle" font-size="10" fill="#D94452" font-weight="bold">研究截止</text>
  <line x1="490" y1="90" x2="490" y2="360" stroke="#D94452" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Tick marks on axis -->
  <g stroke="#1A1A1A" stroke-width="1">
    <line x1="100" y1="358" x2="100" y2="362"/>
    <line x1="195" y1="358" x2="195" y2="362"/>
    <line x1="295" y1="358" x2="295" y2="362"/>
    <line x1="395" y1="358" x2="395" y2="362"/>
    <line x1="490" y1="358" x2="490" y2="362"/>
  </g>

  <!-- Patient A: death at day 5 -->
  <text x="80" y="114" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt A</text>
  <line x1="100" y1="110" x2="170" y2="110" stroke="#D97757" stroke-width="3"/>
  <circle cx="170" cy="110" r="7" fill="#D94452" stroke="#FFFFFF" stroke-width="2"/>
  <text x="180" y="114" font-size="10" fill="#D94452" font-weight="bold">死亡</text>

  <!-- Patient B: death at day 12 -->
  <text x="80" y="154" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt B</text>
  <line x1="100" y1="150" x2="265" y2="150" stroke="#D97757" stroke-width="3"/>
  <circle cx="265" cy="150" r="7" fill="#D94452" stroke="#FFFFFF" stroke-width="2"/>
  <text x="275" y="154" font-size="10" fill="#D94452" font-weight="bold">死亡</text>

  <!-- Patient C: right-censored at study end -->
  <text x="80" y="194" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt C</text>
  <line x1="100" y1="190" x2="490" y2="190" stroke="#6A9BCC" stroke-width="3"/>
  <polygon points="490,184 502,190 490,196" fill="#6A9BCC"/>
  <text x="510" y="194" font-size="10" fill="#6A9BCC" font-weight="bold">設限（仍存活）</text>

  <!-- Patient D: death at day 8 -->
  <text x="80" y="234" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt D</text>
  <line x1="100" y1="230" x2="210" y2="230" stroke="#D97757" stroke-width="3"/>
  <circle cx="210" cy="230" r="7" fill="#D94452" stroke="#FFFFFF" stroke-width="2"/>
  <text x="220" y="234" font-size="10" fill="#D94452" font-weight="bold">死亡</text>

  <!-- Patient E: lost to follow-up at day 15 -->
  <text x="80" y="274" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt E</text>
  <line x1="100" y1="270" x2="310" y2="270" stroke="#788C5D" stroke-width="3"/>
  <polygon points="310,264 322,270 310,276" fill="#788C5D"/>
  <text x="330" y="274" font-size="10" fill="#788C5D" font-weight="bold">設限（失聯）</text>

  <!-- Patient F: right-censored at study end -->
  <text x="80" y="314" text-anchor="end" font-size="11" font-weight="bold" fill="#1A1A1A">Pt F</text>
  <line x1="100" y1="310" x2="490" y2="310" stroke="#6A9BCC" stroke-width="3"/>
  <polygon points="490,304 502,310 490,316" fill="#6A9BCC"/>
  <text x="510" y="314" font-size="10" fill="#6A9BCC" font-weight="bold">設限（仍存活）</text>

  <!-- Legend icons under axis -->
  <g transform="translate(100, 400)">
    <circle cx="8" cy="5" r="6" fill="#D94452" stroke="#FFFFFF" stroke-width="2"/>
    <text x="20" y="9" font-size="10" fill="#1A1A1A">● 觀察到事件（event=1）</text>
    <polygon points="200,-1 212,5 200,11" fill="#6A9BCC"/>
    <text x="220" y="9" font-size="10" fill="#1A1A1A">▸ 設限（event=0）</text>
  </g>

  <!-- RIGHT: Censoring types card -->
  <g filter="url(#shadow)">
    <rect x="550" y="74" width="220" height="320" rx="10" fill="#FFFFFF" stroke="#6A9BCC" stroke-width="2"/>
  </g>
  <rect x="550" y="74" width="220" height="34" rx="10" fill="#6A9BCC" fill-opacity="0.15"/>
  <text x="660" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A9BCC">三種設限類型</text>

  <!-- Right censoring -->
  <rect x="565" y="120" width="190" height="78" rx="6" fill="#F5F3EE"/>
  <text x="575" y="140" font-size="12" font-weight="bold" fill="#D97757">Right-censored ✓</text>
  <text x="575" y="156" font-size="10" fill="#1A1A1A">觀察結束仍未發生事件</text>
  <text x="575" y="172" font-size="10" fill="#6B6B6B">例：Pt C、F（研究截止）</text>
  <text x="575" y="188" font-size="10" fill="#6B6B6B">例：Pt E（失聯）</text>

  <!-- Left censoring -->
  <rect x="565" y="210" width="190" height="62" rx="6" fill="#F5F3EE"/>
  <text x="575" y="230" font-size="12" font-weight="bold" fill="#6B6B6B">Left-censored</text>
  <text x="575" y="246" font-size="10" fill="#1A1A1A">事件在觀察前已發生</text>
  <text x="575" y="262" font-size="10" fill="#6B6B6B">例：篩檢前已感染</text>

  <!-- Interval censoring -->
  <rect x="565" y="284" width="190" height="62" rx="6" fill="#F5F3EE"/>
  <text x="575" y="304" font-size="12" font-weight="bold" fill="#6B6B6B">Interval-censored</text>
  <text x="575" y="320" font-size="10" fill="#1A1A1A">只知某段時間內發生</text>
  <text x="575" y="336" font-size="10" fill="#6B6B6B">例：兩次追蹤之間</text>

  <text x="660" y="372" text-anchor="middle" font-size="11" fill="#788C5D" font-weight="bold">KM / Cox 處理 right-censoring</text>

  <!-- Bottom key takeaway -->
  <g filter="url(#shadow)">
    <rect x="30" y="408" width="740" height="24" rx="8" fill="#FFFFFF" stroke="#E8E5DF" stroke-width="1"/>
  </g>
  <text x="400" y="425" text-anchor="middle" font-size="11" fill="#1A1A1A"><tspan font-weight="bold" fill="#D94452">關鍵：</tspan>設限資料不是遺漏值！不能丟掉，也不能當成「已死亡」處理 —— 要用存活分析正確納入</text>
</svg>
