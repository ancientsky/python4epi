title: Epi With Python
author: Epi With Python Contributors
language: zh
only_build_toc_files: true
execute:
  execute_notebooks: force
  timeout: 300
sphinx:
  config:
    html_baseurl: https://ancientsky.github.io/python4epi/
    templates_path: ["_templates"]
    html_theme_options:
      show_navbar_depth: 2
      show_toc_level: 2
      home_page_in_toc: true
      # Use Monokai pygments style in BOTH modes so block code (which is
      # rendered on the dark #2B2B2B background in both light and dark mode —
      # see book/_static/custom.css) stays legible. Default light style uses
      # dark tokens designed for white backgrounds.
      pygments_light_style: monokai
      pygments_dark_style: monokai
      logo:
        image_light: _static/logo.svg
        image_dark: _static/logo-dark.svg
    # Note: Open Graph / Twitter Card meta tags are injected via the template
    # override at ``book/_templates/layout.html`` (zero-dependency approach —
    # no sphinxext-opengraph needed). Keep template copy in sync when updating.
    nb_execution_pre_code: |
      import os as _os
      import pathlib as _pathlib
      # Ensure CWD is the project root (where data/ directory lives).
      # Jupyter Book executes notebooks from the notebook's own directory,
      # but all notebooks reference data/synthetic/ relative to the project root.
      _cwd = _pathlib.Path.cwd()
      for _ in range(5):
          if (_cwd / "data" / "synthetic").is_dir():
              _os.chdir(_cwd)
              break
          _cwd = _cwd.parent
      del _cwd, _os
      import matplotlib.pyplot as plt
      import matplotlib.font_manager as _fm
      import pathlib as _pathlib
      # Explicitly discover and register CJK font files (more reliable than cache rebuild)
      for _font_dir in map(_pathlib.Path, ["/usr/share/fonts", "/usr/local/share/fonts"]):
          if _font_dir.exists():
              for _fp in sorted(_font_dir.rglob("*")):
                  if _fp.suffix.lower() in {".ttf", ".ttc", ".otf"} and (
                      "CJK" in _fp.name or "WenQuanYi" in _fp.name or "wqy" in _fp.name
                  ):
                      try:
                          _fm.fontManager.addfont(str(_fp))
                      except Exception:
                          pass
      # Discover actually-registered CJK font names.  addfont() only reads
      # face 0 of .ttc collections, so "Noto Sans CJK TC" may never appear;
      # the JP/SC/KR variant registered at face 0 covers CJK Unified Ideographs
      # equally well.
      _discovered = []
      for _entry in _fm.fontManager.ttflist:
          _nlower = _entry.name.lower()
          if any(_kw in _nlower for _kw in ("cjk", "wenquanyi", "wqy")):
              if _entry.name not in _discovered:
                  _discovered.append(_entry.name)
      _preferred = ["Noto Sans CJK TC", "Noto Sans CJK SC", "Noto Sans CJK JP",
                     "Noto Sans CJK KR", "Noto Sans CJK HK", "Noto Sans TC",
                     "Microsoft JhengHei", "WenQuanYi Zen Hei", "SimHei",
                     "Arial Unicode MS", "Heiti TC"]
      _cjk_fonts = list(_discovered)
      for _n in _preferred:
          if _n not in _cjk_fonts:
              _cjk_fonts.append(_n)
      plt.rcParams["font.sans-serif"] = _cjk_fonts + [
          f for f in plt.rcParams.get("font.sans-serif", []) if f not in _cjk_fonts]
      plt.rcParams["axes.unicode_minus"] = False
      plt.style.use("ggplot")
      plt.rcParams["figure.dpi"] = 150
      # Set Plotly renderer for static Jupyter Book builds
      try:
          import plotly.io as _pio
          _pio.renderers.default = "notebook"
          del _pio
      except ImportError:
          pass
      del _cjk_fonts, _fm, _pathlib, _discovered, _preferred
repository:
  url: https://github.com/ancientsky/python4epi
  branch: main
html:
  favicon: _static/favicon.svg
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true
  extra_css:
    - _static/youtube-lite.css
    - _static/custom.css
  extra_js:
    - _static/youtube-lite.js
launch_buttons:
  notebook_interface: jupyterlab
