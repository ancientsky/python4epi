# Jupyter Book 2 (MyST) configuration — 中文 教師版 (zh instructor edition).
#
#   uv run python scripts/build_book.py --lang zh --edition instructor
#
# Everything except the table of contents comes from ../myst.yml (the student
# edition). MyST resolves a project's files relative to the directory holding
# its myst.yml, so this directory carries symlinks back to the shared content
# (chapters/, intro.md, _static/, _site/) and URLs match the student edition.
# The TOC is the student TOC plus 17_solutions and its notebooks.
version: 1
extends: ../myst.yml
project:
  toc:
    - file: intro.md
    - title: 第一幕：接獲通報
      children:
        - file: chapters/00_guide.md
        - file: chapters/01_fundamentals.md
          children:
            - file: chapters/notebooks/01_fundamentals_python_basics.ipynb
        - file: chapters/01b_python_toolbox.md
          children:
