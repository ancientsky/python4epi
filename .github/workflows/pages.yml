name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --all-groups

      - name: Build book
        run: |
          # Skip notebook execution for Pages deploy — CI already validates it.
          # This avoids heavy-dependency failures (torch, geopandas) during deploy.
          sed -i 's/execute_notebooks: force/execute_notebooks: "off"/' book/_config.yml
          cp book/_toc_student.yml book/_toc.yml
          uv run jupyter-book build book/

      - name: Prepare pages artifact
        run: |
          if [ ! -d book/_build/html ] || [ -z "$(find book/_build/html -maxdepth 1 -name '*.html' | head -n 1)" ]; then
            echo "ERROR: book/_build/html not found or contains no HTML files."
            echo "Build output tree:"
            find book/_build -type f 2>/dev/null | head -40 || echo "(no _build directory)"
            exit 1
          fi
          rm -rf page_artifact
          cp -a book/_build/html page_artifact
          if [ ! -f page_artifact/index.html ] && [ -f page_artifact/intro.html ]; then
            cp page_artifact/intro.html page_artifact/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
