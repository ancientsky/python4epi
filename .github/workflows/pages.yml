name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install CJK fonts for matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          rm -rf ~/.cache/matplotlib

      - name: Sync deps
        run: uv sync --group dev

      - name: Create data symlinks for notebook execution
        run: |
          # Jupyter Book executes notebooks from their own directory.
          # Symlinks let `data/synthetic/...` resolve from any subdirectory.
          for dir in book book/chapters book/chapters/exercises book/chapters/solutions book/chapters/notebooks; do
            if [ -d "$dir" ]; then
              # Compute relative path back to repo-root data/
              rel=$(python3 -c "import os.path; print(os.path.relpath('data', '$dir'))")
              ln -sfn "$rel" "$dir/data"
            fi
          done
          # Verify
          ls -la book/chapters/solutions/data/synthetic/legionella_outbreak.csv

      - name: Build student edition
        run: |
          cp book/_toc_student.yml book/_toc.yml
          uv run jupyter-book build book/

      - name: Save student build
        run: |
          cp -a book/_build/html student_html

      - name: Build instructor edition
        run: |
          cp book/_toc_instructor.yml book/_toc.yml
          uv run jupyter-book build book/ --all

      - name: Prepare pages artifact
        run: |
          # Validate student build
          if [ ! -d student_html ] || [ -z "$(find student_html -maxdepth 1 -name '*.html' | head -n 1)" ]; then
            echo "ERROR: student build not found or contains no HTML files."
            exit 1
          fi
          # Validate instructor build
          if [ ! -d book/_build/html ] || [ -z "$(find book/_build/html -maxdepth 1 -name '*.html' | head -n 1)" ]; then
            echo "ERROR: instructor build not found or contains no HTML files."
            exit 1
          fi

          # Root = student edition
          rm -rf page_artifact
          cp -a student_html page_artifact
          if [ ! -f page_artifact/index.html ] && [ -f page_artifact/intro.html ]; then
            cp page_artifact/intro.html page_artifact/index.html
          fi

          # /instructor/ = instructor edition (includes solutions)
          cp -a book/_build/html page_artifact/instructor
          if [ ! -f page_artifact/instructor/index.html ] && [ -f page_artifact/instructor/intro.html ]; then
            cp page_artifact/instructor/intro.html page_artifact/instructor/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: page_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
