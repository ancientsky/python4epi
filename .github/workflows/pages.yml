name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.12"

      - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

      - name: Set up Python
      run: uv python install 3.11

      - name: Sync deps
      run: uv sync --all-groups

      - name: Build book
      run: uv run jupyter-book build book/

      - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
      uses: actions/deploy-pages@v4
