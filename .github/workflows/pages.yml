name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install CJK fonts for matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          rm -rf ~/.cache/matplotlib

      - name: Sync deps
        run: uv sync --group dev

      - name: Create data symlinks for notebook execution
        run: |
          # Jupyter Book executes notebooks from their own directory.
          # Symlinks let `data/synthetic/...` resolve from any subdirectory.
          for dir in \
            book book/chapters book/chapters/exercises book/chapters/solutions book/chapters/notebooks \
            book_en book_en/chapters book_en/chapters/exercises book_en/chapters/solutions book_en/chapters/notebooks; do
            if [ -d "$dir" ]; then
              # Compute relative path back to repo-root data/
              rel=$(python3 -c "import os.path; print(os.path.relpath('data', '$dir'))")
              ln -sfn "$rel" "$dir/data"
            fi
          done
          # Verify
          ls -la book/chapters/solutions/data/synthetic/legionella_outbreak.csv

      - name: Build student edition
        run: |
          cp book/_toc_student.yml book/_toc.yml
          uv run jupyter-book build book/

      - name: Save student build
        run: |
          cp -a book/_build/html student_html

      - name: Build instructor edition
        run: |
          cp book/_toc_instructor.yml book/_toc.yml
          uv run jupyter-book build book/ --all

      - name: Build English student edition
        run: |
          cp book_en/_toc_student.yml book_en/_toc.yml
          uv run jupyter-book build book_en/

      - name: Save English student build
        run: |
          cp -a book_en/_build/html en_student_html

      - name: Build English instructor edition
        run: |
          cp book_en/_toc_instructor.yml book_en/_toc.yml
          uv run jupyter-book build book_en/ --all

      - name: Prepare pages artifact
        run: |
          # Helper: fail if a build dir has no top-level HTML.
          check_build() {
            if [ ! -d "$1" ] || [ -z "$(find "$1" -maxdepth 1 -name '*.html' | head -n 1)" ]; then
              echo "ERROR: $2 not found or contains no HTML files."
              exit 1
            fi
          }
          # Helper: ensure an index.html exists (fall back to intro.html).
          ensure_index() {
            if [ ! -f "$1/index.html" ] && [ -f "$1/intro.html" ]; then
              cp "$1/intro.html" "$1/index.html"
            fi
          }

          check_build student_html "zh student build"
          check_build book/_build/html "zh instructor build"
          check_build en_student_html "en student build"
          check_build book_en/_build/html "en instructor build"

          # Root = zh student edition
          rm -rf page_artifact
          cp -a student_html page_artifact
          ensure_index page_artifact

          # /instructor/ = zh instructor edition (includes solutions)
          cp -a book/_build/html page_artifact/instructor
          ensure_index page_artifact/instructor

          # /en/ = English student edition
          cp -a en_student_html page_artifact/en
          ensure_index page_artifact/en

          # /en/instructor/ = English instructor edition
          cp -a book_en/_build/html page_artifact/en/instructor
          ensure_index page_artifact/en/instructor

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: page_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
