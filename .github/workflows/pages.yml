name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true

      - name: Set up Python
        run: uv python install 3.14

      # Render the YouTube cards from videos/youtube_ids.yaml at build time
      # rather than trusting the snapshot committed in the chapter markdown.
      # A link pasted straight into the registry on github.com is therefore live
      # on this very deploy, with no bot commit in between -- which the branch
      # ruleset on main would reject anyway. Idempotent: a no-op when in sync.
      # --no-project skips the book's dependency set; the script only needs pyyaml.
      - name: Render video embeds from youtube_ids.yaml
        run: |
          set -euo pipefail
          {
            echo "## 影片卡片"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project --with pyyaml python videos/sync_video_embeds.py \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Install CJK fonts for matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          rm -rf ~/.cache/matplotlib

      - name: Sync deps
        run: uv sync --group dev

      # One entry point builds all seven editions (MyST build with notebooks
      # executed under --strict, then the post-build step) and assembles them
      # at their deploy paths: / (zh student), /instructor/, /en/,
      # /en/instructor/, and the Philippines edition at /ph/, /ph/zh/,
      # /ph/fil/. Kernel pre-execution setup (repo-root cwd for
      # data/synthetic/, CJK fonts, ggplot, Plotly renderer) is installed by the
      # script, so no data symlinks are needed. See scripts/build_book.py.
      - name: Build all seven editions
        run: uv run python scripts/build_book.py --all --site-dir page_artifact

      - name: Sanity-check the pages artifact
        run: |
          set -euo pipefail
          fail() { echo "ERROR: $*"; exit 1; }
          for edition in "" instructor/ en/ en/instructor/; do
            dir="page_artifact/${edition}"
            [ -f "${dir}index.html" ] || fail "${dir}index.html missing"
            [ -f "${dir}chapters/notebooks/stats-basics/index.html" ] \
              || fail "${dir}: notebook page missing"
            # JB1 URLs must keep working (redirect stubs).
            [ -f "${dir}chapters/notebooks/03_stats_basics.html" ] \
              || fail "${dir}: legacy redirect missing"
            grep -q 'window.EPI_SITE=' "${dir}index.html" || fail "${dir}: not post-processed"
          done
          grep -q '<html lang="zh-Hant"' page_artifact/index.html || fail "zh lang tag"
          grep -q '<html lang="en"' page_artifact/en/index.html || fail "en lang tag"
          # Philippines edition: three languages, each with its notebook pages,
          # the post-build config and the generated chapter-9 dashboard.
          for edition in ph/ ph/zh/ ph/fil/; do
            dir="page_artifact/${edition}"
            [ -f "${dir}index.html" ] || fail "${dir}index.html missing"
            [ -f "${dir}chapters/notebooks/dashboard/index.html" ] \
              || fail "${dir}: notebook page missing"
            [ -f "${dir}dashboard/index.html" ] || fail "${dir}: dashboard missing"
            [ -f "${dir}_static/ph-site.js" ] || fail "${dir}: ph-site.js missing"
            grep -q 'window.EPI_SITE=' "${dir}index.html" || fail "${dir}: not post-processed"
          done
          grep -q '<html lang="en"' page_artifact/ph/index.html || fail "ph en lang tag"
          grep -q '<html lang="zh-Hant"' page_artifact/ph/zh/index.html || fail "ph zh lang tag"
          grep -q '<html lang="fil"' page_artifact/ph/fil/index.html || fail "ph fil lang tag"
          # Solutions only in the instructor editions.
          [ -f page_artifact/instructor/chapters/solutions/stats-solution/index.html ] \
            || fail "zh instructor solutions missing"
          [ -f page_artifact/en/instructor/chapters/solutions/stats-solution/index.html ] \
            || fail "en instructor solutions missing"
          # Match the solutions chapter and solution notebooks/pages only: the
          # theme ships an unrelated syntax-highlighting chunk named
          # build/_shared/solution-file-*.js, which a bare '*solution*' would hit.
          # The root scan also covers page_artifact/ph/ (no instructor edition).
          for student in page_artifact page_artifact/en; do
            if find "$student" -path "$student/instructor" -prune -o -path "$student/en" -prune \
                 -o \( -path '*/chapters/solutions*' -o -name '*_solution.*' -o -name '*-solution' \) \
                 -print | grep -q .; then
              fail "$student contains solution files"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: page_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
