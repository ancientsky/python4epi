name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --all-groups

      - name: Build book
        run: uv run jupyter-book build book/ --builder html

      - name: Resolve build output path
        run: |
          SRC_DIR=""
          for candidate in book/_build/html _build/html book/_build/site _build/site book/_build _build; do
            if [ -f "${candidate}/index.html" ]; then
              SRC_DIR="${candidate}"
              break
            fi
          done

          if [ -z "${SRC_DIR}" ]; then
            INDEX_FILE="$(find . -type f -path '*/_build/*/index.html' | head -n 1)"
            if [ -n "${INDEX_FILE}" ]; then
              SRC_DIR="$(dirname "${INDEX_FILE}")"
            fi
          fi

          if [ -z "${SRC_DIR}" ]; then
            echo "Could not find Jupyter Book HTML output directory."
            echo "Directories named _build:"
            find . -type d -name "_build" || true
            echo "Directories named html:"
            find . -type d -name "html" || true
            echo "Any index.html under _build:"
            find . -type f -path '*/_build/*/index.html' || true
            exit 1
          fi
          echo "Resolved Jupyter Book output: ${SRC_DIR}"
          rm -rf page_artifact
          mkdir -p page_artifact
          cp -a "${SRC_DIR}/." page_artifact/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page_artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
