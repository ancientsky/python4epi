name: Check video links

# Fast feedback for a link pasted into videos/youtube_ids.yaml from the GitHub
# web UI: is it readable, and does every entry line up with a marker in the
# chapters? The cards themselves are rendered by deploy-pages at build time, so
# nothing here writes to the repository -- the earlier version of this workflow
# committed the regenerated embeds back to main and was rejected by the branch
# ruleset ("changes must be made through a pull request"). Generating at deploy
# time removes the need for a bot commit altogether.

on:
  push:
    branches: [main]
    paths:
      - "videos/youtube_ids.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.12"

      # --no-project skips the book's full dependency set: the script only needs
      # pyyaml, which keeps this job down to seconds.
      - name: Validate the registry
        run: |
          set -euo pipefail
          {
            echo "## 影片連結檢查"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project --with pyyaml python videos/sync_video_embeds.py --validate \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "卡片會在 **deploy-pages** 建置時重新產生，這個 push 已經同時觸發它了。" \
            >> "$GITHUB_STEP_SUMMARY"
