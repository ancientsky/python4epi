name: Build Tutorial Videos

on:
  workflow_dispatch:
    inputs:
      chapter:
        description: "Which chapter to build (pick 'all' for every chapter)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ch00   # 導讀與工具 / Getting started
          - ch01   # Python 基礎 / Python basics
          - ch01b  # 開發者工具箱 / Developer toolbox
          - ch02   # 資料處理與視覺化 / Data handling & viz
          - ch03   # 2×2 表與推論統計 / 2×2 tables & inference
          - ch04   # 群聚調查工作流 / Outbreak workflow
          - ch05   # 分層分析與干擾 / Stratified analysis
          - ch06   # 多變項分析 / Multivariable analysis
          - ch07   # 時間序列與預測 / Time series & forecasting
          - ch08   # 空間流病 / Spatial epidemiology
          - ch09   # 存活分析 / Survival analysis
          - ch10   # 機器學習 / Machine learning
          - ch11   # 深度學習 / Deep learning
          - ch12   # 因果推論 / Causal inference
          - ch13   # 可重現研究 / Reproducibility
          - ch14   # 實戰案例與報告 / Capstone & reporting
      language:
        description: "Narration language"
        required: false
        default: "zh"
        type: choice
        options:
          - zh     # 中文 (Traditional Chinese)
          - en     # English
          - both   # both editions
      concept:
        description: "Optional: build only ONE concept (e.g. 'moran' or 'moran_en'); overrides chapter"
        required: false
        default: ""
        type: string
      quality:
        description: "Render quality"
        required: false
        default: "h"
        type: choice
        options:
          - h
          - m
          - l
      create_release:
        description: "Create a GitHub Release with the videos"
        required: false
        default: true
        type: boolean

jobs:
  build-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed for creating releases

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk libpango1.0-dev libcairo2-dev pkg-config >/dev/null 2>&1

      - name: Install Python dependencies
        run: uv sync --group video

      - name: Build videos
        run: |
          if [ -n "${{ inputs.concept }}" ]; then
            uv run python videos/build.py --concept "${{ inputs.concept }}" --lang "${{ inputs.language }}" --quality "${{ inputs.quality }}" -v
          elif [ "${{ inputs.chapter }}" = "all" ]; then
            uv run python videos/build.py --all --lang "${{ inputs.language }}" --quality "${{ inputs.quality }}" -v
          else
            uv run python videos/build.py --chapter "${{ inputs.chapter }}" --lang "${{ inputs.language }}" --quality "${{ inputs.quality }}" -v
          fi

      - name: List generated videos
        run: |
          echo "## Generated Videos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in videos/output/final/*.mp4; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "- $(basename $f) ($size)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-videos
          path: videos/output/final/*.mp4
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="videos-$(date +%Y%m%d-%H%M%S)"
          TITLE="Tutorial Videos $(date +%Y-%m-%d)"

          # Build release notes
          NOTES="## Tutorial Videos — chapter: ${{ inputs.chapter }} · language: ${{ inputs.language }}\n\n"
          NOTES+="Generated with Manim + edge-tts + ffmpeg.\n\n"
          NOTES+="| # | Video | Size |\n"
          NOTES+="|---|-------|------|\n"
          for f in videos/output/final/*.mp4; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              NOTES+="| | $name | $size |\n"
            fi
          done
          NOTES+="\n\nQuality: ${{ inputs.quality }} | Commit: ${{ github.sha }}"

          # Create release with video files attached
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$(echo -e "$NOTES")" \
            videos/output/final/*.mp4
