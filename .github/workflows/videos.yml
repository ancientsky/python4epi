name: Build Tutorial Videos

on:
  workflow_dispatch:
    inputs:
      concept:
        description: "Which video to build (leave empty for all)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - why_python
          - uv_setup
          - jupyter
          - hello_epi
          - git_basics
          - roadmap
          - indentation
          - imports
          - types
          - errors
          - try_except
          - strings_loops
          - uv_advanced
          - jupyter_tips
          - variables
          - arithmetic
          - dictionaries
          - lists
          - conditionals
          - functions
          - dataframe
          - data_inspect
          - datetime
          - derived
          - missing
          - groupby
          - epicurve
          - seaborn_plotly
          - value_counts
          - pivot_table
          - method_chaining
          - merge
          - str_cleanup
          - two_by_two
          - risk_ratio
          - odds_ratio
          - confidence_interval
          - chi_square
          - fisher_test
          - forest_plot
          - sitrep_overview
          - person
          - time
          - place
          - classification
          - generate_sitrep
          - report_output
          - pii_protection
          - confounder_concept
          - dag
          - verify_criteria
          - stratified_rr
          - stratified_forest_plot
          - mantel_haenszel
          - effect_modification
          - case_control_mh
      quality:
        description: "Render quality"
        required: false
        default: "h"
        type: choice
        options:
          - h
          - m
          - l
      create_release:
        description: "Create a GitHub Release with the videos"
        required: false
        default: true
        type: boolean

jobs:
  build-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed for creating releases

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk libpango1.0-dev libcairo2-dev pkg-config >/dev/null 2>&1

      - name: Install Python dependencies
        run: uv sync --group video

      - name: Build videos
        run: |
          if [ -n "${{ inputs.concept }}" ]; then
            uv run python videos/build.py --concept "${{ inputs.concept }}" --quality "${{ inputs.quality }}" -v
          else
            uv run python videos/build.py --all --quality "${{ inputs.quality }}" -v
          fi

      - name: List generated videos
        run: |
          echo "## Generated Videos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in videos/output/final/*.mp4; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "- $(basename $f) ($size)" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-videos
          path: videos/output/final/*.mp4
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="videos-$(date +%Y%m%d-%H%M%S)"
          TITLE="Tutorial Videos $(date +%Y-%m-%d)"

          # Build release notes
          NOTES="## Tutorial Videos (Ch00–05 導讀與工具 / 開發者工具箱 / Python 基礎 / 資料處理與視覺化 / 2×2 表與推論統計 / 群聚調查工作流 / 分層分析與干擾因子)\n\n"
          NOTES+="Generated with Manim + edge-tts + ffmpeg.\n\n"
          NOTES+="| # | Video | Size |\n"
          NOTES+="|---|-------|------|\n"
          for f in videos/output/final/*.mp4; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              NOTES+="| | $name | $size |\n"
            fi
          done
          NOTES+="\n\nQuality: ${{ inputs.quality }} | Commit: ${{ github.sha }}"

          # Create release with video files attached
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$(echo -e "$NOTES")" \
            videos/output/final/*.mp4
