name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install CJK fonts for matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          rm -rf ~/.cache/matplotlib

      - name: Sync deps
        run: uv sync --all-groups

      - name: Create data symlinks for notebook execution
        run: |
          for dir in book book/chapters book/chapters/exercises book/chapters/solutions book/chapters/notebooks; do
            if [ -d "$dir" ]; then
              rel=$(python3 -c "import os.path; print(os.path.relpath('data', '$dir'))")
              ln -sfn "$rel" "$dir/data"
            fi
          done

      - name: Run tests
        run: uv run pytest

      - name: Build Jupyter Book
        run: uv run jupyter-book build book/
