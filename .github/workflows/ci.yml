name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repo (tests + book build), never writes.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.6.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install CJK fonts for matplotlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          rm -rf ~/.cache/matplotlib

      - name: Sync deps
        run: uv sync --group dev

      - name: Create data symlinks for notebook execution
        run: |
          for dir in book book/chapters book/chapters/exercises book/chapters/solutions book/chapters/notebooks; do
            if [ -d "$dir" ]; then
              rel=$(python3 -c "import os.path; print(os.path.relpath('data', '$dir'))")
              ln -sfn "$rel" "$dir/data"
            fi
          done

      - name: Run tests
        run: uv run pytest

      - name: Check video embeds match youtube_ids.yaml
        run: uv run python videos/sync_video_embeds.py --check

      # Manim scenes are never imported by pytest and are only executed by the
      # (manually dispatched) video workflow, so a plain NameError in one can sit
      # undetected until someone spends a build on it -- which is exactly what
      # `RIGHT` in ch13_01 did. F821/E9 catch that class without dragging in the
      # unused-import and unused-variable noise these files are full of.
      - name: Lint video scenes for undefined names
        run: uv run ruff check videos/ --select F821,E9

      - name: Build Jupyter Book (student edition — matches deploy)
        run: |
          cp book/_toc_student.yml book/_toc.yml
          uv run jupyter-book build book/
