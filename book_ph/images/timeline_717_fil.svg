nchor="middle"><tspan x="580.0" dy="0.0">7</tspan></text><text x="562" y="245" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle"><tspan x="562" dy="0.0">≤ 7 araw</tspan><tspan x="562" dy="20.0">para mag-respond</tspan></text><text x="405" y="300" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="16" font-weight="700" fill="#CE1126" text-anchor="middle"><tspan x="405" dy="0.0">≤ 1 araw</tspan><tspan x="405" dy="20.0">para mag-notify</tspan></text><path d="M405 210 V262" stroke="#CE1126" stroke-width="2" stroke-dasharray="3 4"/><circle cx="80" cy="190" r="26" fill="#fff" stroke="#1C1B29" stroke-width="4"/><g transform="translate(80 190)"><circle r="11" fill="#CE1126"/><circle cx="15.0" cy="0.0" r="3.4" fill="#CE1126"/><circle cx="10.6" cy="10.6" r="3.4" fill="#CE1126"/><circle cx="0.0" cy="15.0" r="3.4" fill="#CE1126"/><circle cx="-10.6" cy="10.6" r="3.4" fill="#CE1126"/><circle cx="-15.0" cy="0.0" r="3.4" fill="#CE1126"/><circle cx="-10.6" cy="-10.6" r="3.4" fill="#CE1126"/><circle cx="-0.0" cy="-15.0" r="3.4" fill="#CE1126"/><circle cx="10.6" cy="-10.6" r="3.4" fill="#CE1126"/></g><text x="80" y="252" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="17" font-weight="800" fill="#1C1B29" text-anchor="middle"><tspan x="80" dy="0.0">Emergence</tspan></text><circle cx="360" cy="190" r="26" fill="#fff" stroke="#1C1B29" stroke-width="4"/><g transform="translate(360 190)"><circle cx="-3" cy="-3" r="10" fill="none" stroke="#1C1B29" stroke-width="4"/><path d="M4 4 L13 13" stroke="#1C1B29" stroke-width="5" stroke-linecap="round"/></g><text x="360" y="46" font-family="system-ui,'Segoe UI',Roboto,'Helvetica N