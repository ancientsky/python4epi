<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">The CESU office</title><desc id="d">Inside the city epidemiology and surveillance unit on a rainy afternoon: Maya sits at her desk behind a laptop showing a rising epidemic curve with a small star (Tala) in the corner, beside stacks of paper notification forms and a red mug. Behind her are a jalousie window with rain, a pinned city map with case dots along the river, a wall calendar, a clock, an electric fan and a potted snake plant.</desc><style>.fan{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}.rain{animation:rain 1s linear infinite}@keyframes rain{from{transform:translateY(-16px)}to{transform:translateY(8px)}}.steam path{animation:steam 2.4s ease-in-out infinite}@keyframes steam{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.9;transform:translateY(-4px)}}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.2s ease-out both}@keyframes grow{from{transform:scaleY(0)}}.twinkle{animation:tw 2s ease-in-out infinite}@keyframes tw{50%{opacity:.4}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><defs><clipPath id="frame"><rect x="2" y="2" width="796" height="446" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><rect width="800" height="450" fill="#F3E3C3"/><rect y="0" width="800" height="40" fill="#EAD6B0"/><rect y="330" width="800" height="120" fill="#C89B6D"/><path d="M0 330 H800" stroke="#9B6F45" stroke-width="4"/><path d="M60 330 L0 450" stroke="#B5885B" stroke-width="2"/><path d="M170 330 L110 450" stroke="#B5885B" stroke-width="2"/><path d="M280 330 L220 450" stroke="#B5885B" stroke-width="2"/><path d="M390 330 L330 450" stroke="#B5885B" stroke-width="2"/><path d="M500 330 L440 450" stroke="#B5885B" stroke-width="2"/><path d="M610 330 L550 450" stroke="#B5885B" stroke-width="2"/><path d="M720 3