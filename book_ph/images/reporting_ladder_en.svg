<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="t d" xml:lang="en"><title id="t">The Philippine surveillance reporting ladder</title><desc id="d">A staircase of six levels: Barangay Health Worker, RHU or health centre, CESU or MESU, PESU, RESU and the DOH Epidemiology Bureau. Report dots climb up the stairs; a dashed feedback line runs back down.</desc><style>.flow{stroke-dasharray:10 8;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.flowdown{animation:fd 2s linear infinite}@keyframes fd{to{stroke-dashoffset:28}}.dot{animation:climb 3.6s ease-in infinite;opacity:0}@keyframes climb{0%{opacity:0;transform:translateY(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><rect x="2" y="2" width="796" height="636" rx="24" fill="#FFF8EA" stroke="#1C1B29" stroke-width="4"/><path d="M82 536 V512" stroke="#2F7D32" stroke-width="5" fill="none" class="flow"/><path d="M74 522 l8 -12 l8 12Z" fill="#2F7D32"/><circle cx="82" cy="536" r="6" fill="#FCD116" stroke="#1C1B29" stroke-width="2" class="dot" style="animation-delay:0.0s"/><g class="step" style="animation-delay:0.0s"><rect x="30" y="536" width="390" height="74" rx="16" fill="#fff" stroke="#1C1B29" stroke-width="3"/><rect x="30" y="536" width="10" height="74" rx="5" fill="#2F7D32"/><g transform="translate(82 573.0)"><circle r="23" fill="#2F7D32" stroke="#1C1B29" stroke-width="3"/><circle cy="-8" r="7" fill="#fff"/><path d="M-12 14 Q-12 0 0 0 Q12 0 12 14Z" fill="#fff"/></g><text x="120" y="568" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="21" font-weight="800" fill="#1C1B29" text-anchor="start"><tspan x="120" dy="0.0">BHW</tspan></text><text x="120" y="592" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="15.5" font-weight="500" fill="#4B4A5C" text-anchor="start"><tspan x="120" dy="0.0">Barangay Health Worker · barangay</tspan></text></g><path d="M138 438 V414" stroke="#00838F" stroke-width="5" fill="none" class="flow"/><path d="M130 424 l8 -12 l8 12Z" fill="#00838F"/><circle cx="138" cy="438" r="6" fill="#FCD116" stroke="#1C1B29" stroke-width="2" class="dot" style="animation-delay:0.6s"/><g class="step" style="animation-delay:0.15s"><rect x="86" y="438" width="390" height="74" rx="16" fill="#fff" stroke="#1C1B29" stroke-width="3"/><rect x="86" y="438" width="10" height="74" rx="5" fill="#00838F"/><g transform="translate(138 475.0)"><circle r="23" fill="#00838F" stroke="#1C1B29" stroke-width="3"/><path d="M-5 -14 h10 v9 h9 v10 h-9 v9 h-10 v-9 h-9 v-10 h9Z" fill="#fff"/></g><text x="176" y="470" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="21" font-weight="800" fill="#1C1B29" text-anchor="start"><tspan x="176" dy="0.0">RHU / Health Centre</tspan></text><text x="176" y="494" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="15.5" font-weight="500" fill="#4B4A5C" text-anchor="start"><tspan x="176" dy="0.0">rural health unit · health centre</tspan></text></g><path d="M194 340 V316" stroke="#0038A8" stroke-width="5" fill="none" class="flow"/><path d="M186 326 l8 -12 l8 12Z" fill="#0038A8"/><circle cx="194" cy="340" r="6" fill="#FCD116" stroke="#1C1B29" stroke-width="2" class="dot" style="animation-delay:1.2s"/><g class="step" style="animation-delay:0.3s"><rect x="142" y="340" width="390" height="74" rx="16" fill="#fff" stroke="#1C1B29" stroke-width="3"/><rect x="142" y="340" width="10" height="74" rx="5" fill="#0038A8"/><g transform="translate(194 377.0)"><circle r="23" fil