<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d"><title id="t">Flooded riverside after Typhoon Amihan</title><desc id="d">Under a grey sky and steady rain, the Marilag River has flooded a riverside barangay: stilt houses stand in brown water, palms lean in the wind, two men wade waist-deep carrying a plank of debris, and a rescuer in a blue outrigger boat paddles nearby. Light breaks through the clouds on the right.</desc><style>.rain{animation:rain .9s linear infinite}@keyframes rain{from{transform:translate(0,-26px)}to{transform:translate(-8px,0)}}.wave{animation:wave 6s ease-in-out infinite alternate}@keyframes wave{to{transform:translateX(-100px)}}.wave2{animation:wave2 3s ease-in-out infinite alternate}@keyframes wave2{to{transform:translateX(18px)}}.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(5px) rotate(.6deg)}}.drift{animation:drift 30s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(30px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><defs><clipPath id="frame"><rect x="2" y="2" width="796" height="446" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E7391"/><stop offset="1" stop-color="#AFC0D3"/></linearGradient><linearGradient id="flood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A7A5C"/><stop offset="1" stop-color="#5E5340"/></linearGradient></defs><rect width="800" height="450" fill="url(#sky)"/><g opacity=".9"><path d="M560 0 L800 0 L800 200Z" fill="#FCE9A0" opacity=".35"/><path d="M620 0 L800 0 L800 120Z" fill="#FCE9A0" opacity=".35"/></g><g class="drift"><g transform="translate(140 60)"><g fill="#4A5B74" opacity="1"><ellipse cx="0" cy="0" rx="110.0" ry="38.5"/><circle cx="-39.6" cy="-30.8" r="46.199999999999996"/><circle cx="30.800000000000004" cy="-42.35" r="57.75"/></g></g><g t