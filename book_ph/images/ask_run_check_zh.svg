<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="t d" xml:lang="zh-Hant"><title id="t">提問、執行、檢查的循環</title><desc id="d">循環中的三站。提問：說清楚欄位名稱，只給假的範例資料。執行：在 Colab 執行並讀懂錯誤訊息。檢查：用能手算的小例子驗證。從檢查回到提問的虛線箭頭表示修正後再問一次；星星 Tala 在中央。</desc><style>.flow{stroke-dasharray:10 8;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.pulse{animation:pulse 2.7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.08);opacity:.6}}.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}</style><rect x="2" y="2" width="856" height="536" rx="24" fill="#FFF8EA" stroke="#1C1B29" stroke-width="4"/><path d="M282 168 Q430 120 570 168" stroke="#0038A8" stroke-width="6" fill="none" class="flow"/><path d="M566 156 l18 16 l-23 5Z" fill="#0038A8"/><path d="M672 274 Q676 390 528 420" stroke="#CE1126" stroke-width="6" fill="none" class="flow"/><path d="M534 408 l-18 13 l20 7Z" fill="#CE1126"/><path d="M336 420 Q190 420 190 290" stroke="#2F7D32" stroke-width="6" fill="none" stroke-dasharray="12 10" class="flow"/><path d="M180 296 l10 -18 l10 18Z" fill="#2F7D32"/><text x="196" y="470" font-family="system-ui,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC','PingFang TC','Microsoft JhengHei','Noto Sans CJK TC',sans-serif" font-size="18" font-weight="700" fill="#2F7D32" text-anchor="middle"><tspan x="196" dy="0.0">修正 · 再問一次</tspan></text><g class="pulse" style="animation-delay:0.0s"><circle cx="200" cy="190" r="86" fill="#0038A8" opacity=".12"/></g><circle cx="200" cy="190" r="70" fill="#0038A8" stroke="#1C1B29" stroke-width="4"/><g transform="translate(200 168)"><path d="M-24 -18 h48 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-26 l-12 12 v-12 h-10 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8Z" fill="#fff" stroke="#1C1B29" stroke-width="3"/><path d="M-6 -6 q6 -8 12 0 q0 6 -6 