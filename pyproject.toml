[project]
name = "epi-with-python"
version = "0.1.0"
description = "A practical epidemiology learning site with Python, ML, and DL"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Epi With Python Contributors" }]
dependencies = [
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "scipy>=1.14.0",
  "statsmodels>=0.14.4",
  "scikit-learn>=1.6.0",
  "matplotlib>=3.10.0",
  "seaborn>=0.13.0",
  "plotly>=6.0.0",
  "geopandas>=1.0.0",
  "jupyterlab>=4.3.0",
  "jupyter-book>=1.0.0,<2",
  "nbclient>=0.10.0",
  "torch>=2.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
