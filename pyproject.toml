[project]
name = "epi-with-python"
version = "0.1.0"
description = "A practical epidemiology learning site with Python, ML, and DL"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Epi With Python Contributors" }]
dependencies = [
  "numpy>=2.2.0",
  # lifelines 0.30.1+ declares pandas<3.0 (0.30.0 has no cap), so this resolves lifelines 0.30.0;
  # revisit when lifelines publishes a pandas-3 release
  "pandas>=3.1",
  "scipy>=1.14.0",
  "statsmodels>=0.14.4",
  "scikit-learn>=1.6.0",
  "xgboost>=2.1.0",
  "shap>=0.46.0",
  "matplotlib>=3.10.0",
  "seaborn>=0.13.0",
  "plotly>=6.0.0",
  "geopandas>=1.0.0",
  "esda>=2.10.0",
  "libpysal>=4.12.0",
  "jupyterlab>=4.3.0",
  "jupyter-book>=2.1.7,<3",
  "nbclient>=0.10.0",
  "torch>=2.6.0",
  "lifelines>=0.29.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "fpdf2>=2.8.0",
  "prophet>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.15.0",
  # tests/test_book_toc.py parses the myst.yml files
  "pyyaml>=6.0",
]
video = [
  # The code targets the Code() API introduced in v0.20
  # (background_config/paragraph_config/formatter_style), so pre-0.20 breaks
  # CodePanel. Verified on 0.20.1 and 0.22.1 (layout check of all 244 scripts
  # plus real renders); before raising the upper bound, repeat that check. See
  # the video-production skill, "Manim API compatibility".
  "manim>=0.20.1,<0.23",
  "edge-tts>=6.1.0",
  "pyyaml>=6.0",
]
timesfm = [
  # Optional: runs the real TimesFM 3.0 model in notebooks/11_dl_timesfm.ipynb and
  # regenerates data/tsfm_cache/ (scripts/make_timesfm_cache.py). Not needed to build
  # the book, which replays the committed cache. `uv sync --group timesfm`.
  # TimesFM 3.0 *weights* are non-commercial only (see src/epi_learning/tsfm.py).
  "timesfm[torch]>=3.0.2",
  # huggingface-hub 2.x pulls httpx2, which would bump idna for the default install too
  "huggingface-hub>=0.28,<2",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
