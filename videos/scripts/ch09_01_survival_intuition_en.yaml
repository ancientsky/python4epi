meta:
  chapter: "09"
  concept: "survival_intuition"
  title: "Survival Analysis, Plain and Simple: the Phone Battery Race"
  voice: "en-US-AriaNeural"
  rate: "+6%"
  pitch: "+0Hz"
  lang: "en"
  scene_module: "scenes.ch09_01_survival_intuition"
  scene_class: "Ch09SurvivalIntuitionScene"

segments:
  - id: "intro"
    narration: >
      Does the phrase "survival analysis" make you want to take a nap? Don't worry.
      In this episode we swap every scary bit of jargon for something you use every
      single day: your phone battery. Watch this, then go back and look at those KM
      curves again, and you'll catch yourself saying: oh, that's all it was!
    animation: "show_title"
    pause_after: 0.5

  - id: "battery_race"
    narration: >
      Picture the whole class each bringing a fully-charged phone for a race: whose
      phone lasts longest before the battery dies and it shuts off. Survival analysis
      doesn't care whether a phone dies, because every one of them dies eventually.
      What it cares about is how long it lasted before dying. It looks not just at
      whether something happens, but at how long until it happens, and that's exactly
      what makes it powerful.
    animation: "show_battery_race"
    pause_after: 0.5

  - id: "time_to_event"
    narration: >
      The phone powering off is the "event" we're waiting for. In a hospital, the event
      might be death, recovery and discharge, or relapse. The number of hours from full
      charge to shutoff is the "survival time." Strap a stopwatch on each person: press
      start at symptom onset, press stop at death, and the seconds ticking in between
      are the data we want.
    animation: "show_time_to_event"
    pause_after: 0.5

  - id: "censoring_intuition"
    narration: >
      Here's the key part: halfway through the race the bell rings, you have to go home,
      and several phones are still on. How do you record those? Write zero hours? No,
      that phone clearly lasted a long time. Write broken, no data? No either, it's
      perfectly fine. The right answer is: this one lasted at least twelve hours, but I
      never got to see how long it would actually go. That half-a-story you only saw part
      of is called "censoring."
    animation: "show_censoring_intuition"
    pause_after: 0.5

  - id: "km_staircase"
    narration: >
      Put time on the horizontal axis and the fraction of phones still on on the vertical
      axis. Every time one phone dies, the line takes a step down, which is why the
      Kaplan-Meier curve looks like a staircase heading downward. A steeper staircase
      means phones are dying one after another fast, so survival is poor. A flatter
      staircase means they're long-lasting and hold on, so survival is good.
    animation: "show_km_staircase"
    pause_after: 0.5

  - id: "battery_code"
    narration: >
      The code is super short: build a KaplanMeierFitter, feed it two columns, how long
      it lasted and whether it died, then just tell it to plot the survival function.
      lifelines handles the censored phones automatically, so not a single one goes to
      waste. Congratulations, you've just done a full survival analysis!
    animation: "show_battery_code"
    code: |
      from lifelines import KaplanMeierFitter

      kmf = KaplanMeierFitter()
      kmf.fit(phones["hours"], event_observed=phones["died"], label="battery")
      kmf.plot_survival_function()
      print(kmf.median_survival_time_)  # half the phones are off by here
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      Three core ideas to take away. One, survival analysis looks at how long until
      something happens, not just whether it happens. Two, censoring isn't the phone
      dying and it isn't the phone being broken, it's a story we only saw half of, and it
      still counts. Three, the KM curve is a descending staircase, steeper is worse and
      flatter is better.
    animation: "show_main_summary"
    pause_after: 0.5

  - id: "extra_banner"
    narration: >
      Extra example: swap the phones for COVID-19 patients in the ICU!
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_covid"
    narration: >
      A severe COVID patient goes into intensive care, and we want to know how long they
      last after being put on a ventilator. Death is the phone powering off, being
      successfully extubated and discharged is censoring, and the number of days they
      hold on is the survival time. Same stopwatch thinking, same KaplanMeierFitter, just
      swap the disease and it works just as well.
    animation: "show_extra_covid"
    pause_after: 0.5

  - id: "blindspot_banner"
    narration: >
      Three beginner blind spots for survival analysis!
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      Blind spot number one: throwing away every phone that's still on and keeping only
      the ones that died. That's the same as deleting all your best, longest-lasting
      phones, and it badly underestimates survival time. The right move is to feed the
      censored rows into fit too, just set event to 0.
    animation: "show_blindspot_drop_censored"
    error_code: "deaths = cases[cases.event == 1]  # dropped survivors"
    correct_code: "kmf.fit(cases.time, event_observed=cases.event)"
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      Blind spot number two: reading the KM curve's vertical axis as the fraction who
      died. It's actually the fraction still alive, starting at 100 percent and dropping.
      If you want the fraction dead, remember to take one minus it.
    animation: "show_blindspot_yaxis"
    error_code: "pct_dead = kmf.survival_function_  # this is survival"
    correct_code: "pct_dead = 1 - kmf.survival_function_"
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      Blind spot number three: reading median survival time as "everyone dies on that
      day." What it really means is that half the people are still alive at that day, and
      only the other half have had the event, so don't go scaring yourself.
    animation: "show_blindspot_median"
    error_code: "everyone_dead_by = kmf.median_survival_time_"
    correct_code: "half_still_alive_at = kmf.median_survival_time_"
    pause_after: 0.5

  - id: "outro"
    narration: >
      You've run one round of the phone battery race, so survival time, censoring, and
      the descending staircase curve all make sense now! Next episode we'll pin down
      censoring properly: why you can't drop the censored people, and exactly how to fill
      in the event flag as 1 or 0. See you next time!
    animation: "show_outro"
    pause_after: 1.0
