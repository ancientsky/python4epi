meta:
  chapter: "01"
  concept: "functions"
  title: "Functions: Wrap Logic into a Reusable Tool"
  voice: "en-US-AriaNeural"
  rate: "+6%"
  pitch: "+0Hz"
  lang: "en"
  scene_module: "scenes.ch01_06_functions"
  scene_class: "Ch01FunctionsScene"

segments:
  # ========================================
  # [A] Main lesson: functions
  # ========================================
  - id: "intro"
    narration: >
      Welcome to the final lesson of Chapter 1!
      By now you've learned variables, arithmetic, dictionaries, lists, and conditionals.
      Now for the most powerful concept of all: functions.
      Picture a function as an automatic calculator.
      You feed it ingredients, and it computes the result and hands it back.
      Write it once, use it everywhere!
    animation: "show_title"
    pause_after: 0.5

  - id: "define_function"
    narration: >
      We define a function with the def keyword.
      def calc_attack_rate, and inside the parentheses are the parameters: cases and population.
      The text inside the triple quotes is documentation, called a docstring.
      Then we add a safety check: if population is 0, raise an error.
      Finally, return hands the result back.
      return is like a chef bringing the finished dish out - without it, you never get your result.
    animation: "show_define_function"
    code: |
      def calc_attack_rate(cases, population):
          """Calculate the attack rate."""
          if population == 0:
              raise ValueError("population (the denominator) cannot be 0")
          return cases / population
    pause_after: 0.5

  - id: "call_function"
    narration: >
      The function is defined - now how do we use it?
      Just call it and drop the ingredients in.
      calc_attack_rate paren 121 comma 280 computes the whole facility's attack rate.
      Call it again, paren 27 comma 47, for the third-floor B wing.
      Same function, different ingredients, different results.
      That's the power of a function: write once, reuse endlessly!
    animation: "show_call_function"
    code: |
      ar_all = calc_attack_rate(121, 280)
      print(f"Facility-wide attack rate: {ar_all:.2%}")

      ar_3b = calc_attack_rate(27, 47)
      print(f"Floor 3 wing B attack rate: {ar_3b:.2%}")
    output: "Facility-wide attack rate: 43.21%\nFloor 3 wing B attack rate: 57.45%"
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      Quick recap: def defines a function, return hands back the result.
      The parameters in the parentheses are the ingredients you feed in.
      Add a docstring to explain what it does, and add a safety check to avoid dividing by zero.
      Functions are one of the most core concepts in programming -
      master this and you've graduated from the beginner's village!
    animation: "show_main_summary"
    pause_after: 0.5

  # ========================================
  # [B] Extra public-health example: a general incidence-rate function
  # ========================================
  - id: "extra_banner"
    narration: >
      One more example to show off how versatile functions are!
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_example"
    narration: >
      This time we define a more general function: calc_incidence_rate.
      It computes the incidence rate - new cases divided by person-time.
      We add the same safety check: person-time can't be less than or equal to 0.
      Then we use it to compute the tuberculosis incidence rate: 42 new cases over 100,000 person-years of observation.
      The result is 0.0 cases per 100,000 person-years.
      Write the function once, and you can compute the incidence for TB, dengue, and COVID alike!
      That's the power of a function!
    animation: "show_extra_example"
    code: |
      def calc_incidence_rate(new_cases, person_time):
          """Calculate the incidence rate."""
          if person_time <= 0:
              raise ValueError("person-time must be greater than 0")
          return new_cases / person_time

      tb_ir = calc_incidence_rate(42, 100000)
      print(f"TB incidence rate: {tb_ir:.1f} per "
            f"100,000 person-years")
    output: "TB incidence rate: 0.0 per 100,000 person-years"
    pause_after: 0.5

  # ========================================
  # [C] Beginner blind spots
  # ========================================
  - id: "blindspot_banner"
    narration: >
      The three classic function traps!
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      Pitfall one: forgetting the parentheses when you call a function.
      You write calc_attack_rate but leave off the parentheses.
      It won't error, but it won't compute either.
      You've merely picked up the calculator to look at it - you never pressed the equals key.
      Add the parentheses to actually run the function.
    animation: "show_blindspot_no_parens"
    error_code: "result = calc_attack_rate\n# no parentheses -> just the function object\n# nothing is computed!"
    correct_code: "result = calc_attack_rate(121, 280)\n# with parentheses -> actually runs\n# → 0.4321"
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      Pitfall two: forgetting return.
      The function computes a result but never returns it.
      It's like a chef who finished cooking but never brought the dish out.
      What you print outside comes back as None, not the number you expected.
      Remember: if you compute it, you have to return it!
    animation: "show_blindspot_no_return"
    error_code: "def bad_func(a, b):\n    rate = a / b\n    # forgot to return!\n\nprint(bad_func(121, 280))\n# → None"
    correct_code: "def good_func(a, b):\n    rate = a / b\n    return rate  # hand it back!\n\nprint(good_func(121, 280))\n# → 0.4321..."
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      Pitfall three: getting the argument order wrong.
      calc_attack_rate paren 280 comma 121? You've put population where cases should go!
      The attack rate comes out as 231%? How could any place have a 231% attack rate?
      The ingredients must be swapped.
      This is exactly why we recommend meaningful parameter names - so one glance tells you which goes first.
    animation: "show_blindspot_wrong_order"
    error_code: "# numerator and denominator swapped\ncalc_attack_rate(280, 121)\n# → 2.314  (231%?!)"
    correct_code: "# cases first, population second\ncalc_attack_rate(121, 280)\n# → 0.432  (43.2% ✓)"
    pause_after: 0.5

  - id: "outro"
    narration: >
      Congratulations on finishing all six concepts of Chapter 1!
      You've learned variables, arithmetic, dictionaries, lists, conditionals, and functions.
      These are the fundamentals of doing epidemiological analysis in Python.
      In the next chapter we'll step into the world of pandas and analyze with real data tables.
      See you in Chapter 2!
    animation: "show_outro"
    pause_after: 1.0
