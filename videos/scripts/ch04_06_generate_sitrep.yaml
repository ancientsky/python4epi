meta:
  chapter: "04"
  concept: "generate_sitrep"
  title: "函式化——把 SitRep 包成一鍵更新"
  voice: "zh-TW-HsiaoChenNeural"
  rate: "-10%"
  scene_module: "scenes.ch04_06_generate_sitrep"
  scene_class: "Ch04GenerateSitrepScene"

segments:
  # ========================================
  # [A] 主線教學：包成函式
  # ========================================
  - id: "intro"
    narration: >
      嗨！前幾集你已經學會人、時、地的分析了。
      但問題來了：長官要你每天九點前更新 SitRep，
      你難道每天都要從頭到尾跑一次 notebook、手動改日期？
      今天教你一個救命技巧：把所有步驟包成一個函式。
      以後只要呼叫一行 generate_sitrep，整份報告就自動更新。
      這就是「函式化」的威力，也是從初學者進階的關鍵一步。
    animation: "show_title"
    pause_after: 0.5

  - id: "function_design"
    narration: >
      函式的設計原則：輸入最少、輸出最全。
      generate_sitrep 只需要一個參數——CSV 檔案的路徑。
      裡面做三件事：讀取資料、清理資料、計算指標。
      最後回傳一個字典，裡面有所有 SitRep 需要的數字。
      為什麼回傳字典？因為字典可以直接餵給 Word、PPT、PDF 的產生器。
      一份資料，多種格式，不需要重複計算。
    animation: "show_function_design"
    code: |
      def generate_sitrep(csv_path):
          """From CSV to SitRep dict."""
          df = pd.read_csv(csv_path)
          # 1. Clean dates
          # 2. Derive columns
          # 3. Calculate metrics
          return {"infected": ..., "cfr": ...}
    pause_after: 0.5

  - id: "int_casting"
    narration: >
      一個很容易被忽略的小陷阱：pandas 的 sum 回傳的是 numpy.int64，
      不是 Python 原生的 int。
      大部分時候沒差，但如果你要把字典轉成 JSON——
      比如要傳給 API 或存成檔案——numpy.int64 會爆炸。
      JSON encoder 不認識它。解法超簡單：套一個 int() 就好。
      養成習慣，字典裡的數字一律用 int() 和 float() 包住。
    animation: "show_int_casting"
    code: |
      infected = int(df["infected"].sum())
      deaths = int((df["outcome"] == "dead").sum())
      # numpy.int64 -> Python int
      # Safe for JSON serialization
    pause_after: 0.5

  - id: "guard_clause"
    narration: >
      另一個防呆技巧：如果感染人數是零怎麼辦？
      CFR 等於死亡除以感染人數，感染人數是零就會 ZeroDivisionError。
      用一個簡單的 if else 就能防止。
      if infected 是 True 就算，else 就回傳零。
      這種防呆在英文叫 guard clause，養成習慣在除法前都加一道防線。
    animation: "show_guard_clause"
    code: |
      return {
          "cfr": round(deaths/infected*100, 1)
                 if infected else 0,
          "hospitalized": int(df["hospitalized"].sum()),
      }
    pause_after: 0.5

  - id: "call_function"
    narration: >
      函式寫好了，呼叫只要一行。
      明天 CSV 更新了？換個路徑重新呼叫就好。
      想要比較昨天和今天的 SitRep？呼叫兩次，存成兩個字典，
      然後比較每個 key 的差異。
      函式化的好處就是：邏輯寫一次，用無數次。
    animation: "show_call_function"
    code: |
      sitrep = generate_sitrep(
          "data/synthetic/legionella_outbreak.csv"
      )
      print(sitrep)
    output: |
      {'total_residents': 280, 'infected': 121,
       'attack_rate': 43.2, 'deaths': 19,
       'cfr': 15.7, 'hospitalized': 107, 'icu': 23}
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      重點整理！函式化的四個關鍵：
      第一，輸入一個路徑，輸出一個字典。
      第二，int() 包住 numpy 數字，避免 JSON 序列化問題。
      第三，除法前加 guard clause 防止除以零。
      第四，字典可以直接餵給多種輸出格式。
      從今天起，你的 SitRep 只需要一行就能更新。
    animation: "show_main_summary"
    pause_after: 0.5

  # ========================================
  # [B] 額外防疫範例：疫苗覆蓋率自動報表
  # ========================================
  - id: "extra_banner"
    narration: >
      場景切換！來看另一個函式化的實戰應用。
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_vaccine"
    narration: >
      台灣每年流感疫苗開打後，CDC 每週都要公布疫苗覆蓋率。
      如果每週都手動算，非常容易出錯。
      但如果你寫一個 generate_vaccine_report 函式，
      輸入最新的接種資料 CSV，輸出各年齡層、各縣市的覆蓋率，
      每週只要呼叫一次，報告就自動更新。
      函式化不只是程式設計的好習慣，更是公共衛生實務的生存技能。
    animation: "show_extra_vaccine"
    code: |
      def generate_vaccine_report(csv_path):
          df = pd.read_csv(csv_path)
          return {
              "total_doses": int(df["doses"].sum()),
              "coverage_65+": round(..., 1),
              "by_county": county_stats.to_dict(),
          }
    pause_after: 0.5

  # ========================================
  # [C] 初學者盲點
  # ========================================
  - id: "blindspot_banner"
    narration: >
      盲點時間！寫 SitRep 函式時，三個最常見的地雷。
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      第一個坑：函式裡面用了外部變數。
      你在函式外面定義了 df，然後函式裡面也用 df。
      第一次跑沒問題，因為外面的 df 還在記憶體裡。
      但如果你把函式搬到另一個檔案，或者在排程中跑，df 就找不到了。
      函式裡面的所有資料都應該從參數傳進來，不要偷吃外面的變數。
    animation: "show_blindspot_global_var"
    error_code: "def sitrep(): return df['infected'].sum()"
    correct_code: "def sitrep(csv): df = pd.read_csv(csv); ..."
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      第二個坑：回傳 DataFrame 而不是字典。
      DataFrame 很棒，但它不能直接丟進 JSON，
      也不能直接當作函式的輸入傳給另一個函式。
      字典是 Python 最基本的資料結構，可以被 JSON、API、模板引擎直接吃進去。
      SitRep 的指標是一組固定的 key-value，字典是最合適的格式。
    animation: "show_blindspot_return_df"
    error_code: "return classification  # a DataFrame"
    correct_code: 'return {"infected": 121, "cfr": 15.7}'
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      第三個坑：沒有加 docstring。
      三個月後你打開這個函式，忘了它需要什麼格式的 CSV。
      有 docstring 就像留了一張紙條給未來的自己。
      至少要寫：這個函式做什麼、參數是什麼、回傳什麼。
      三行的投資，能省三小時的困惑。
    animation: "show_blindspot_no_docstring"
    error_code: "def generate_sitrep(path):"
    correct_code: 'def generate_sitrep(path): """CSV to SitRep dict."""'
    pause_after: 0.5

  # ========================================
  # [D] 結尾
  # ========================================
  - id: "outro"
    narration: >
      恭喜！你的 SitRep 工作流已經函式化了。
      下一集是最後一哩路——把字典裡的數字變成漂亮的報告。
      Dashboard、Word、PPT、PDF，四種格式一次搞定。
      我們下支影片見！
    animation: "show_outro"
    pause_after: 1.0
