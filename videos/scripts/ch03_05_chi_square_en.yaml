meta:
  chapter: "03"
  concept: "chi_square"
  title: "The Chi-square Test: Observed vs Expected in the Ring"
  voice: "en-US-AriaNeural"
  rate: "+6%"
  pitch: "+0Hz"
  lang: "en"
  scene_module: "scenes.ch03_05_chi_square"
