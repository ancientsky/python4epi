meta:
  chapter: "07"
  concept: "lag_features"
  title: "Lag features：把時間序列變成迴歸資料"
  voice: "zh-TW-HsiaoChenNeural"
  rate: "-10%"
  scene_module: "scenes.ch07_03_lag_features"
  scene_class: "Ch07LagFeaturesScene"

segments:
  - id: "intro"
    narration: >
      這一集我們解鎖時間序列最萬用的魔法——lag features。
      它的威力在於：把時間序列「攤平」成一張普通的迴歸表格，
      從此你所有學過的迴歸技巧——Poisson、logistic、random forest——
      通通都能拿來做時序預測。
      看完這集，ARIMA 這種神秘模型也會覺得親切。
    animation: "show_title"
    pause_after: 0.5

  - id: "problem_regression_needs_table"
    narration: >
      為什麼要攤平？
      因為迴歸要的是「每一列都是一個獨立樣本」的表格。
      但時間序列的每一列本身就跟前後相關，不獨立。
      怎麼辦？把「昨天的值」搬進「今天這一列」變成一個欄位！
      這樣今天預測時，模型還是能看到昨天的資訊。
      這就是 lag features 的核心邏輯。
    animation: "show_problem"
    pause_after: 0.5

  - id: "shift_concept"
    narration: >
      shift 的作用：把整欄往下推。
      原始 cases 欄：5、8、12、15、10。
      shift(1) 之後：NaN、5、8、12、15。
      今天這一列的 lag_1 就是「昨天的 cases」。
      shift(2) 就是前天，shift(7) 就是上週同一天。
      一個 shift，串起時間。
    animation: "show_shift_concept"
    pause_after: 0.5

  - id: "build_lag_table"
    narration: >
      完整程式碼四行搞定。
      一、reset_index 把日期變成欄位。
      二、新增 day_idx 當時間趨勢變項。
      三、shift(1) 造 lag_1、shift(2) 造 lag_2。
      四、dropna 掉前兩列（因為 lag_2 讓前兩天是 NaN）。
      產物：一張乾淨的表，每列四個欄位：cases、day_idx、lag_1、lag_2。
    animation: "show_build_lag_table"
    code: |
      ts = daily.to_frame("cases").reset_index(names="date")
      ts["day_idx"] = range(len(ts))
      ts["lag_1"] = ts["cases"].shift(1)
      ts["lag_2"] = ts["cases"].shift(2)
      ts_model = ts.dropna().reset_index(drop=True)
    pause_after: 0.5

  - id: "how_many_lags"
    narration: >
      要加幾個 lag？這有學問。
      太少（只用 lag_1）：捕捉不到週期，預測生硬。
      太多（lag_1 到 lag_14）：參數比樣本多、過度配適。
      實務經驗：短序列 outbreak 17 天用 lag_1、lag_2。
      長序列 90 天以上，可以加到 lag_7（上週同一天）。
      ACF 圖也可以幫你選——下下集會講。
    animation: "show_how_many_lags"
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      四步驟總結。
      一、reset_index 攤平日期。
      二、新增 day_idx 當趨勢。
      三、shift 造 lag_1、lag_2。
      四、dropna 清 NaN。
      從此時間序列變成迴歸表格，世界突然好寬廣。
    animation: "show_main_summary"
    pause_after: 0.5

  - id: "extra_banner"
    narration: >
      額外範例：SARS 2003 每日通報！
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_sars"
    narration: >
      2003 年 SARS 期間台灣和平醫院封院。
      事後的研究把每日通報數做成時間序列，
      加 lag_1 到 lag_7，跑 Poisson regression，
      發現 lag_1 和 lag_7（上週同一天）的係數最大。
      翻譯白話：「今天的通報數，昨天最重要，其次是上週同一天」。
      這個 lag_7 的發現，啟發後續監測系統納入「星期幾」當變項。
      一個 shift(7)，救了公衛通報效率。
    animation: "show_extra_sars"
    pause_after: 0.5

  - id: "blindspot_banner"
    narration: >
      Lag features 三大坑！
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      第一個坑：shift(-1) 是未來，不是過去！
      shift 正數是「往下推」（昨天搬到今天）。
      shift 負數是「往上推」（明天搬到今天）——data leakage！
      記憶法：shift 正數 = 過去；負數 = 未來（千萬別）。
    animation: "show_blindspot_shift_neg"
    error_code: "ts['lag_1'] = ts['cases'].shift(-1)"
    correct_code: "ts['lag_1'] = ts['cases'].shift(1)"
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      第二個坑：忘記 dropna。
      NaN 留著跑 glm 直接報錯，或者被 statsmodels 自動忽略後樣本變很少。
      造 lag 之後立刻 dropna 是 SOP。
    animation: "show_blindspot_no_dropna"
    error_code: "ts_model = ts  # still has NaN"
    correct_code: "ts_model = ts.dropna().reset_index(drop=True)"
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      第三個坑：lag 太多造成 collinearity。
      lag_1 和 lag_2 通常高度相關（昨天和前天常常差不多）。
      如果加到 lag_10，共線性爆炸，係數不穩。
      解法：先檢查相關矩陣，高相關的 lag 二選一；或用 PCR / Ridge。
      簡單規則：outbreak 資料 2 個 lag 就夠，不要貪心。
    animation: "show_blindspot_too_many_lags"
    error_code: "for k in range(1, 15): ts[f'lag_{k}'] = ts['cases'].shift(k)"
    correct_code: "ts['lag_1'] = ts['cases'].shift(1); ts['lag_2'] = ts['cases'].shift(2)"
    pause_after: 0.5

  - id: "outro"
    narration: >
      lag 造完了！下一集我們把這張表丟給 Poisson regression，
      學會怎麼解讀 IRR，算「昨天多 1 人，今天多幾 %」。
      下支影片見！
    animation: "show_outro"
    pause_after: 1.0
