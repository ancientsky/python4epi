meta:
  chapter: "05"
  concept: "confounder_concept"
  title: "干擾因子的三要件——誰才算共犯"
  voice: "zh-TW-HsiaoChenNeural"
  rate: "+8%"
  pitch: "+8Hz"
  scene_module: "scenes.ch05_01_confounder_concept"
  scene_class: "Ch05ConfounderConceptScene"

segments:
  - id: "intro"
    narration: >
      嗨！歡迎來到第五章，分層分析。
      在衝去算程式碼之前，先問你一個問題：
      穿雨衣的人比較容易感冒，所以是雨衣害你生病的嗎？
      當然不是！是因為下雨天——下雨讓你穿雨衣，下雨也讓你容易著涼。
      下雨天就是那個藏在背後搞混你判斷的幕後黑手，流行病學叫做「干擾因子」。
      今天這支影片，手把手帶你搞懂什麼才算真正的干擾因子。
    animation: "show_title"
    pause_after: 0.5

  - id: "raincoat_metaphor"
    narration: >
      來看這張關係圖。穿雨衣和感冒看起來有關聯，這是你觀察到的現象。
      但真正的因果是：下雨天這個共同的原因，同時推動了穿雨衣和感冒。
      如果你只看雨衣跟感冒的相關性，沒有控制「下雨」，
      就會得到一個假的結論：穿雨衣會害你感冒。
      流行病學的世界裡，這種陷阱到處都是。
    animation: "show_raincoat"
    pause_after: 0.5

  - id: "three_criteria"
    narration: >
      那麼怎麼判斷一個變項是不是干擾因子？流行病學教科書給你三個條件。
      第一，它必須跟暴露有關聯。
      第二，它必須跟結果有關聯。
      第三，它不能是暴露到結果的中間變項。
      三個條件少一個都不算。像偵探辦案，動機、機會、證據，三樣缺一不可。
    animation: "show_three_criteria"
    pause_after: 0.5

  - id: "legionella_example"
    narration: >
      來看我們的退伍軍人桿菌案例。
      暴露是淋浴使用，結果是感染。
      資深疫調人員懷疑「功能狀態」是干擾因子，我們一條一條驗證。
      第一條，功能狀態跟淋浴有關嗎？有，能走動的人才走得進淋浴間。
      第二條，功能狀態跟感染有關嗎？有，能走動的人活動範圍大，接觸水霧機會也多。
      第三條，功能狀態是中間變項嗎？不是，沒有人是因為先洗澡才變能走動的，因果方向不對。
      三條都成立，功能狀態確實是干擾因子。
    animation: "show_legionella_case"
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      快速複習。干擾因子三要件，缺一不可：
      第一，跟暴露相關。
      第二，跟結果相關。
      第三，不是中間變項。
      下一支影片我們會用 DAG 圖把這個關係畫出來，讓你一眼看穿因果路徑。
    animation: "show_main_summary"
    pause_after: 0.5

  - id: "extra_banner"
    narration: >
      場景切換！來看一個夜市小吃攤的防疫例子。
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_night_market"
    narration: >
      夏天夜市鹽酥雞攤連續發生急性腸胃炎，衛生所懷疑鹽酥雞有問題。
      可是你比對「吃鹽酥雞」和「腹瀉」，看起來高度相關。
      等等！天氣熱同時推動：一，大家愛吃夜市；二，食物容易壞也容易腹瀉。
      這時候「氣溫」就是干擾因子。
      正確做法是按氣溫分層，或是限定在同一個溫度範圍分析，
      才能看出鹽酥雞本身是不是真的有問題。
      一樣的三要件邏輯，換個場景完全適用。
    animation: "show_extra_night_market"
    pause_after: 0.5

  - id: "blindspot_banner"
    narration: >
      接下來三個初學者最容易踩的地雷！
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      第一個坑：看到相關就說是干擾因子。
      統計相關不等於因果關係。
      可能只是巧合，也可能是反向因果。
      務必驗完三個條件，特別是第三條「不是中間變項」，才能說它是干擾因子。
    animation: "show_blindspot_correlation"
    error_code: "if corr(C, E) > 0.3: confounders.append(C)"
    correct_code: "if passes_three_criteria(C, E, D): confounders.append(C)"
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      第二個坑：把中間變項當干擾因子來控制，叫做過度調整。
      例如吸菸導致肺功能下降，肺功能下降導致肺癌。
      如果你把「肺功能」當干擾因子去控制，你就抹掉了吸菸真正的因果效應。
      中間變項要的是路徑分析，不是控制。
    animation: "show_blindspot_mediator"
    error_code: "model.adjust_for(['smoking', 'lung_function'])"
    correct_code: "model.adjust_for(['age', 'sex'])  # NOT mediators"
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      第三個坑：只驗一個條件就下結論。
      看到 C 和暴露相關，就直接說 C 是干擾因子。
      錯！如果 C 跟結果沒有關聯，它就不會造成虛假關聯，不是干擾因子。
      三個條件是聯集概念，每一個都要驗證，不是三選一。
    animation: "show_blindspot_one_criterion"
    error_code: "if chi2(C, exposure).pvalue < 0.05: confound = True"
    correct_code: "check_all_three_criteria(C, exposure, outcome)"
    pause_after: 0.5

  - id: "outro"
    narration: >
      恭喜你掌握了干擾因子的三要件！
      下一集我們來畫 DAG，有向無環圖，讓你用畫的就能找出所有藏在暗處的干擾路徑。
      我們下支影片見！
    animation: "show_outro"
    pause_after: 1.0
