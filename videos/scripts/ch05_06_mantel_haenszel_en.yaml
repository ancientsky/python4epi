meta:
  chapter: "05"
  concept: "mantel_haenszel"
  title: "Mantel-Haenszel Weighting: A Fair Term Grade"
  voice: "en-US-AriaNeural"
  rate: "+6%"
  pitch: "+0Hz"
  lang: "en"
  scene_module: "scenes.ch05_06_mantel_haenszel"
  scene_class: "Ch05MantelHaenszelScene"

segments:
  - id: "intro"
    narration: >
      Hi! We've already computed the RR for all three strata and drawn a forest plot.
      But the boss usually just wants one number: what exactly is the adjusted RR?
      How do you pool three strata's RRs into one?
      You can't simply average them, because the three strata have different numbers of people.
      That's when you reach for Mantel-Haenszel weighting.
      Today I'll walk you through this classic technique hands-on, and ten lines of code gets it done.
    animation: "show_title"
    pause_after: 0.5

  - id: "mh_intuition"
    narration: >
      Here's the spirit of MH weighting in one analogy: your term grade.
      Quizzes are only 20 percent, the final is 40 percent, and the report is 40 percent.
      The weights differ, so how do you get the total?
      Multiply each score by its weight, sum them, then divide by the total weight.
      MH works exactly the same way:
      each stratum's contribution is multiplied by that stratum's "weight,"
      and the weight is set by the stratum's sample size and its two-by-two table structure.
      Big strata contribute a lot, small strata contribute little.
    animation: "show_mh_intuition"
    pause_after: 0.5

  - id: "mh_formula"
    narration: >
      The MH formula looks scary, but it's really simple.
      The numerator is a times c plus d, divided by that stratum's total N, summed over all strata.
      The denominator is c times a plus b, divided by that stratum's total N, summed over all strata.
      You don't need to memorize the formula, just know this:
      every stratum contributes to the numerator and the denominator, and dividing them at the end gives the weighted RR.
    animation: "show_mh_formula"
    pause_after: 0.5

  - id: "mh_code"
    narration: >
      The Python is very direct.
      Use two accumulator variables, numerator and denominator, initialized to 0.
      The for loop runs over every stratum in results_df.
      For each stratum, compute n_i, then add its contribution to the two accumulators.
      When the loop finishes, rr_mh equals numerator divided by denominator.
      And that's your adjusted RR.
    animation: "show_mh_code"
    code: |
      numerator, denominator = 0, 0
      for _, row in results_df.iterrows():
          a, b, c, d = row[["a","b","c","d"]]
          n = a + b + c + d
          numerator += a * (c + d) / n
          denominator += c * (a + b) / n
      rr_mh = numerator / denominator
      print(f"MH adjusted RR = {rr_mh:.3f}")
    output: |
      MH adjusted RR = 1.380
    pause_after: 0.5

  - id: "ten_percent_rule"
    narration: >
      Once you have the adjusted RR, how do you decide whether confounding is present?
      Use the 10 percent rule.
      The change equals the absolute value of crude RR minus adjusted RR, divided by the adjusted RR, times 100 percent.
      If the change is 10 percent or more, confounding really is present, and you should report the adjusted RR.
      If it's under 10 percent, the confounding isn't meaningful and the crude RR is honestly good enough.
      In our example: crude RR 2.45, adjusted 1.38, a 77 percent change, so the confounding is enormous.
    animation: "show_ten_percent_rule"
    code: |
      change = abs(crude_rr - rr_mh) / rr_mh * 100
      print(f"Change: {change:.1f}%")
      if change >= 10:
          print("Confounding present!")
          if crude_rr > rr_mh:
              print("Direction: inflated")
    output: |
      Change: 77.5%
      Confounding present!
      Direction: inflated
    pause_after: 0.5

  - id: "main_summary"
    narration: >
      Quick recap. Mantel-Haenszel in four steps.
      First, a for loop over every stratum.
      Second, accumulate a times c plus d, divided by N, as the numerator.
      Third, accumulate c times a plus b, divided by N, as the denominator.
      Fourth, divide numerator by denominator to get the adjusted RR.
      Then use the 10 percent rule to gauge the amount of confounding.
      Congratulations, you can now do the most classic confounding control there is.
    animation: "show_main_summary"
    pause_after: 0.5

  - id: "extra_banner"
    narration: >
      Scene change! Let's look at a classic case of Simpson's paradox.
    animation: "show_extra_banner"
    pause_after: 0.3

  - id: "extra_simpson"
    narration: >
      The 1973 admissions bias case at the University of California, Berkeley.
      On the surface, men were admitted at 44 percent and women at only 35 percent, so it looked like women faced bias.
      But once stratified by department, in every single department women were admitted at the same rate as men or higher.
      So why did the overall picture look like bias?
      Because women applied more to low-admit humanities, while men applied more to high-admit science and engineering.
      The "department applied to" is the confounder.
      After MH weighting, the overall admission ratio was close to 1, so the bias wasn't really there.
      That's Simpson's paradox, and stratified analysis saved the university's reputation.
    animation: "show_extra_simpson"
    code: |
      # Berkeley admission paradox
      # Crude: Male 44% vs Female 35%
      # Stratified by department: Female >= Male
      # MH adjusted RR ~ 1.0
    pause_after: 0.5

  - id: "blindspot_banner"
    narration: >
      Coming up, the three mistakes that trip up MH most often!
    animation: "show_blindspot_banner"
    pause_after: 0.3

  - id: "blindspot_1"
    narration: >
      Trap one: taking a plain arithmetic mean of the strata RRs.
      For example, three strata with RRs 1.5, 1.3, 1.2, averaged straight to 1.33.
      Wrong! That ignores each stratum's sample size.
      If the third stratum has only 10 people and the first has 200,
      their influence is completely different.
      You must use MH weighting; don't cut corners with an average.
    animation: "show_blindspot_simple_avg"
    error_code: "rr_adj = results_df['RR'].mean()"
    correct_code: "rr_mh = mh_numerator / mh_denominator"
    pause_after: 0.5

  - id: "blindspot_2"
    narration: >
      Trap two: using the wrong denominator in the 10 percent rule.
      Some people write it as dividing by the crude RR, and that's incorrect.
      The standard practice is to divide by the adjusted RR, because the adjusted RR is the better estimate of the "true value."
      Remember the formula: the absolute value of crude RR minus adjusted RR, divided by the adjusted RR.
    animation: "show_blindspot_denominator"
    error_code: "change = abs(crude - adj) / crude * 100"
    correct_code: "change = abs(crude - adj) / adj * 100"
    pause_after: 0.5

  - id: "blindspot_3"
    narration: >
      Trap three: forcing an MH value when there's interaction.
      If the strata RRs differ enormously, say 1.2 and 4.5,
      MH weights them into 2.8, a number that actually fits nobody.
      For the people with an RR of 1.2, 2.8 overestimates; for those at 4.5, 2.8 underestimates.
      In that case you should report by stratum, not report the MH value.
      The way to decide is a homogeneity test, which we'll cover in the next video.
    animation: "show_blindspot_interaction"
    error_code: "print(f'Adjusted RR = {rr_mh}')"
    correct_code: "if homogeneity_ok: print(rr_mh); else: print(per_stratum)"
    pause_after: 0.5

  - id: "outro"
    narration: >
      Congratulations, you've mastered Mantel-Haenszel weighting!
      In the next video we'll tackle a concept people constantly mix up:
      what exactly is the difference between effect modification and confounding, and when should you report by stratum?
      See you in the next one!
    animation: "show_outro"
    pause_after: 1.0
