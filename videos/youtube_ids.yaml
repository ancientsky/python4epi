# ============================================================================
# YouTube 影片連結對照表 / YouTube video registry
# ============================================================================
#
# 這是全站影片連結的「唯一真相來源」。填好之後執行：
#
#     uv run python videos/sync_video_embeds.py
#
# 就會把中英文兩版章節裡的影片卡片重新產生，並更新 videos/VIDEO_INDEX.md。
# 這個指令可以重複執行，不會累積髒東西（idempotent）。
#
# 怎麼填：
#   * key 就是影片腳本的檔名，也就是 GitHub Actions 產出的 mp4 檔名。
#     例如 ch08_04_morans_i.mp4 -> 填在 ch08_04_morans_i 的 zh:
#          ch08_04_morans_i_en.mp4 -> 填在 ch08_04_morans_i 的 en:
#   * 貼「完整網址」或「純影片 ID」都可以，兩種都認得：
#         zh: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
#         zh: "https://youtu.be/dQw4w9WgXcQ"
#         zh: "dQw4w9WgXcQ"
#   * 留空字串 "" = 還沒上傳。網站上就不會出現那張卡片（不會有死連結）。
#   * title_zh / title_en 是卡片上顯示的標題，可以自由修改。
#
# ============================================================================

